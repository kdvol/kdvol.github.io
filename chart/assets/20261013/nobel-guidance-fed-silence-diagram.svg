<text x="768.0" y="327.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">한은은 거꾸로, 금통위원</text>
<text x="768.0" y="363.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">금리 전망을 점으로 공개</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4760ms;--motion-accent-delay:5400ms">
<rect class="motion-node-shape" x="70.0" y="502.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="561.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">같은 이론인데 한은은 더 말하기, 연준은 입 닫기를 골랐음</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:6120ms;--motion-accent-delay:6760ms">
<rect class="motion-node-shape" x="70.0" y="708.0" width="940.0" height="118.0" rx="22" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="767.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">수요일 미국 9월 물가가 이달 말 인상 여부를 가름</text>
</g>
<line x1="72" y1="948" x2="1008" y2="948" stroke="#2A2724" stroke-width="2"/>
<text x="72" y="978" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="17" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
