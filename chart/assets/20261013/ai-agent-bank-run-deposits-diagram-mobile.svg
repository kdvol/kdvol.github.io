<text x="360.0" y="729.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">오늘 밤 은행 실적, 예금 이자 비용을 봄</text>
