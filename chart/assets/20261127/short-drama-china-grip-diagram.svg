<text x="426.0" y="455.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">중국이 4분의 3</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" style="--motion-delay:4080ms">
<path d="M 768.0 414.0 C 768.0 458.0, 540.0 458.0, 540.0 494.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="582.0" y="428.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="654.0" y="455.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">획득비가 이익 먹음</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" style="--motion-delay:5440ms">
<path d="M 540.0 620.0 L 540.0 700.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="468.0" y="634.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="661.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">웹툰 결제 습관</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="70.0" y="70.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="129.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">1~2분짜리 세로 드라마, 올해 세계에서 200억불</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:1360ms;--motion-accent-delay:2000ms">
<rect class="motion-node-shape" x="97.0" y="276.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="312.0" y="309.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">바이트댄스·텐센트·콰이쇼우는</text>
<text x="312.0" y="345.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">자기 숏폼 앱에 드라마를</text>
<text x="312.0" y="381.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">바로 띄움</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:2720ms;--motion-accent-delay:3360ms">
<rect class="motion-node-shape" x="553.0" y="276.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="768.0" y="309.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">중국 밖 앱은 광고비 내고</text>
<text x="768.0" y="345.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">돈 낼 시청자를 사 와야</text>
<text x="768.0" y="381.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">함</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="4" style="--motion-delay:4760ms;--motion-accent-delay:5400ms">
<rect class="motion-node-shape" x="70.0" y="502.0" width="940.0" height="118.0" rx="22" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="543.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">광고비가 매출 절반 넘게 먹어 중국 밖 1위 릴숏도 작년</text>
<text x="540.0" y="579.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">적자</text>
</g>
<g class="motion-step motion-node" data-motion-step="6" style="--motion-delay:6120ms;--motion-accent-delay:6760ms">
<rect class="motion-node-shape" x="70.0" y="708.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="767.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">한국은 월 매출 세계 4위인데 상위 국산 앱은 비글루 하나</text>
</g>
<line x1="72" y1="948" x2="1008" y2="948" stroke="#2A2724" stroke-width="2"/>
<text x="72" y="978" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="17" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
