<rect x="582.0" y="202.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="654.0" y="229.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">피드가 없음</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" style="--motion-delay:3400ms">
