<rect x="246.5" y="443.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="466.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">본전 위로 올라옴</text>
