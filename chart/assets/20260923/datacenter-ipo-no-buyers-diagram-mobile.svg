<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1010" viewBox="0 0 720 1010" class="morning-diagram morning-diagram-mobile" data-mobile-layout="same-topology" data-motion-orientation="TB" data-motion-steps="7">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity=".09"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F07040"/></marker></defs>
<rect width="720" height="1010" fill="#0B0A09"/>
<g class="motion-step motion-edge" data-motion-step="1" data-from="A" data-to="B" style="--motion-delay:680ms">
<path d="M 360.0 162.0 L 360.0 238.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="278.0" y="185.0" width="164" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="208.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">몸값이 비쌈</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="B" data-to="C" style="--motion-delay:2040ms">
<path d="M 360.0 364.0 C 360.0 406.0, 190.5 406.0, 190.5 440.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="156.2" y="387.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="275.2" y="410.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">최대 고객이 떠받침</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="B" data-to="D" style="--motion-delay:3400ms">
<path d="M 360.0 364.0 C 360.0 406.0, 529.5 406.0, 529.5 440.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="472.0" y="387.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="591.0" y="410.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">담보 있는 쪽만 삼</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="C" data-to="E" style="--motion-delay:4760ms">
<path d="M 190.5 658.0 C 190.5 700.0, 360.0 700.0, 360.0 734.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="172.2" y="681.0" width="206" height="34" rx="17" fill="#0B0A09"/>
<text x="275.2" y="704.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">순환 거래 지적</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:5440ms">
<path d="M 529.5 658.0 C 529.5 700.0, 360.0 700.0, 360.0 734.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="472.0" y="681.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="591.0" y="704.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">주식엔 값이 안 붙음</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="30.0" y="44.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">SB에너지, 오하이오에 세계 최대</text>
<text x="360.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">데이터센터 짓겠다며 상장 추진</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:1360ms;--motion-accent-delay:2000ms">
<rect class="motion-node-shape" x="30.0" y="246.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="287.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">500억불에 살 투자자를 못 모아 10월로</text>
<text x="360.0" y="323.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">밀림</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:2720ms;--motion-accent-delay:3360ms">
<rect class="motion-node-shape" x="30.0" y="448.0" width="321.0" height="210" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="190.5" y="499.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">엔비디아가 공모가</text>
<text x="190.5" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">90%에 15억불</text>
<text x="190.5" y="571.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">더 사줌 (누적</text>
<text x="190.5" y="607.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">30억불)</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="369.0" y="448.0" width="321.0" height="210" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="529.5" y="481.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">소프트뱅크</text>
<text x="529.5" y="517.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">110억불</text>
<text x="529.5" y="553.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">정크본드엔</text>
<text x="529.5" y="589.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">200억불 넘는</text>
<text x="529.5" y="625.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">주문</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:6120ms;--motion-accent-delay:6760ms">
<rect class="motion-node-shape" x="30.0" y="742.0" width="660.0" height="118.0" rx="20" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="801.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">칩·모델엔 프리미엄, 전기·건물엔 할인</text>
</g>
<line x1="40" y1="962" x2="680" y2="962" stroke="#2A2724" stroke-width="2"/>
<text x="40" y="994" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="20" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
