<text x="540.0" y="767.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">외부 평가 의무화는 후발 주자가 못 넘는 문턱</text>
