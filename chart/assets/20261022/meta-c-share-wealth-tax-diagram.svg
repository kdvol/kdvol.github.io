<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1016" viewBox="0 0 1080 1016" class="morning-diagram" data-motion-orientation="TB" data-motion-steps="7">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity=".09"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F07040"/></marker></defs>
<rect width="1080" height="1016" fill="#0B0A09"/>
<g class="motion-step motion-edge" data-motion-step="1" style="--motion-delay:1360ms">
<path d="M 312.0 208.0 C 312.0 252.0, 540.0 252.0, 540.0 288.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="354.0" y="222.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="426.0" y="249.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">세금 낼 현금 필요</text>
</g>
<g class="motion-step motion-edge" data-motion-step="1" style="--motion-delay:2040ms">
<path d="M 768.0 208.0 C 768.0 252.0, 540.0 252.0, 540.0 288.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="582.0" y="222.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="654.0" y="249.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">이탈을 막으려고</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" style="--motion-delay:3400ms">
<path d="M 540.0 414.0 C 540.0 458.0, 312.0 458.0, 312.0 494.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="354.0" y="428.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="426.0" y="455.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">팔아도 표는 남음</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" style="--motion-delay:4760ms">
<path d="M 540.0 414.0 C 540.0 458.0, 768.0 458.0, 768.0 494.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="582.0" y="428.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="654.0" y="455.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">약속의 허점</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" style="--motion-delay:6120ms">
<path d="M 312.0 640.0 C 312.0 684.0, 540.0 684.0, 540.0 720.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="354.0" y="654.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="426.0" y="681.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">세금과 지배력 분리</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="97.0" y="70.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="312.0" y="103.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">캘리포니아 부자세 11월</text>
<text x="312.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">투표, 부자 재산 5%를</text>
<text x="312.0" y="175.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">한 번 걷음</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:680ms;--motion-accent-delay:1320ms">
<rect class="motion-node-shape" x="553.0" y="70.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="768.0" y="103.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">저커버그가 특별위원회에</text>
<text x="768.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">「캘리포니아 떠날 수도」</text>
<text x="768.0" y="175.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">통보</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:2720ms;--motion-accent-delay:3360ms">
<rect class="motion-node-shape" x="70.0" y="296.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">위원회가 C주를 내주고 8년 거주 약속을 받아 냄</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="97.0" y="502.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="312.0" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">의결권 없는 C주라 팔아도</text>
<text x="312.0" y="571.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">저커버그 의결권 60.6%</text>
<text x="312.0" y="607.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">그대로</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="4" style="--motion-delay:5440ms;--motion-accent-delay:6080ms">
<rect class="motion-node-shape" x="553.0" y="502.0" width="430.0" height="138" rx="22" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="768.0" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">부자세는 올해 1월 1일</text>
<text x="768.0" y="571.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">거주자 기준, 떠나도</text>
<text x="768.0" y="607.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">피한다는 보장 없음</text>
</g>
<g class="motion-step motion-node" data-motion-step="6" style="--motion-delay:6800ms;--motion-accent-delay:7440ms">
<rect class="motion-node-shape" x="70.0" y="728.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="769.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">삼성 일가는 12조원 세금에 지분 팔았지만 저커버그는 지분</text>
<text x="540.0" y="805.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">안 건드려도 됨</text>
</g>
<line x1="72" y1="968" x2="1008" y2="968" stroke="#2A2724" stroke-width="2"/>
<text x="72" y="998" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="17" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
