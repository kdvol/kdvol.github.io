<text x="540.0" y="455.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">주장 실측함</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" style="--motion-delay:4760ms">
<path d="M 540.0 620.0 L 540.0 700.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="468.0" y="634.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="661.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">입법이 뒤처짐</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="97.0" y="70.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="312.0" y="103.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">월마트, 매장</text>
<text x="312.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">2,300곳에 버튼 하나로</text>
<text x="312.0" y="175.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">값 바꾸는 가격표</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:680ms;--motion-accent-delay:1320ms">
