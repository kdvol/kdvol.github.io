<text x="360.0" y="430.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">원유·면허로 충돌</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:4760ms">
