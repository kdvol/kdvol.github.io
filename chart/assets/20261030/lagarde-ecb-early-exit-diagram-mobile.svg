<rect x="288.5" y="609.0" width="143" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="632.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">공백 겹침</text>
</g>
<g class="motion-step motion-edge" data-motion-step="7" data-from="E" data-to="F" style="--motion-delay:6120ms">
<path d="M 360.0 788.0 L 360.0 864.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="278.0" y="811.0" width="164" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="834.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">결정권 비어</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="30.0" y="44.0" width="321.0" height="138" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="190.5" y="77.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">라가르드, 임기</text>
<text x="190.5" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">9개월 남기고 내년</text>
<text x="190.5" y="149.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">2월 ECB 떠남</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:680ms;--motion-accent-delay:1320ms">
<rect class="motion-node-shape" x="369.0" y="44.0" width="321.0" height="138" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="529.5" y="77.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">내년 4월 프랑스</text>
<text x="529.5" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">대선, 마크롱은</text>
<text x="529.5" y="149.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">재출마 못 함</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:2040ms;--motion-accent-delay:2680ms">
<rect class="motion-node-shape" x="30.0" y="266.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="307.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">본인이 댄 이유는 말할 자유, 다음 자리는</text>
<text x="360.0" y="343.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">WEF 의장 유력</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="30.0" y="468.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="509.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">2월에 나가면 마크롱 임기 안에</text>
<text x="360.0" y="545.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">독일·프랑스가 후임 합의</text>
</g>
<g class="motion-step motion-node" data-motion-step="6" style="--motion-delay:5440ms;--motion-accent-delay:6080ms">
<rect class="motion-node-shape" x="30.0" y="670.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="711.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">슈나벨 1월 IMF행, 레인 5월 만료</text>
<text x="360.0" y="747.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">집행이사 6명 중 절반 교체</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="8" style="--motion-delay:6800ms;--motion-accent-delay:7440ms">
<rect class="motion-node-shape" x="30.0" y="872.0" width="660.0" height="118.0" rx="20" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="913.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">물가 다시 오르는데 금리 정할 사람이 빔</text>
<text x="360.0" y="949.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">— 유로가 환율로 옴</text>
</g>
<line x1="40" y1="1092" x2="680" y2="1092" stroke="#2A2724" stroke-width="2"/>
<text x="40" y="1124" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="20" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
