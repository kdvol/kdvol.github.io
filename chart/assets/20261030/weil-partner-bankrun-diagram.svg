<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1182" viewBox="0 0 1080 1182" class="morning-diagram" data-motion-orientation="TB" data-motion-steps="9">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity=".09"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F07040"/></marker></defs>
<rect width="1080" height="1182" fill="#0B0A09"/>
<g class="motion-step motion-edge" data-motion-step="1" style="--motion-delay:680ms">
<path d="M 540.0 188.0 L 540.0 268.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="468.0" y="202.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="229.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">돈 문제 아님</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" style="--motion-delay:2040ms">
<path d="M 540.0 394.0 L 540.0 474.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="468.0" y="408.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="435.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">사람이 빠짐</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" style="--motion-delay:3400ms">
<path d="M 540.0 600.0 L 540.0 680.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="468.0" y="614.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="641.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">고객이 따라감</text>
</g>
<g class="motion-step motion-edge" data-motion-step="7" style="--motion-delay:4760ms">
<path d="M 540.0 806.0 L 540.0 886.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="468.0" y="820.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="847.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">붙잡을 장치 없음</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="70.0" y="70.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="129.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">와일, 95년 만에 질서 있는 정리 권고</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:1360ms;--motion-accent-delay:2000ms">
<rect class="motion-node-shape" x="70.0" y="276.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="335.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">작년 파트너 1인당 이익 537만불, 적자 아님</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:2720ms;--motion-accent-delay:3360ms">
<rect class="motion-node-shape" x="70.0" y="482.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="541.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">기업자문 대표가 크래버스로, 핵심 파트너 뒤따름</text>
</g>
<g class="motion-step motion-node" data-motion-step="6" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="70.0" y="688.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="747.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">매출은 빠지고 임대료·월급은 그대로</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="8" style="--motion-delay:5440ms;--motion-accent-delay:6080ms">
<rect class="motion-node-shape" x="70.0" y="894.0" width="940.0" height="118.0" rx="22" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="953.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">윤리규칙이 이직 제한 금지, 몸값 연 4,000만불</text>
</g>
<line x1="72" y1="1134" x2="1008" y2="1134" stroke="#2A2724" stroke-width="2"/>
<text x="72" y="1164" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="17" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
