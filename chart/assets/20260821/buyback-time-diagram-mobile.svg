<rect x="241.0" y="387.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="410.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">가격이 아니라 쏠림이 풀린 것</text>
