<svg xmlns="http://www.w3.org/2000/svg" width="720" height="938" viewBox="0 0 720 938" class="morning-diagram morning-diagram-mobile" data-mobile-layout="same-topology" data-motion-orientation="TB" data-motion-steps="7">
