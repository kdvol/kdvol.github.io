<text x="360.0" y="691.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">경쟁사가 더 아픔 (이용률 76% vs</text>
