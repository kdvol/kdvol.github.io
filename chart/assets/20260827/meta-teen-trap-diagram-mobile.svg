<text x="360.0" y="287.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">180억 달러 합의 + 사용 제한 규칙</text>
