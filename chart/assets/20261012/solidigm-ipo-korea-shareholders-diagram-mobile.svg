<rect x="246.5" y="479.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="502.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">흑자가 몸값 근거</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="C" data-to="D" style="--motion-delay:3400ms">
<path d="M 529.5 254.0 C 676.0 354.1, 676.0 439.9, 360.0 532.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="458.0" y="675.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="577.0" y="698.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">투자금은 바깥 돈으로</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:4760ms">
