<text x="529.5" y="279.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">엔비디아·보잉·인텔을</text>
<text x="529.5" y="315.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">샀고 그 뒤 규제</text>
<text x="529.5" y="351.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">당사자가 됨</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4760ms;--motion-accent-delay:5400ms">
<rect class="motion-node-shape" x="30.0" y="468.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="527.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">계좌 주인이 관세·금리를 정하는 사람임</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:6120ms;--motion-accent-delay:6760ms">
<rect class="motion-node-shape" x="30.0" y="670.0" width="660.0" height="118.0" rx="20" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="711.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">대통령만 빼는 금지법, 중간선거 공격</text>
<text x="360.0" y="747.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">소재로</text>
</g>
<line x1="40" y1="890" x2="680" y2="890" stroke="#2A2724" stroke-width="2"/>
<text x="40" y="922" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="20" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
