<text x="275.2" y="430.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">위법은 아님</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="C" data-to="D" style="--motion-delay:4080ms">
