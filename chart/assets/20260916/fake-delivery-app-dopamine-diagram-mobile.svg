<rect x="467.0" y="387.0" width="185" height="34" rx="17" fill="#0B0A09"/>
<text x="559.5" y="410.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">먹힌 이유 ②</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="C" data-to="E" style="--motion-delay:4760ms">
