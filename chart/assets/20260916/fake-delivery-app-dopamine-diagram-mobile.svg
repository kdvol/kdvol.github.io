<rect x="161.8" y="609.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="275.2" y="632.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">자극에 값이 붙음</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:5440ms">
<path d="M 529.5 586.0 C 529.5 628.0, 360.0 628.0, 360.0 662.0" fill="none" stroke="#F07040" stroke-width="4.5" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
