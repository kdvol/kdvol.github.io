<text x="540.0" y="541.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">미국 상장분은 오른 걸 거의 다 반납</text>
