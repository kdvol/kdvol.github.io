<text x="540.0" y="787.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">앞으로 2년은 청문회 테슬라 주주도 같이 흔들림</text>
