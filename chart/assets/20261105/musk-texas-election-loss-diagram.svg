<text x="540.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">텍사스 상원·주지사 민주당이 가져감</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:3400ms;--motion-accent-delay:4040ms">
