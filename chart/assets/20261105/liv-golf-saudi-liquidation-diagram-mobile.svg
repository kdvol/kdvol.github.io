<svg xmlns="http://www.w3.org/2000/svg" width="720" height="974" viewBox="0 0 720 974" class="morning-diagram morning-diagram-mobile" data-mobile-layout="same-topology" data-motion-orientation="TB" data-motion-steps="7">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity=".09"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F07040"/></marker></defs>
<rect width="720" height="974" fill="#0B0A09"/>
<g class="motion-step motion-edge" data-motion-step="1" data-from="A" data-to="B" style="--motion-delay:680ms">
<path d="M 360.0 162.0 C 360.0 204.0, 190.5 204.0, 190.5 238.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="193.2" y="185.0" width="164" height="34" rx="17" fill="#0B0A09"/>
<text x="275.2" y="208.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">상금만 뿌림</text>
</g>
<g class="motion-step motion-edge" data-motion-step="1" data-from="A" data-to="C" style="--motion-delay:2040ms">
<path d="M 360.0 162.0 C 360.0 204.0, 529.5 204.0, 529.5 238.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="362.8" y="185.0" width="164" height="34" rx="17" fill="#0B0A09"/>
<text x="444.8" y="208.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">적자가 쌓임</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="B" data-to="D" style="--motion-delay:3400ms">
<path d="M 190.5 420.0 C 190.5 462.0, 360.0 462.0, 360.0 496.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="172.2" y="443.0" width="206" height="34" rx="17" fill="#0B0A09"/>
<text x="275.2" y="466.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">중계 수입 없음</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="C" data-to="D" style="--motion-delay:4080ms">
<path d="M 529.5 420.0 C 529.5 462.0, 360.0 462.0, 360.0 496.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="464.4" y="443.0" width="164" height="34" rx="17" fill="#0B0A09"/>
<text x="546.4" y="466.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">수표가 끊김</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:5440ms">
<path d="M 360.0 622.0 L 360.0 698.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="278.0" y="645.0" width="164" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="668.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">약정이 무효</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="30.0" y="44.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="85.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">PIF가 2022년 PGA에 맞서 LIV</text>
<text x="360.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">세우고 선수 사들임</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:1360ms;--motion-accent-delay:2000ms">
<rect class="motion-node-shape" x="30.0" y="246.0" width="321.0" height="174" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="190.5" y="279.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">스타는 샀지만 방송</text>
<text x="190.5" y="315.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">매출은 5%뿐 —</text>
<text x="190.5" y="351.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">시청 습관은 못</text>
<text x="190.5" y="387.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">샀음</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:2720ms;--motion-accent-delay:3360ms">
<rect class="motion-node-shape" x="369.0" y="246.0" width="321.0" height="174" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="529.5" y="279.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">PIF가 「장기</text>
<text x="529.5" y="315.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">투자는 전략에 안</text>
<text x="529.5" y="351.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">맞는다」며 선을</text>
<text x="529.5" y="387.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">그음</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4760ms;--motion-accent-delay:5400ms">
<rect class="motion-node-shape" x="30.0" y="504.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="545.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">미·영 법인 손실 50억불, 9월 파산보호</text>
<text x="360.0" y="581.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">뒤 청산 절차</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:6120ms;--motion-accent-delay:6760ms">
<rect class="motion-node-shape" x="30.0" y="706.0" width="660.0" height="118.0" rx="20" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="747.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">오일머니 믿고 잡은 일정이 먼저 지워짐 —</text>
<text x="360.0" y="783.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">부산 약정도 첫해로 끝</text>
</g>
<line x1="40" y1="926" x2="680" y2="926" stroke="#2A2724" stroke-width="2"/>
<text x="40" y="958" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="20" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
