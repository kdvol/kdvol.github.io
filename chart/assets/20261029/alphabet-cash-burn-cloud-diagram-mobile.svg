<rect x="388.6" y="205.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="507.6" y="228.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">현금이 주가를 가름</text>
</g>
<g class="motion-step motion-edge" data-motion-step="1" data-from="C" data-to="D" style="--motion-delay:3400ms">
<path d="M 529.5 182.0 L 529.5 258.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="410.5" y="-5.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="529.5" y="18.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">구멍을 차입으로 메움</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="D" data-to="E" style="--motion-delay:4760ms">
<path d="M 529.5 440.0 C 529.5 482.0, 360.0 482.0, 360.0 516.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
