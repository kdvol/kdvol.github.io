<rect class="motion-node-shape" x="70.0" y="296.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">승부처는 칩보다 얼굴에 쓸 만한 테</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="70.0" y="502.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="561.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">구글, 워비파커·젠틀몬스터에 돈 걸어 테를 확보</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:5440ms;--motion-accent-delay:6080ms">
<rect class="motion-node-shape" x="97.0" y="708.0" width="430.0" height="138" rx="22" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="312.0" y="741.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">워비파커 주가 일주일 새</text>
<text x="312.0" y="777.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">40%↑, 본업 손님은</text>
<text x="312.0" y="813.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">제자리</text>
</g>
<g class="motion-step motion-node" data-motion-step="6" style="--motion-delay:6800ms;--motion-accent-delay:7440ms">
<rect class="motion-node-shape" x="553.0" y="708.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="768.0" y="741.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">실제 배송은 12월 중순,</text>
<text x="768.0" y="777.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">선물 시즌엔 메타보다 늦게</text>
<text x="768.0" y="813.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">출발</text>
</g>
<line x1="72" y1="968" x2="1008" y2="968" stroke="#2A2724" stroke-width="2"/>
<text x="72" y="998" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="17" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
