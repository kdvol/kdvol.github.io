<text x="360.0" y="361.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">그래도 60% 넘게 오른다는 골드만 계산</text>
