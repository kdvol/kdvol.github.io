<text x="360.0" y="325.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">CME가 9월 말 그 지수 선물을 내놓음</text>
