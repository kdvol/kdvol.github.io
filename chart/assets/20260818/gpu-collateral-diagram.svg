<rect x="307.0" y="294.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="379.0" y="321.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">규모가 큼</text>
</g>
