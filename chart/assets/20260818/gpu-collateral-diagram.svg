<text x="718.6" y="527.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">이게 전제를 받침</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" style="--motion-delay:6120ms">
<path d="M 862.0 280.0 C 862.0 530.0, 540.0 530.0, 540.0 772.0" fill="none" stroke="#F07040" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
<rect x="807.6" y="500.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="879.6" y="527.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">전제를 흔듦</text>
