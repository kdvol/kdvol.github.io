<text x="540.0" y="129.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F2EC">A100 칩이</text>
<text x="540.0" y="163.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F2EC">아직 임대 수익</text>
