<text x="229.3" y="129.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#F5F2EC">한 대 3만~4만불로</text>
<text x="229.3" y="158.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#F5F2EC">추정, 수천 대 묶음</text>
