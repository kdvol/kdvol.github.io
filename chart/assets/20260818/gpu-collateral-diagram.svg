<g class="motion-step motion-node motion-risk" data-motion-step="0" style="--motion-delay:1360ms;--motion-accent-delay:2000ms">
<rect class="motion-node-shape" x="714.0" y="70.0" width="296.0" height="210" rx="22" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="862.0" y="157.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">그런데 해마다 새</text>
<text x="862.0" y="193.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">칩이 나옴</text>
