<text x="247.0" y="192.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">규모가 큼</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="B" data-to="C" style="--motion-delay:3400ms">
<path d="M 360.0 332.0 C 360.0 390.0, 360.0 390.0, 360.0 440.0" fill="none" stroke="#F07040" stroke-width="4.5" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
<rect x="241.0" y="371.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="394.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">그래서 방식을 바꿈</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="C" data-to="D" style="--motion-delay:4760ms">
<path d="M 360.0 534.0 C 360.0 592.0, 360.0 592.0, 360.0 642.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
