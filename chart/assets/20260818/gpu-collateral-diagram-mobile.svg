<text x="134.0" y="39.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F2EC">블랙웰 B200</text>
<text x="134.0" y="63.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F2EC">칩 한 대</text>
<text x="134.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F2EC">3만~4만불로</text>
<text x="134.0" y="111.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F2EC">추정, 수천 대</text>
<text x="134.0" y="135.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F2EC">묶음</text>
