<rect x="469.0" y="573.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="582.5" y="596.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">이게 전제를 받침</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="F" data-to="D" style="--motion-delay:6120ms">
<path d="M 586.0 130.0 C 676.0 200.7, 676.0 579.3, 360.0 642.0" fill="none" stroke="#F07040" stroke-width="4.5" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
<rect x="532.0" y="609.0" width="164" height="34" rx="17" fill="#0B0A09"/>
