<text x="540.0" y="337.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">싸게 자주 쏘는 쪽은 스페이스X뿐, ULA·아마존 발사</text>
