<text x="275.2" y="668.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">접속을 한 손에</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="F" style="--motion-delay:6120ms">
