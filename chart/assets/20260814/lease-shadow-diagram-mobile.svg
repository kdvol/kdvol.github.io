<text x="360.0" y="289.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">주석에만 있는 약정</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="60.0" y="448.0" width="600.0" height="86" rx="20" fill="#1C1917" stroke="#332E29" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="491.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">30년물 5.2% 넘는 시장에서 조달</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:5440ms;--motion-accent-delay:6080ms">
<rect class="motion-node-shape" x="60.0" y="650.0" width="600.0" height="86" rx="20" fill="#2A1C15" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="693.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">빚으로 고정비를 떠안는 구조</text>
