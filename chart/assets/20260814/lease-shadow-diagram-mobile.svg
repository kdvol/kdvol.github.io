<line x1="40" y1="812" x2="680" y2="812" stroke="{DIA["rule"]}" stroke-width="2"/>
<text x="40" y="844" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="20" fill="{DIA["muted"]}">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
