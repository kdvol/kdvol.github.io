<svg xmlns="http://www.w3.org/2000/svg" width="720" height="938" viewBox="0 0 720 938" class="morning-diagram morning-diagram-mobile" data-mobile-layout="same-topology" data-motion-orientation="TB" data-motion-steps="7">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity=".09"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F07040"/></marker></defs>
<rect width="720" height="938" fill="#0B0A09"/>
<g class="motion-step motion-edge" data-motion-step="1" data-from="A" data-to="B" style="--motion-delay:1360ms">
<path d="M 190.5 182.0 C 190.5 224.0, 360.0 224.0, 360.0 258.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="182.8" y="205.0" width="185" height="34" rx="17" fill="#0B0A09"/>
<text x="275.2" y="228.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">달러 지키려고</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="B" data-to="D" style="--motion-delay:2720ms">
<path d="M 360.0 384.0 L 360.0 460.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="257.0" y="407.0" width="206" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="430.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">세금 회피 이익</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="C" data-to="D" style="--motion-delay:3400ms">
<path d="M 529.5 182.0 C 676.0 282.1, 676.0 367.9, 360.0 460.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="469.0" y="407.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="582.5" y="430.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">대목에 물량 몰려</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:4760ms">
<path d="M 360.0 586.0 L 360.0 662.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
<rect x="241.0" y="609.0" width="238" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="632.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">원가보다 150불 싸</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="30.0" y="44.0" width="321.0" height="138" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="190.5" y="77.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">이란 전쟁에 기름값</text>
<text x="190.5" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">뛰어 인도서 달러가</text>
<text x="190.5" y="149.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">새 나감</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:680ms;--motion-accent-delay:1320ms">
<rect class="motion-node-shape" x="369.0" y="44.0" width="321.0" height="138" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="529.5" y="77.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">결혼·축제 대목이라</text>
<text x="529.5" y="113.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">인도 가정은 값이</text>
<text x="529.5" y="149.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">올라도 금을 삼</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:2040ms;--motion-accent-delay:2680ms">
<rect class="motion-node-shape" x="30.0" y="266.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="307.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">모디 정부, 5월에 금 관세를</text>
<text x="360.0" y="343.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">6%→15%로 올림</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="30.0" y="468.0" width="660.0" height="118.0" rx="20" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="509.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">딜러가 세금 안 낸 금을 최대 6% 싸게</text>
<text x="360.0" y="545.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">넘김</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:5440ms;--motion-accent-delay:6080ms">
<rect class="motion-node-shape" x="30.0" y="670.0" width="660.0" height="118.0" rx="20" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="360.0" y="711.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">관세는 금이 들어오는 길만 바꿈 달러는</text>
<text x="360.0" y="747.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="800" fill="#F5F2EC">어느 길로든 나감</text>
</g>
<line x1="40" y1="890" x2="680" y2="890" stroke="#2A2724" stroke-width="2"/>
<text x="40" y="922" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="20" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
