<line x1="40" y1="688" x2="680" y2="688" stroke="#2A2724" stroke-width="2"/>
<text x="40" y="720" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="20" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
