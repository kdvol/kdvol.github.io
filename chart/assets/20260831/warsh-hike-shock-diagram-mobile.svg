<rect x="193.2" y="387.0" width="164" height="34" rx="17" fill="#0B0A09"/>
<text x="275.2" y="410.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">채권 재평가</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="B" data-to="D" style="--motion-delay:3400ms">
<path d="M 360.0 364.0 C 360.0 406.0, 529.5 406.0, 529.5 440.0" fill="none" stroke="#F07040" stroke-width="4.5" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
<rect x="472.0" y="387.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="585.5" y="410.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">원화·국고채 대기</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
