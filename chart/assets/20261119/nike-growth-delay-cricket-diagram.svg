<text x="540.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">주가 6% 빠져 35불대, 평균 성장은 2029회계연도부터</text>
