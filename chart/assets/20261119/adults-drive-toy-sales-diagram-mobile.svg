<text x="360.0" y="208.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">큰손이 어른임</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" data-from="B" data-to="C" style="--motion-delay:2040ms">
