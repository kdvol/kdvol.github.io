<text x="572.5" y="410.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">바비엔 안 통함</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="C" data-to="E" style="--motion-delay:4760ms">
