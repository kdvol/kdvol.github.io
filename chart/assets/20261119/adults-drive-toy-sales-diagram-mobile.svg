<rect x="469.5" y="645.0" width="206" height="34" rx="17" fill="#0B0A09"/>
<text x="572.5" y="668.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">관세는 안 식음</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
