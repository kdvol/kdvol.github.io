<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="996" viewBox="0 0 1080 996" class="morning-diagram" data-motion-orientation="TB" data-motion-steps="7">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity=".09"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F07040"/></marker></defs>
<rect width="1080" height="996" fill="#0B0A09"/>
<g class="motion-step motion-edge" data-motion-step="1" style="--motion-delay:1360ms">
<path d="M 312.0 208.0 C 312.0 252.0, 540.0 252.0, 540.0 288.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="354.0" y="222.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="426.0" y="249.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">쓸 페소가 없음</text>
</g>
<g class="motion-step motion-edge" data-motion-step="1" style="--motion-delay:2040ms">
<path d="M 768.0 208.0 C 768.0 252.0, 540.0 252.0, 540.0 288.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="582.0" y="222.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="654.0" y="249.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">지방엔 손 못 댐</text>
</g>
<g class="motion-step motion-edge" data-motion-step="3" style="--motion-delay:3400ms">
<path d="M 540.0 414.0 L 540.0 494.0" fill="none" stroke="#F07040" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="468.0" y="428.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="455.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">세금 창구가 열림</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" style="--motion-delay:4760ms">
<path d="M 540.0 620.0 L 540.0 700.0" fill="none" stroke="#F07040" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
<rect x="468.0" y="634.0" width="144" height="36" rx="18" fill="#0B0A09"/>
<text x="540.0" y="661.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="18" fill="#F5A481">페소가 부족하면</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:0ms;--motion-accent-delay:640ms">
<rect class="motion-node-shape" x="97.0" y="70.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="312.0" y="121.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">밀레이가 교부금을 잘라</text>
<text x="312.0" y="157.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">라리오하에 페소가 마름</text>
</g>
<g class="motion-step motion-node" data-motion-step="0" style="--motion-delay:680ms;--motion-accent-delay:1320ms">
<rect class="motion-node-shape" x="553.0" y="70.0" width="430.0" height="138" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="768.0" y="103.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">밀레이는 미 재무부</text>
<text x="768.0" y="139.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">스왑으로 페소 환율을</text>
<text x="768.0" y="175.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">방어하는 중</text>
</g>
<g class="motion-step motion-node" data-motion-step="2" style="--motion-delay:2720ms;--motion-accent-delay:3360ms">
<rect class="motion-node-shape" x="70.0" y="296.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">킨텔라 주지사가 차초를 찍어 8만 명에게 월급으로 지급</text>
</g>
<g class="motion-step motion-node" data-motion-step="4" style="--motion-delay:4080ms;--motion-accent-delay:4720ms">
<rect class="motion-node-shape" x="70.0" y="502.0" width="940.0" height="118.0" rx="22" fill="#332E26" stroke="#6B6156" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="561.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">주 세금도 차초로 받음 = 그 지역 사실상 법정통화</text>
</g>
<g class="motion-step motion-node motion-risk" data-motion-step="6" style="--motion-delay:5440ms;--motion-accent-delay:6080ms">
<rect class="motion-node-shape" x="70.0" y="708.0" width="940.0" height="118.0" rx="22" fill="#4A2C1A" stroke="#F07040" stroke-width="3" filter="url(#shadow)"/>
<text x="540.0" y="767.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">환전 창구가 막히면 차초는 화폐가 아니라 주정부 빚</text>
</g>
<line x1="72" y1="948" x2="1008" y2="948" stroke="#2A2724" stroke-width="2"/>
<text x="72" y="978" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="17" fill="#7C756C">실선 = 확인된 연결 · 점선 = 해석/영향 경로</text>
</svg>
