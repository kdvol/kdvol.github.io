<text x="540.0" y="337.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">CVS 안에 GLP-1 전용 코너, 그 선반 대부분을</text>
