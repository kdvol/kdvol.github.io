<rect x="472.0" y="645.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="585.5" y="668.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">같은 판이 넘어옴</text>
