<text x="540.0" y="355.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">엔비디아가 TSMC에 3D D램 만들어 달라 부탁(보도)</text>
