<text x="540.0" y="335.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">260억불은 서버·칩 파는 거래처 7곳이 내기로 약속</text>
