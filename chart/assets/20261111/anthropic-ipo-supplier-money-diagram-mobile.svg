<text x="360.0" y="430.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">미등록 주식</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="C" data-to="E" style="--motion-delay:4080ms">
