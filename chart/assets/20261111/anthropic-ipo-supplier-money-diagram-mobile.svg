<rect x="257.0" y="609.0" width="206" height="34" rx="17" fill="#0B0A09"/>
<text x="360.0" y="632.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">풀릴 물량 묶임</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:4760ms">
<path d="M 529.5 182.0 C 676.0 352.8, 676.0 499.2, 360.0 662.0" fill="none" stroke="#F07040" stroke-width="4.5" marker-end="url(#arrow)"/>
