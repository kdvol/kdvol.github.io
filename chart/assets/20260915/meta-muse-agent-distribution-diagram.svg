<text x="540.0" y="747.0" text-anchor="middle" dominant-baseline="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#F5F2EC">모델 싸움이 아니라 앱 싸움, 앱 넷 다 가진 곳은 메타뿐</text>
