<rect x="483.0" y="407.0" width="227" height="34" rx="17" fill="#0B0A09"/>
<text x="596.5" y="430.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5A481">받아줄 매도 없음</text>
</g>
<g class="motion-step motion-edge" data-motion-step="5" data-from="D" data-to="E" style="--motion-delay:4760ms">
