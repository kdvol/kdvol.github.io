<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EP.01 — 전 세계가 달러 보험에 꽂혔는데, 우리만 겁먹은 이유</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #1a1a2e;
    --blue: #0f3460;
    --accent: #e94560;
    --ablue: #2563eb;
    --gray: #64748b;
    --lgray: #94a3b8;
    --bg: #ffffff;
    --light-bg: #f8fafc;
    --soft-red: #fef2f2;
    --soft-blue: #eff6ff;
    --border: #e2e8f0;
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    color: var(--dark);
    background: #f1f5f9;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 780px;
    margin: 0 auto;
    background: var(--bg);
    box-shadow: 0 1px 24px rgba(0,0,0,0.06);
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: white;
    padding: 52px 48px 44px;
  }
  .header .tag {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.4;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    font-size: 14px;
    font-weight: 300;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
  }

  /* Content */
  .content { padding: 44px 48px 52px; }
  .section-label {
    display: inline-block;
    background: var(--blue);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  h2 {
    font-size: 19px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 16px;
    line-height: 1.4;
    letter-spacing: -0.3px;
  }
  .body-text {
    font-size: 14.5px;
    color: #334155;
    margin-bottom: 18px;
    line-height: 1.8;
  }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px 0;
  }

  /* Highlight Box */
  .insight-box {
    background: var(--light-bg);
    border-left: 4px solid var(--blue);
    padding: 20px 24px;
    margin: 22px 0;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--blue);
    line-height: 1.75;
  }

  /* Tables */
  .table-wrap { overflow-x: auto; margin: 18px 0; }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 500px;
  }
  .data-table caption {
    text-align: left;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 10px;
    color: var(--dark);
    caption-side: top;
  }
  .data-table thead th {
    background: var(--dark);
    color: white;
    padding: 11px 10px;
    font-weight: 600;
    text-align: center;
    font-size: 12px;
    white-space: nowrap;
  }
  .data-table thead th:first-child { text-align: left; padding-left: 14px; }
  .data-table thead th small { font-weight: 400; opacity: 0.8; }
  .data-table tbody td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    vertical-align: middle;
    word-break: keep-all;
  }
  .data-table tbody td:first-child { text-align: left; font-weight: 500; padding-left: 14px; }
  .data-table tbody tr:nth-child(even) { background: #f8fafc; }
  .em { font-weight: 700; color: var(--blue); }
  .source {
    font-size: 11px;
    color: var(--lgray);
    margin-top: 8px;
    line-height: 1.6;
  }

  /* Bar Charts */
  .chart-block { margin: 26px 0; }
  .chart-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--dark);
  }
  .chart-sub {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gray);
    margin: 20px 0 10px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 7px;
    height: 28px;
  }
  .bar-label {
    width: 52px;
    font-size: 12px;
    font-weight: 500;
    text-align: right;
    padding-right: 10px;
    color: var(--gray);
    flex-shrink: 0;
  }
  .bar-track {
    flex: 1;
    height: 22px;
    background: #f1f5f9;
    border-radius: 4px;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    position: relative;
  }
  .bar-fill.c-red { background: #ef4444; }
  .bar-fill.c-orange { background: #f97316; }
  .bar-fill.c-blue { background: #3b82f6; }
  .bar-fill.c-green { background: #22c55e; }
  .bar-val {
    position: absolute;
    right: -52px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 700;
    color: var(--dark);
    white-space: nowrap;
  }
  .bar-fill[data-inside="true"] .bar-val {
    right: 8px;
    color: white;
  }
  .bar-note-area {
    width: 100px;
    font-size: 10px;
    color: var(--lgray);
    padding-left: 56px;
    flex-shrink: 0;
  }
  .bar-note-area.warn { color: var(--accent); font-weight: 600; }

  /* Scenario Cards */
  .case-card {
    background: var(--soft-blue);
    border-radius: var(--radius);
    padding: 26px 28px;
    margin: 18px 0;
  }
  .case-card .tag-line {
    font-size: 12px;
    font-weight: 700;
    color: var(--ablue);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .case-card h3 {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .case-card p {
    font-size: 13.5px;
    color: #475569;
    line-height: 1.75;
  }

  /* Compare Grid */
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 22px 0;
  }
  .cmp-box {
    padding: 22px 24px;
    border-radius: var(--radius);
  }
  .cmp-box.bad { background: var(--soft-red); }
  .cmp-box.good { background: var(--soft-blue); }
  .cmp-box h4 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .cmp-box.bad h4 { color: var(--accent); }
  .cmp-box.good h4 { color: var(--ablue); }
  .cmp-box ul { list-style: none; font-size: 13px; line-height: 1.9; color: #475569; }
  .cmp-box ul li::before { content:"•"; margin-right: 6px; }

  /* FAQ */
  .faq-item {
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
  }
  .faq-item:last-child { border-bottom: none; }
  .faq-q {
    font-size: 14px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
  }
  .faq-q .q-mark {
    color: var(--ablue);
    font-weight: 900;
    flex-shrink: 0;
  }
  .faq-a {
    font-size: 13.5px;
    color: #475569;
    line-height: 1.75;
    padding-left: 22px;
  }

  /* Not-for Box */
  .caution-box {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: var(--radius);
    padding: 22px 26px;
    margin: 22px 0;
  }
  .caution-box h4 {
    font-size: 14px;
    font-weight: 700;
    color: #92400e;
    margin-bottom: 10px;
  }
  .caution-box ul {
    list-style: none;
    font-size: 13px;
    color: #78350f;
    line-height: 1.8;
  }
  .caution-box ul li::before { content:"⚠ "; }

  /* CTA Box */
  .cta-box {
    background: linear-gradient(135deg, #0f3460, #1e40af);
    color: white;
    border-radius: var(--radius);
    padding: 34px 32px;
    text-align: center;
    margin: 36px 0;
  }
  .cta-box h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
  .cta-box p { font-size: 14.5px; font-weight: 400; line-height: 1.8; opacity: 0.92; }

  /* Footer */
  .footer {
    padding: 28px 48px;
    border-top: 1px solid var(--border);
    background: #fafbfc;
  }
  .footer .disclaimer {
    font-size: 11px;
    color: var(--lgray);
    line-height: 1.65;
    margin-bottom: 14px;
  }
  .footer .brand {
    font-size: 11px;
    font-weight: 600;
    color: var(--lgray);
    text-align: center;
  }

  /* Mobile */
  @media (max-width: 640px) {
    .header { padding: 36px 24px 32px; }
    .header h1 { font-size: 21px; }
    .header .subtitle { font-size: 13px; }
    .content { padding: 28px 20px 36px; }
    h2 { font-size: 17px; }
    .body-text { font-size: 13.5px; }
    .compare-grid { grid-template-columns: 1fr; }
    .bar-label { width: 44px; font-size: 11px; }
    .bar-note-area { width: 80px; padding-left: 48px; font-size: 9px; }
    .case-card { padding: 20px 20px; }
    .footer { padding: 24px 20px; }
    .data-table { font-size: 12px; }
    .insight-box { font-size: 13px; padding: 16px 18px; }
  }

  /* Print */
  @media print {
    body { background: white; }
    .page { box-shadow: none; max-width: 100%; }
    .case-card, .data-table, .chart-block, .faq-item { break-inside: avoid; }
    .header { break-after: avoid; }
  }
</style>
<style id="soonsal-header-v2">
/* 헤더 — 한 축에 셋. 세로 중심이 하나여야 어긋나지 않는다 */
.site-header{position:relative;display:grid;grid-template-columns:1fr auto 1fr;
align-items:center;column-gap:12px;padding:20px max(16px, calc(50% - 400px));
border-bottom:1px solid #222;background:#111}
/* 칸과 **행**을 함께 못 박는다. 칸만 정하면 마크업 순서를 거스를 때
   그리드가 다음 줄로 내려보낸다 — 순살차트는 구독이 먼저 와서 검색이
   한 줄 아래(29px)로 떨어졌다. */
.site-header>.search-btn-header{grid-area:1/1;justify-self:start}
.site-header>.logo-link{grid-area:1/2;justify-self:center}
.site-header>.sub-btn-header{grid-area:1/3;justify-self:end}
.site-header>.logo-link{display:flex;align-items:center;gap:10px;
text-decoration:none;color:#fff}
.logo-text{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1}

/* 구독 — 이 사이트의 유일한 전환점. 좁은 화면에서도 남는다 */
.sub-btn-header{position:static;transform:none;display:inline-flex;
align-items:center;background:#E55A00;color:#fff;padding:9px 18px;
border-radius:999px;font-size:13px;font-weight:800;line-height:1;
text-decoration:none;white-space:nowrap;transition:background .18s ease}
.sub-btn-header:hover{background:#CC4F00}

.search-btn-header{position:static;transform:none;display:flex;
align-items:center;justify-content:center;width:36px;height:36px;
border-radius:999px;color:#8a857c;text-decoration:none;
transition:color .18s ease,background .18s ease}
.search-btn-header:hover{color:#fff;background:#1e1e1e}

@media(max-width:560px){
  .site-header{padding:14px 12px;column-gap:8px}
  .site-header .logo-text{font-size:18px}
  .site-header .logo-link img,.site-header .logo-icon{height:26px}
  .sub-btn-header{padding:7px 13px;font-size:11.5px;letter-spacing:-.3px}
  .search-btn-header{width:32px;height:32px}
}
</style></head>
<body>
<div id="soonsal-live-ticker" style="display:none;"></div>
<style>
#soonsal-live-ticker{position:sticky;top:0;width:100%;height:34px;box-sizing:border-box;background:#0a0a0a;border-bottom:1px solid #1a1a1a;overflow:hidden;z-index:99999;user-select:none;-webkit-user-select:none}
#soonsal-live-ticker::before,#soonsal-live-ticker::after{content:'';position:absolute;top:0;bottom:0;width:48px;z-index:2;pointer-events:none}
#soonsal-live-ticker::before{left:0;background:linear-gradient(to right,#0a0a0a,transparent)}
#soonsal-live-ticker::after{right:0;background:linear-gradient(to left,#0a0a0a,transparent)}
#soonsal-live-ticker .stk-track{display:flex;align-items:center;width:max-content;height:34px;animation:stk-scroll 90s linear infinite}
#soonsal-live-ticker .stk-track:hover{animation-play-state:paused}
@keyframes stk-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
#soonsal-live-ticker .stk-item{display:inline-flex;align-items:center;gap:7px;padding:0 16px;border-right:1px solid #1a1a1a;white-space:nowrap;flex-shrink:0}
#soonsal-live-ticker .stk-lbl{font-family:'DM Sans',-apple-system,sans-serif;font-size:11px;font-weight:600;color:#555;letter-spacing:0.3px;text-transform:uppercase}
#soonsal-live-ticker .stk-lbl.crypto{color:#F07040}
#soonsal-live-ticker .stk-prc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#e0ddd8;letter-spacing:-0.3px}
#soonsal-live-ticker .stk-chg{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:3px}
#soonsal-live-ticker .stk-chg.up{color:#4ade80;background:rgba(74,222,128,0.08)}
#soonsal-live-ticker .stk-chg.down{color:#f87171;background:rgba(248,113,113,0.08)}
#soonsal-live-ticker .stk-chg.zero{color:#777}
#soonsal-live-ticker .au{display:inline-block;width:0;height:0;border-style:solid;border-width:0 3px 5px;border-color:transparent transparent #4ade80}
#soonsal-live-ticker .ad{display:inline-block;width:0;height:0;border-style:solid;border-width:5px 3px 0;border-color:#f87171 transparent transparent}
#soonsal-live-ticker .stk-div{display:inline-flex;align-items:center;padding:0 12px;flex-shrink:0}
#soonsal-live-ticker .stk-div span{width:3px;height:3px;border-radius:50%;background:#F07040}
#soonsal-live-ticker .stk-ts{display:inline-flex;align-items:center;gap:5px;padding:0 16px;flex-shrink:0}
#soonsal-live-ticker .stk-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:stk-pulse 2s ease-in-out infinite}
@keyframes stk-pulse{0%,100%{opacity:1}50%{opacity:0.3}}
#soonsal-live-ticker .stk-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;letter-spacing:0.5px}
#soonsal-live-ticker .stk-loading{display:flex;align-items:center;justify-content:center;height:34px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#555;gap:8px}
#soonsal-live-ticker .stk-spin{width:10px;height:10px;border:2px solid #222;border-top-color:#F07040;border-radius:50%;animation:stk-sp 0.8s linear infinite}
@keyframes stk-sp{to{transform:rotate(360deg)}}
@media(max-width:768px){#soonsal-live-ticker .stk-item{padding:0 12px}#soonsal-live-ticker .stk-lbl{font-size:10px}#soonsal-live-ticker .stk-prc{font-size:11px}#soonsal-live-ticker .stk-chg{font-size:10px}}

  @media (max-width:768px) {
    .nav a { padding:12px 14px; font-size:12px; }
    .sub-btn-header { font-size:11px !important; padding:6px 12px !important; }
  }
  @media (max-width:480px) {
    .sub-btn-header { font-size:10px !important; padding:5px 10px !important; right:10px !important; }
  }
</style>
<script>
(function(){'use strict';var WORKER_URL='https://soonsal-data.kd-d0a.workers.dev/';var COINGECKO_URL='https://api.coingecko.com/api/v3';var TRADFI_ORDER=['S&P 500','NASDAQ','Dow Jones','KOSPI','US 10Y','WTI Oil','Gold','DXY','EUR/USD','USD/JPY','USD/KRW'];var CRYPTO_ORDER=['Bitcoin','Ethereum','Solana','XRP','BNB','Crypto Total'];var CRYPTO_IDS={'Bitcoin':'bitcoin','Ethereum':'ethereum','Solana':'solana','XRP':'ripple','BNB':'binancecoin'};var REFRESH=60000;var container,timer,lastTradfi,lastCrypto;function init(){container=document.getElementById('soonsal-live-ticker');if(!container)return;container.style.display='block';container.innerHTML='<div class="stk-loading"><div class="stk-spin"></div>Loading market data...</div>';fetchAll();timer=setInterval(fetchAll,REFRESH)}function fetchAll(){var p1=fetchTradFi();var p2=fetchCrypto();Promise.allSettled?Promise.allSettled([p1,p2]).then(render):Promise.all([p1.catch(function(){return null}),p2.catch(function(){return null})]).then(render)}function fetchTradFi(){return fetch(WORKER_URL).then(function(r){return r.json()}).then(function(data){if(data.tradfi)lastTradfi=data;return data}).catch(function(e){console.warn('[Ticker] TradFi error:',e.message);return null})}function fetchCrypto(){var ids=Object.values(CRYPTO_IDS).join(',');var url=COINGECKO_URL+'/simple/price?ids='+ids+'&vs_currencies=usd&include_24hr_change=true&include_market_cap=true';var globalUrl=COINGECKO_URL+'/global';return Promise.all([fetch(url).then(function(r){return r.json()}),fetch(globalUrl).then(function(r){return r.json()}).catch(function(){return null})]).then(function(results){var prices=results[0];var global=results[1];var crypto={};for(var name in CRYPTO_IDS){var id=CRYPTO_IDS[name];var d=prices[id];if(!d)continue;var p=d.usd;var ch=d.usd_24h_change||0;crypto[name]={price:'$'+formatNum(p),change:(ch>=0?'+':'')+ch.toFixed(2)+'%',direction:ch>0.01?'up':ch<-0.01?'down':'zero'}}if(global&&global.data){var mc=global.data.total_market_cap&&global.data.total_market_cap.usd;var mch=global.data.market_cap_change_percentage_24h_usd;if(mc){crypto['Crypto Total']={price:'$'+(mc/1e12).toFixed(2)+'T',change:(mch>=0?'+':'')+(mch||0).toFixed(2)+'%',direction:mch>0?'up':mch<0?'down':'zero'}}}lastCrypto=crypto;return crypto}).catch(function(e){console.warn('[Ticker] Crypto error:',e.message);return null})}function render(){var tradfi=lastTradfi?lastTradfi.tradfi:{};var crypto=lastCrypto||{};var kst=lastTradfi?lastTradfi.kst:new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});var html=[];html.push('<div class="stk-ts"><span class="stk-dot"></span><span class="stk-time">'+esc(kst)+' KST</span></div>');for(var i=0;i<TRADFI_ORDER.length;i++){var name=TRADFI_ORDER[i];var d=tradfi[name];if(d)html.push(makeItem(name,d,false))}html.push('<div class="stk-div"><span></span></div>');for(var j=0;j<CRYPTO_ORDER.length;j++){var cname=CRYPTO_ORDER[j];var cd=crypto[cname];if(cd)html.push(makeItem(cname,cd,true))}var track=html.join('');container.innerHTML='<div class="stk-track">'+track+track+'</div>'}function makeItem(name,d,isCrypto){var dir=d.direction||'zero';var arrow=dir==='up'?'<span class="au"></span>':dir==='down'?'<span class="ad"></span>':'';return'<div class="stk-item"><span class="stk-lbl'+(isCrypto?' crypto':'')+'">'+esc(name)+'</span><span class="stk-prc">'+esc(d.price)+'</span><span class="stk-chg '+dir+'">'+arrow+' '+esc(d.change)+'</span></div>'}function formatNum(n){if(n>=10000)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=100)return n.toFixed(2);if(n>=1)return n.toFixed(2);return n.toFixed(4)}function esc(s){if(!s)return'';var d=document.createElement('span');d.textContent=String(s);return d.innerHTML}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}})();
</script>
