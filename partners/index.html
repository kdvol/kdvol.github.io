<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>순살 — 파트너십 제안서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1c1c1c;
  --border: #2a2a2a;
  --text: #e8e8e8;
  --text-dim: #888;
  --accent: #F38C61;
  --accent2: #F5A882;
  --white: #fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; line-height:1.7; word-break:keep-all; overflow-wrap:break-word; }
.page {
  max-width:1000px; margin:0 auto;
  min-height:100vh; padding:80px 60px;
  page-break-after: always;
  position: relative;
}
.page-num {
  position:absolute; bottom:40px; right:60px;
  font-family:'Space Grotesk',monospace; font-size:13px; color:var(--text-dim);
}

/* Cover */
.cover { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
.cover .logo-mark { font-size:72px; margin-bottom:12px; }
.cover h1 { font-size:56px; font-weight:900; line-height:1.15; margin-bottom:24px; letter-spacing:-2px; }
.cover h1 span { color:var(--accent); }
.cover .subtitle { font-size:20px; color:var(--text-dim); font-weight:300; margin-bottom:48px; }
.cover .meta { font-size:14px; color:var(--text-dim); border-top:1px solid var(--border); padding-top:20px; }
.cover .meta strong { color:var(--text); }
.tag { display:inline-block; background:var(--accent); color:#000; font-size:12px; font-weight:700;
  padding:4px 12px; border-radius:20px; margin-right:8px; margin-bottom:8px; }
.tag.outline { background:transparent; border:1px solid var(--accent); color:var(--accent); }

/* Section headers */
h2 { font-size:32px; font-weight:900; margin-bottom:32px; letter-spacing:-1px; }
h2 .num { color:var(--accent); font-family:'Space Grotesk',monospace; font-weight:600; margin-right:12px; }
h3 { font-size:20px; font-weight:700; margin-bottom:16px; color:var(--white); }

/* Stat grid */
.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin:32px 0; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center; }
.stat-card .number { font-family:'Space Grotesk',monospace; font-size:48px; font-weight:700; color:var(--accent); }
.stat-card .label { font-size:14px; color:var(--text-dim); margin-top:8px; }
.stat-card .detail { font-size:12px; color:var(--text-dim); margin-top:4px; opacity:0.7; }

/* Two col */
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:32px; margin:24px 0; }
.col-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; }
.col-box h4 { font-size:16px; font-weight:700; margin-bottom:12px; color:var(--accent); }
.col-box ul { list-style:none; }
.col-box li { padding:6px 0; font-size:15px; color:var(--text); border-bottom:1px solid var(--border); }
.col-box li:last-child { border-bottom:none; }
.col-box li::before { content:'→ '; color:var(--accent); font-weight:700; }

/* Product table */
.product-table { width:100%; border-collapse:collapse; margin:24px 0; }
.product-table th { text-align:left; padding:14px 16px; font-size:13px; font-weight:700;
  color:var(--accent); text-transform:uppercase; letter-spacing:1px;
  border-bottom:2px solid var(--accent); }
.product-table td { padding:14px 16px; font-size:14px; border-bottom:1px solid var(--border); }
.product-table tr:hover td { background:var(--surface); }
.product-table .highlight { color:var(--accent); font-weight:700; font-family:'Space Grotesk',monospace; }


/* ===== 실제 사례 페이지 ===== */
.case-hero{background:linear-gradient(135deg,rgba(243,140,97,.14),rgba(243,140,97,.03));border:1px solid var(--accent);border-radius:18px;padding:22px 26px;margin-bottom:26px;}
.case-hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--accent);margin-bottom:8px;}
.case-hero h3{font-size:24px;font-weight:900;color:var(--white);margin:0 0 8px;letter-spacing:-0.6px;}
.case-hero p{font-size:14px;color:var(--text);margin:0;}
.nl{background:#f5f5f0;border-radius:14px;overflow:hidden;border:1px solid var(--border);color:#111;}
.nl-head{background:#1a1a1a;padding:11px 16px;}
.nl-head span{color:#fff;font-size:12px;font-weight:700;}
.sf-band{background:linear-gradient(135deg,#032D60 0%,#0B5CAB 55%,#0176D3 100%);padding:16px 18px;text-align:center;}
.sf-kicker{font-size:9px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:2px;margin-bottom:9px;}
.sf-logo{width:88px;height:auto;background:#fff;border-radius:8px;padding:8px 13px;display:inline-block;}
.sf-line{font-size:11.5px;color:rgba(255,255,255,.92);margin-top:9px;}
.nl-body{padding:18px 20px;}
.nl-title{font-size:17px;font-weight:900;color:#111;margin-bottom:11px;line-height:1.35;}
.nl-b{display:flex;gap:7px;font-size:12px;color:#333;line-height:1.7;margin-bottom:8px;}
.nl-b .d{color:#111;font-weight:700;flex-shrink:0;}
.nl-b b{color:#111;}
.nl-link{color:#F38C61;text-decoration:underline;font-weight:600;}
.nl-note{font-size:10px;color:#999;margin-top:10px;}
.cn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 0;}
.cn-grid img{width:100%;border-radius:12px;border:1px solid var(--border);display:block;}
.cn-cap{font-size:12px;color:var(--text-dim);text-align:center;margin-top:8px;}
.app-grid{display:grid;grid-template-columns:0.8fr 0.8fr 1.4fr;gap:16px;align-items:start;}
.app-grid figure{margin:0;}
.app-grid figure img{width:100%;height:520px;object-fit:contain;object-position:top;background:#fff;border-radius:12px;border:1px solid var(--border);display:block;}
.app-grid > div img{width:100%;border-radius:12px;border:1px solid var(--border);display:block;}
.app-grid figcaption{font-size:11.5px;color:var(--text-dim);text-align:center;margin-top:7px;}
@media (max-width:768px){
  .cn-grid{grid-template-columns:repeat(2,1fr);}
  .app-grid{grid-template-columns:1fr;}
  .app-grid figure img{height:auto;}
}

/* Pricing */
.pricing-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; margin:32px 0; }
.pricing-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px; position:relative; }
.pricing-card.featured { border-color:var(--accent); }
.pricing-card.featured::before { content:'RECOMMENDED'; position:absolute; top:-12px; left:24px;
  background:var(--accent); color:#000; font-size:11px; font-weight:700; padding:4px 12px; border-radius:10px; }
.pricing-card .tier-name { font-size:18px; font-weight:700; margin-bottom:4px; }
.pricing-card .tier-price { font-family:'Noto Sans KR','Space Grotesk',monospace; font-size:28px; font-weight:700; color:var(--accent); margin:12px 0; }
.pricing-card .tier-price .unit { font-size:14px; color:var(--text-dim); font-weight:400; }
.pricing-card .tier-detail { font-size:13px; color:var(--text-dim); margin-bottom:16px; }
.pricing-card ul { list-style:none; }
.pricing-card li { padding:6px 0; font-size:14px; }
.pricing-card li::before { content:'✓ '; color:var(--accent); }

/* Quote */
.quote-block { border-left:4px solid var(--accent); padding:24px 32px; margin:32px 0;
  background:var(--surface); border-radius:0 16px 16px 0; font-size:18px; font-style:italic; font-weight:300; }

/* Flow */
.flow-row { display:flex; align-items:center; gap:12px; margin:16px 0; flex-wrap:wrap; }
.flow-step { background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px 20px; font-size:14px; flex:1; min-width:140px; text-align:center; }
.flow-step .step-num { font-family:'Space Grotesk',monospace; font-size:11px; color:var(--accent); font-weight:700; }
.flow-arrow { color:var(--accent); font-size:20px; flex-shrink:0; }

/* Footer bar */
.footer-bar { background:var(--surface); border-top:1px solid var(--border);
  padding:24px 60px; text-align:center; font-size:13px; color:var(--text-dim); }

p { margin-bottom:16px; font-size:15px; }
.dim { color:var(--text-dim); }
.small { font-size:13px; }
.mb-0 { margin-bottom:0; }
.mt-32 { margin-top:32px; }
.accent { color:var(--accent); }

@media screen and (max-width: 768px) {
  .page {
    padding: 32px 20px;
    min-height: auto;
  }
  .page-num {
    position: static;
    text-align: right;
    margin-top: 24px;
  }

  /* Cover */
  .cover h1 { font-size: 32px; letter-spacing: -1px; }
  .cover .subtitle { font-size: 16px; }
  .cover .logo-mark img { width: 60px; height: 60px; }

  /* Section headers */
  h2 { font-size: 22px; margin-bottom: 20px; }
  h3 { font-size: 17px; }

  /* Stat grid → stack vertically */
  .stat-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .stat-card { padding: 20px; }
  .stat-card .number { font-size: 32px; }

  /* Two col → single column */
  .two-col {
    grid-template-columns: 1fr !important;
    gap: 20px !important;
  }
  .col-box { padding: 20px; }

  /* Product table → responsive scroll or stack */
  .product-table { font-size: 12px; }
  .product-table th,
  .product-table td { padding: 10px 8px; font-size: 12px; }

  /* Pricing grid → stack */
  .pricing-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .pricing-card { padding: 24px; }
  .pricing-card .tier-price { font-size: 28px; }

  /* Flow row → wrap */
  .flow-row { flex-direction: column; gap: 8px; }
  .flow-step { min-width: auto; width: 100%; }
  .flow-arrow { transform: rotate(90deg); text-align: center; }

  /* Typography */
  p { font-size: 14px; }
  .small { font-size: 12px; }

  /* Footer */
  .footer-bar { padding: 20px; }

  /* Quote */
  .quote-block { padding: 16px 20px; font-size: 15px; }

  /* Category grid if any */
  .cat-grid {
    grid-template-columns: 1fr !important;
  }
}

@media screen and (max-width: 480px) {
  .page { padding: 24px 16px; }
  .cover h1 { font-size: 26px; }
  .cover .subtitle { font-size: 14px; }
  h2 { font-size: 20px; }
  .stat-card .number { font-size: 28px; }
  .pricing-card .tier-price { font-size: 24px; }
  .product-table th,
  .product-table td { padding: 8px 6px; font-size: 11px; }
  p { font-size: 13px; }
}

@media print {
  .page { padding:40px; min-height:auto; }
}

/* Gate overlay */
.gate-overlay {
  position:fixed; inset:0; z-index:9999;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  transition: opacity 0.4s ease;
}
.gate-overlay.hidden { opacity:0; pointer-events:none; }
.gate-box {
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  padding:48px 36px; max-width:400px; width:90%; text-align:center;
}
.gate-box h2 { font-size:24px; margin-bottom:8px; }
.gate-box p { font-size:14px; color:var(--text-dim); margin-bottom:20px; }
.gate-logo { width:80px; height:80px; object-fit:contain; border-radius:16px; display:block; margin:0 auto 16px; }
.gate-input {
  display:block; width:100%; padding:12px 16px; margin-bottom:12px;
  background:var(--surface2); border:1px solid var(--border); border-radius:10px;
  color:var(--text); font-size:14px; font-family:'Noto Sans KR',sans-serif;
  outline:none;
}
.gate-input:focus { border-color:var(--accent); }
.gate-btn {
  display:block; width:100%; padding:14px; margin-top:8px;
  background:var(--accent); color:#000; border:none; border-radius:10px;
  font-size:15px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  transition: background 0.2s;
}
.gate-btn:hover { background:var(--accent2); }
.gate-error {
  display:none; color:#e74c3c; font-size:13px; margin-top:12px;
}
.gate-note { font-size:11px; color:var(--text-dim); margin-top:16px; opacity:0.7; }

/* Deck content — hidden until authenticated */
.deck-content { display:none; }
.deck-content.visible { display:block; }
</style>
</head>

<script>
// ============================================
// 설정: 아래 값들을 변경하세요
// ============================================
// 액세스 코드 → 유입 경로 라벨 (코드별로 어디서 들어왔는지 추적)
const ACCESS_CODES = {};
const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzMKC_Zhe9AoimhBDJNpmp2_BeUHp7CeXS2CuLqaVq4_ZmFBjexEfbLHRPogYDhQmRu/exec';        // Google Apps Script 웹앱 URL (아래 가이드 참조)

function checkAccess() {
  const email = document.getElementById('gate-email').value.trim();
  const password = document.getElementById('gate-password').value.trim();
  const errorEl = document.getElementById('gate-error');

  if (!email || !email.includes('@')) {
    errorEl.textContent = '이메일을 입력해주세요.';
    errorEl.style.display = 'block';
    return;
  }

  const source = ACCESS_CODES[password];
  if (!source) {
    errorEl.textContent = '액세스 코드가 올바르지 않습니다.';
    errorEl.style.display = 'block';
    return;
  }

  // Log the view
  logView(email, source);

  // Reveal content
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('deck').classList.add('visible');
  setTimeout(() => {
    document.getElementById('gate').style.display = 'none';
  }, 500);
}

// Enter key support
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('gate').style.display !== 'none') {
    checkAccess();
  }
});

function logView(email, source) {
  // ?ref=<파트너식별자> 로 파트너별 유입 구분 (예: /partners/?ref=kim)
  const ref = new URLSearchParams(location.search).get('ref') || '';
  const data = {
    email: email,
    timestamp: new Date().toISOString(),
    page: 'partnership',
    source: source || '',
    ref: ref
  };

  if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== '') {
    fetch(GOOGLE_SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).catch(() => {});
  }
}
</script>

  // 코드별 유입 라벨. 어떤 코드로 열었는지는 열람 기록에 필요하지만,
  // 코드 자체는 여기 담지 않는다 — 순서(슬롯)만 라벨과 짝지어 둔다.
  var SRC = ["direct", "partner"];
  var b2a = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

  async function unlock(code) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    // 코드가 여러 개일 수 있다 — 맞는 것 하나가 내용 키를 풀어준다
    for (var j = 0; j < P.keys.length; j++) {
      var e = P.keys[j];
      try {
        var kek = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b2a(e.s), iterations: P.n, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2a(e.i) }, kek, b2a(e.k));
        var ck = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2a(P.i) }, ck, b2a(P.c));
        return { html: new TextDecoder().decode(plain), idx: j };
      } catch (err) { /* 다음 코드 */ }
    }
    throw new Error('bad code');
  }

  function reveal() {
    // 페이지마다 공개 방식이 다르다(style.display / classList) — 양쪽 다 맞춘다
    var d = document.getElementById('deck'), g = document.getElementById('gate');
    if (d) { d.style.display = ''; d.classList.add('visible'); }
    if (g) { g.classList.add('hidden'); g.style.display = 'none'; }
  }

  window.ssUnlock = async function (code, onOk, onFail) {
    try {
      var r = await unlock((code || '').trim());
      document.getElementById('deck').innerHTML = r.html;
      window.ssCodeIdx = r.idx;        // 유입 경로 라벨용(어느 코드로 열었는지)
      reveal();
      try { sessionStorage.setItem('ss_pk', (code || '').trim()); } catch (e) {}
      if (onOk) onOk();
    } catch (e) { if (onFail) onFail(); }
  };

  // 게이트의 열람 버튼을 가로챈다. 원래 checkAccess는 평문 코드를 비교했다.
  // 다만 원래 하던 일 중 '누가 열었는지 기록'(logView)은 그대로 이어받아야 한다 —
  // 그게 빠지면 열람 알림이 통째로 끊긴다.
  window.addEventListener('DOMContentLoaded', function () {
    var err = document.getElementById('gate-error');
    window.checkAccess = function () {
      var em = document.getElementById('gate-email');
      var el = document.getElementById('gate-password');
      var email = em ? (em.value || '').trim() : '';
      var pw = el ? el.value : '';
      if (em && (!email || email.indexOf('@') < 0)) {
        if (err) { err.textContent = '이메일을 입력해주세요.'; err.style.display = 'block'; }
        return;
      }
      window.ssUnlock(pw, function () {
        try {
          if (typeof logView === 'function') {
            // 원본 logView는 페이지마다 인자가 다르다(email 또는 email, source).
            // 여분 인자는 무시되므로 항상 둘 다 넘긴다.
            logView(email, SRC[window.ssCodeIdx] || '');
          }
        } catch (e) {}
      }, function () {
        if (err) { err.textContent = '액세스 코드가 올바르지 않습니다.'; err.style.display = 'block'; }
      });
    };
  });

  // 같은 탭에서는 다시 묻지 않는다(sessionStorage — 탭을 닫으면 사라진다)
  try {
    var saved = sessionStorage.getItem('ss_pk');
    if (saved) window.addEventListener('DOMContentLoaded', function () {
      window.ssUnlock(saved, null, function () { sessionStorage.removeItem('ss_pk'); });
    });
  } catch (e) {}
})();
</script>
