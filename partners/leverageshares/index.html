<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>순살 × Leverage Shares — 콘텐츠 파트너십 제안</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c; --border:#2a2a2a;
  --text:#e8e8e8; --text-dim:#888; --accent:#F38C61; --white:#fff;
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased;}
.page{max-width:1200px;margin:0 auto;padding:76px 52px 96px;position:relative;border-bottom:1px solid var(--border);}
.page:last-of-type{border-bottom:none;padding-bottom:120px;}
@media print{.page{page-break-after:always;padding:48px 40px;}.gate-overlay{display:none!important;}.deck-content{display:block!important;}}
h2{font-size:36px;font-weight:800;color:var(--white);letter-spacing:-1.2px;margin-bottom:10px;}
h2 .num{display:inline-block;font-size:15px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:3px 13px;margin-right:12px;vertical-align:middle;font-weight:700;letter-spacing:0;}
h3{font-size:24px;font-weight:800;color:var(--white);margin:26px 0 14px;}
h4{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:9px;}
p{font-size:17.5px;margin-bottom:10px;}
.lead{font-size:20px;margin-bottom:22px;line-height:1.65;}
.dim{color:var(--text-dim);} .small{font-size:15.5px;} .hl{color:var(--accent);font-weight:700;}
ul{list-style:none;} li{font-size:17px;padding:5px 0;padding-left:16px;position:relative;line-height:1.55;}
li:before{content:'·';position:absolute;left:0;color:var(--accent);font-weight:700;}
a.ch-link{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);}
a.ch-link.sub{color:var(--accent);border-bottom-style:dashed;opacity:.8;}
.col-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 26px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0;}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:17px;}
th{background:var(--surface2);color:var(--accent);text-align:left;padding:12px 15px;font-weight:700;font-size:15.5px;border-bottom:1px solid var(--border);}
td{padding:14px 15px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.hi{color:var(--accent);font-weight:700;}
.quote-block{border-left:4px solid var(--accent);padding:24px 26px;margin:22px 0;font-size:18.5px;line-height:1.7;background:var(--surface);border-radius:0 12px 12px 0;}
.page-num{position:absolute;bottom:36px;right:52px;font-size:12px;color:var(--text-dim);letter-spacing:1px;}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:82vh;}
.cover .kicker{font-size:15px;color:var(--accent);letter-spacing:3px;font-weight:700;margin-bottom:20px;}
.cover h1{font-size:54px;font-weight:800;line-height:1.26;letter-spacing:-2px;color:var(--white);margin-bottom:18px;}
.cover .sub{font-size:21px;color:var(--text-dim);margin-bottom:34px;}
.cover .meta{font-size:17px;color:var(--text-dim);border-top:1px solid var(--border);padding-top:20px;line-height:1.8;}

.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:20px 0;}
.stat-row.tri{grid-template-columns:repeat(3,1fr);}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 26px;}
.stat .v{font-size:38px;font-weight:800;color:var(--accent);letter-spacing:-1.5px;line-height:1.15;}
.stat .l{font-size:16px;color:var(--white);font-weight:700;margin-top:4px;}
.stat .n{font-size:14.5px;color:var(--text-dim);margin-top:3px;line-height:1.45;}

.ch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0;}
.ch{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:20px 20px;}
.ch .n{font-size:16px;font-weight:800;color:var(--white);}
.ch .f{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:-0.5px;margin-top:2px;}
.ch .d{font-size:13.5px;color:var(--text-dim);}

.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:12px;margin:30px 0;}
.flow .arw{align-self:center;color:var(--accent);font-size:24px;font-weight:800;}
.flow .st{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px 24px;}
.flow .st.on{border-color:var(--accent);}
.flow .st .w{font-size:14px;font-weight:800;color:var(--accent);letter-spacing:1px;}
.flow .st .t{font-size:19px;font-weight:800;color:var(--white);margin:3px 0 6px;}
.flow .st .d{font-size:14.5px;color:var(--text-dim);line-height:1.5;}

.annual-label{display:inline-block;background:var(--accent);color:#000;font-size:11px;font-weight:800;padding:2px 9px;border-radius:4px;margin-left:8px;vertical-align:middle;}
.note{font-size:13.5px;color:var(--text-dim);margin-top:10px;line-height:1.6;}
.free-tag{display:inline-block;background:#2a6b3a;color:#7defa0;font-size:11px;font-weight:800;padding:2px 8px;border-radius:4px;margin-left:6px;vertical-align:middle;}

.domain-box{font-size:14px;color:var(--text-dim);line-height:1.9;margin-top:14px;}
.domain-box strong{color:var(--accent);}
.domain-note{font-size:12.5px;color:var(--text-dim);margin-top:14px;padding:12px 16px;background:rgba(243,140,97,.08);border-radius:8px;line-height:1.7;}
.domain-note strong{color:var(--accent);}

@media screen and (max-width:900px){
  .page{padding:44px 20px 56px;}
  .cover{min-height:auto;padding-top:64px;} .cover h1{font-size:31px;}
  h2{font-size:25px;} h3{font-size:20px;} .lead{font-size:17px;} p,li{font-size:16px;}
  .two-col,.stat-row,.stat-row.tri,.ch-grid,.flow{grid-template-columns:1fr;}
  .flow .arw{display:none;}
  table{font-size:14px;display:block;overflow-x:auto;}
  .page-num{position:static;text-align:right;margin-top:16px;}
}

/* Gate */
.gate-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;}
.gate-overlay.hidden{opacity:0;pointer-events:none;}
.gate-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 36px;max-width:400px;width:90%;text-align:center;}
.gate-box h2{font-size:24px;font-weight:800;color:var(--white);margin-bottom:8px;letter-spacing:-0.5px;}
.gate-box p{font-size:14px;color:var(--text-dim);margin-bottom:20px;}
.gate-logo{width:80px;height:80px;object-fit:contain;border-radius:16px;display:block;margin:0 auto 16px;}
.gate-input{display:block;width:100%;padding:12px 16px;margin-bottom:12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;}
.gate-input:focus{border-color:var(--accent);}
.gate-btn{display:block;width:100%;padding:14px;margin-top:8px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .2s;}
.gate-btn:hover{background:#F5A882;}
.gate-error{display:none;color:#e74c3c;font-size:13px;margin-top:12px;}
.gate-note{font-size:11px;color:var(--text-dim);margin-top:16px;opacity:.7;}
.deck-content{display:none;}
.deck-content.visible{display:block;}
</style>
</head>
<body>

<div class="gate-overlay" id="gate">
  <div class="gate-box">
    <img src="soonsal-logo.png" class="gate-logo" alt="순살">
    <p style="text-align:center;font-size:15px;font-weight:700;color:var(--white);margin-bottom:24px;">순살</p>
    <h2>Leverage Shares 제안서</h2>
    <p>열람을 위해 이메일과 액세스 코드를 입력해주세요.</p>
    <input type="email" class="gate-input" id="gate-email" placeholder="업무 이메일" required>
    <input type="password" class="gate-input" id="gate-password" placeholder="액세스 코드">
    <button class="gate-btn" onclick="checkAccess()">열람하기</button>
    <div class="gate-error" id="gate-error">액세스 코드가 올바르지 않습니다.</div>
    <p class="gate-note">입력하신 이메일은 제휴 안내 목적으로만 사용됩니다.</p>
  </div>
</div>

<div class="deck-content" id="deck"></div><!-- /deck -->

<script>
var ACCESS_CODES = {};
var GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzMKC_Zhe9AoimhBDJNpmp2_BeUHp7CeXS2CuLqaVq4_ZmFBjexEfbLHRPogYDhQmRu/exec';

function checkAccess() {
  var email = document.getElementById('gate-email').value.trim();
  var password = document.getElementById('gate-password').value.trim();
  var errorEl = document.getElementById('gate-error');
  if (!email || !email.includes('@')) {
    errorEl.textContent = '이메일을 입력해주세요.';
    errorEl.style.display = 'block';
    return;
  }
  var source = ACCESS_CODES[password];
  if (!source) {
    errorEl.textContent = '액세스 코드가 올바르지 않습니다.';
    errorEl.style.display = 'block';
    return;
  }
  logView(email, source);
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('deck').classList.add('visible');
  setTimeout(function(){ document.getElementById('gate').style.display = 'none'; }, 500);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('gate').style.display !== 'none') checkAccess();
});

function logView(email, source) {
  var ref = new URLSearchParams(location.search).get('ref') || '';
  var data = { email: email, timestamp: new Date().toISOString(), page: 'leverageshares', source: source || '', ref: ref };
  if (GOOGLE_SHEET_URL) {
    fetch(GOOGLE_SHEET_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).catch(function(){});
  }
}
</script>

  // 코드별 유입 라벨. 어떤 코드로 열었는지는 열람 기록에 필요하지만,
  // 코드 자체는 여기 담지 않는다 — 순서(슬롯)만 라벨과 짝지어 둔다.
  var SRC = ["direct"];
  var b2a = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

  async function unlock(code) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    // 코드가 여러 개일 수 있다 — 맞는 것 하나가 내용 키를 풀어준다
    for (var j = 0; j < P.keys.length; j++) {
      var e = P.keys[j];
      try {
        var kek = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b2a(e.s), iterations: P.n, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2a(e.i) }, kek, b2a(e.k));
        var ck = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2a(P.i) }, ck, b2a(P.c));
        return { html: new TextDecoder().decode(plain), idx: j };
      } catch (err) { /* 다음 코드 */ }
    }
    throw new Error('bad code');
  }

  function reveal() {
    // 페이지마다 공개 방식이 다르다(style.display / classList) — 양쪽 다 맞춘다
    var d = document.getElementById('deck'), g = document.getElementById('gate');
    if (d) { d.style.display = ''; d.classList.add('visible'); }
    if (g) { g.classList.add('hidden'); g.style.display = 'none'; }
  }

  window.ssUnlock = async function (code, onOk, onFail) {
    try {
      var r = await unlock((code || '').trim());
      document.getElementById('deck').innerHTML = r.html;
      window.ssCodeIdx = r.idx;        // 유입 경로 라벨용(어느 코드로 열었는지)
      reveal();
      try { sessionStorage.setItem('ss_pk', (code || '').trim()); } catch (e) {}
      if (onOk) onOk();
    } catch (e) { if (onFail) onFail(); }
  };

  // 게이트의 열람 버튼을 가로챈다. 원래 checkAccess는 평문 코드를 비교했다.
  // 다만 원래 하던 일 중 '누가 열었는지 기록'(logView)은 그대로 이어받아야 한다 —
  // 그게 빠지면 열람 알림이 통째로 끊긴다.
  window.addEventListener('DOMContentLoaded', function () {
    var err = document.getElementById('gate-error');
    window.checkAccess = function () {
      var em = document.getElementById('gate-email');
      var el = document.getElementById('gate-password');
      var email = em ? (em.value || '').trim() : '';
      var pw = el ? el.value : '';
      if (em && (!email || email.indexOf('@') < 0)) {
        if (err) { err.textContent = '이메일을 입력해주세요.'; err.style.display = 'block'; }
        return;
      }
      window.ssUnlock(pw, function () {
        try {
          if (typeof logView === 'function') {
            // 원본 logView는 페이지마다 인자가 다르다(email 또는 email, source).
            // 여분 인자는 무시되므로 항상 둘 다 넘긴다.
            logView(email, SRC[window.ssCodeIdx] || '');
          }
        } catch (e) {}
      }, function () {
        if (err) { err.textContent = '액세스 코드가 올바르지 않습니다.'; err.style.display = 'block'; }
      });
    };
  });

  // 같은 탭에서는 다시 묻지 않는다(sessionStorage — 탭을 닫으면 사라진다)
  try {
    var saved = sessionStorage.getItem('ss_pk');
    if (saved) window.addEventListener('DOMContentLoaded', function () {
      window.ssUnlock(saved, null, function () { sessionStorage.removeItem('ss_pk'); });
    });
  } catch (e) {}
})();
</script>
