<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>순살 × 한국투자신탁운용 — 콘텐츠 공급 제안서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1c1c1c;
  --border: #2a2a2a;
  --text: #e8e8e8;
  --text-dim: #888;
  --accent: #F38C61;
  --accent2: #F5A882;
  --white: #fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; line-height:1.7; word-break:keep-all; overflow-wrap:break-word; }
.page {
  max-width:1000px; margin:0 auto;
  min-height:100vh; padding:80px 60px;
  page-break-after: always;
  position: relative;
}
.page-num {
  position:absolute; bottom:40px; right:60px;
  font-family:'Space Grotesk',monospace; font-size:13px; color:var(--text-dim);
}

/* Cover */
.cover { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
.cover .logo-mark { font-size:72px; margin-bottom:12px; }
.cover h1 { font-size:52px; font-weight:900; line-height:1.18; margin-bottom:24px; letter-spacing:-2px; }
.cover h1 span { color:var(--accent); }
.cover .subtitle { font-size:20px; color:var(--text-dim); font-weight:300; margin-bottom:48px; }
.cover .meta { font-size:14px; color:var(--text-dim); border-top:1px solid var(--border); padding-top:20px; }
.cover .meta strong { color:var(--text); }
.tag { display:inline-block; background:var(--accent); color:#000; font-size:12px; font-weight:700;
  padding:4px 12px; border-radius:20px; margin-right:8px; margin-bottom:8px; }
.tag.outline { background:transparent; border:1px solid var(--accent); color:var(--accent); }
.tag.muted { background:var(--surface2); color:var(--text-dim); border:1px solid var(--border); }

/* Section headers */
h2 { font-size:32px; font-weight:900; margin-bottom:32px; letter-spacing:-1px; }
h2 .num { color:var(--accent); font-family:'Space Grotesk',monospace; font-weight:600; margin-right:12px; }
h3 { font-size:20px; font-weight:700; margin-bottom:16px; color:var(--white); }

/* Stat grid */
.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin:32px 0; }
.stat-grid.four { grid-template-columns:repeat(4,1fr); }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center; }
.stat-card .number { font-family:'Space Grotesk',monospace; font-size:44px; font-weight:700; color:var(--accent); }
.stat-card .label { font-size:14px; color:var(--text-dim); margin-top:8px; }
.stat-card .detail { font-size:12px; color:var(--text-dim); margin-top:4px; opacity:0.7; }

/* Two col */
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:32px; margin:24px 0; }
.col-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; }
.col-box h4 { font-size:16px; font-weight:700; margin-bottom:12px; color:var(--accent); }
.col-box ul { list-style:none; }
.col-box li { padding:6px 0; font-size:15px; color:var(--text); border-bottom:1px solid var(--border); }
.col-box li:last-child { border-bottom:none; }
.col-box li::before { content:'→ '; color:var(--accent); font-weight:700; }

/* Product table */
.product-table { width:100%; border-collapse:collapse; margin:24px 0; }
.product-table th { text-align:left; padding:14px 16px; font-size:13px; font-weight:700;
  color:var(--accent); text-transform:uppercase; letter-spacing:1px;
  border-bottom:2px solid var(--accent); }
.product-table td { padding:14px 16px; font-size:14px; border-bottom:1px solid var(--border); vertical-align:top; }
.product-table tr:hover td { background:var(--surface); }
.product-table .highlight { color:var(--accent); font-weight:700; font-family:'Space Grotesk',monospace; }

/* Pricing */
.pricing-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin:32px 0; }
.pricing-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; position:relative; }
.pricing-card.featured { border-color:var(--accent); }
.pricing-card.featured::before { content:'RECOMMENDED'; position:absolute; top:-12px; left:24px;
  background:var(--accent); color:#000; font-size:11px; font-weight:700; padding:4px 12px; border-radius:10px; }
.pricing-card .tier-name { font-size:18px; font-weight:700; margin-bottom:4px; }
.pricing-card .tier-price { font-family:'Noto Sans KR','Space Grotesk',monospace; font-size:26px; font-weight:700; color:var(--accent); margin:12px 0; }
.pricing-card .tier-price .unit { font-size:13px; color:var(--text-dim); font-weight:400; }
.pricing-card .tier-detail { font-size:13px; color:var(--text-dim); margin-bottom:16px; }
.pricing-card ul { list-style:none; }
.pricing-card li { padding:6px 0; font-size:14px; }
.pricing-card li::before { content:'✓ '; color:var(--accent); }

/* Quote */
.quote-block { border-left:4px solid var(--accent); padding:24px 32px; margin:32px 0;
  background:var(--surface); border-radius:0 16px 16px 0; font-size:18px; font-style:italic; font-weight:300; }

/* Flow */
.flow-row { display:flex; align-items:center; gap:12px; margin:16px 0; flex-wrap:wrap; }
.flow-step { background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px 20px; font-size:14px; flex:1; min-width:140px; text-align:center; }
.flow-step .step-num { font-family:'Space Grotesk',monospace; font-size:11px; color:var(--accent); font-weight:700; }
.flow-arrow { color:var(--accent); font-size:20px; flex-shrink:0; }

/* Case study cards */
.case-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; margin:20px 0; }
.case-card .case-head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
.case-card .case-name { font-size:21px; font-weight:900; color:var(--white); letter-spacing:-0.5px; }
.case-card .case-badge { font-family:'Space Grotesk',monospace; font-size:12px; color:var(--accent); font-weight:600; }
.case-card .case-sub { font-size:14px; color:var(--text-dim); margin-bottom:18px; }
.case-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:18px 0; }
.case-metric { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:16px; }
.case-metric .m-label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
.case-metric .m-value { font-size:18px; font-weight:700; color:var(--accent); margin-top:4px; font-family:'Noto Sans KR','Space Grotesk',monospace; }
.case-metric .m-value.text { font-size:15px; color:var(--text); font-family:'Noto Sans KR',sans-serif; }
.case-card .case-note { font-size:14px; color:var(--text); margin-top:6px; }
.case-card .case-note strong { color:var(--accent); }

/* Logo / portfolio strip */
.logo-strip { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0; }
.logo-chip { background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 16px; font-size:14px; font-weight:500; color:var(--text); }
.logo-chip strong { color:var(--accent); }

/* Timeline */
.timeline { position:relative; margin:28px 0; padding-left:28px; }
.timeline::before { content:''; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--border); }
.tl-item { position:relative; padding:0 0 22px 0; }
.tl-item::before { content:''; position:absolute; left:-26px; top:4px; width:14px; height:14px;
  border-radius:50%; background:var(--accent); border:3px solid var(--bg); }
.tl-item .tl-when { font-family:'Space Grotesk',monospace; font-size:12px; color:var(--accent); font-weight:700; }
.tl-item .tl-what { font-size:15px; color:var(--text); margin-top:2px; }
.tl-item .tl-what span { color:var(--text-dim); font-size:13px; }

/* Footer bar */
.footer-bar { background:var(--surface); border-top:1px solid var(--border);
  padding:24px 60px; text-align:center; font-size:13px; color:var(--text-dim); }

p { margin-bottom:16px; font-size:15px; }
.dim { color:var(--text-dim); }
.small { font-size:13px; }
.mb-0 { margin-bottom:0; }
.mt-32 { margin-top:32px; }
.accent { color:var(--accent); }

@media screen and (max-width: 768px) {
  .page { padding: 32px 20px; min-height: auto; }
  .page-num { position: static; text-align: right; margin-top: 24px; }
  .cover h1 { font-size: 30px; letter-spacing: -1px; }
  .cover .subtitle { font-size: 16px; }
  .cover .logo-mark img { width: 60px; height: 60px; }
  h2 { font-size: 22px; margin-bottom: 20px; }
  h3 { font-size: 17px; }
  .stat-grid, .stat-grid.four { grid-template-columns: 1fr; gap: 16px; }
  .stat-card { padding: 20px; }
  .stat-card .number { font-size: 32px; }
  .two-col { grid-template-columns: 1fr !important; gap: 20px !important; }
  .col-box { padding: 20px; }
  .product-table { font-size: 12px; }
  .product-table th, .product-table td { padding: 10px 8px; font-size: 12px; }
  .pricing-grid { grid-template-columns: 1fr; gap: 20px; }
  .pricing-card { padding: 24px; }
  .case-metrics { grid-template-columns: 1fr; }
  .flow-row { flex-direction: column; gap: 8px; }
  .flow-step { min-width: auto; width: 100%; }
  .flow-arrow { transform: rotate(90deg); text-align: center; }
  p { font-size: 14px; }
  .small { font-size: 12px; }
  .footer-bar { padding: 20px; }
  .quote-block { padding: 16px 20px; font-size: 15px; }
}
@media screen and (max-width: 480px) {
  .page { padding: 24px 16px; }
  .cover h1 { font-size: 25px; }
  h2 { font-size: 20px; }
  .stat-card .number { font-size: 28px; }
}
@media print { .page { padding:40px; min-height:auto; } }

/* ===== In-app content preview mockups ===== */
.preview-grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin:28px 0; align-items:start; }
.phone { width:100%; max-width:300px; margin:0 auto; background:#0f0f0f; border:9px solid #1c1c1c;
  border-radius:38px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.55); }
.phone-notch { height:24px; background:#0f0f0f; display:flex; align-items:center; justify-content:center; }
.phone-notch::after { content:''; width:88px; height:6px; background:#000; border-radius:0 0 8px 8px; margin-top:-2px; }
.phone-screen { background:#f4f6f9; }
.app-bar { background:#0a2540; color:#fff; padding:13px 16px; display:flex; align-items:center; gap:8px; }
.app-bar .app-logo { width:18px; height:18px; border-radius:5px; background:var(--accent); flex-shrink:0; }
.app-bar .app-name { font-size:12.5px; font-weight:700; letter-spacing:-0.3px; }
.app-bar .app-tab { margin-left:auto; font-size:10.5px; color:#8fb0d6; }
.preview-cap { text-align:center; font-size:13px; color:var(--text-dim); margin-top:14px; }
.preview-cap strong { color:var(--accent); }
/* daily article mock */
.mock-art { padding:16px 16px 20px; }
.mock-cat { display:inline-block; background:#0a2540; color:#fff; font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:0.3px; }
.mock-title { color:#10151c; font-size:17px; font-weight:900; line-height:1.35; margin:12px 0 6px; letter-spacing:-0.5px; }
.mock-meta { color:#8a93a0; font-size:11px; margin-bottom:14px; }
.mock-lead { color:#10151c; font-size:12.5px; line-height:1.6; margin-bottom:12px; background:#fff; border-left:3px solid var(--accent); padding:10px 12px; border-radius:0 8px 8px 0; }
.mock-lead b { color:var(--accent); }
.mock-art ul { list-style:none; padding:0; margin:0 0 14px; }
.mock-art li { color:#28303b; font-size:12px; line-height:1.5; padding:7px 0 7px 18px; position:relative; border-bottom:1px solid #e6eaef; }
.mock-art li::before { content:''; position:absolute; left:2px; top:13px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.mock-hash { color:#9aa3b0; font-size:11px; margin-top:4px; }
/* card news mock */
.cn-stage { padding:18px 16px 8px; background:#eef1f5; }
.cn-card { border-radius:16px; padding:22px 18px; min-height:300px; display:flex; flex-direction:column;
  background:linear-gradient(155deg,#0a2540 0%,#15426e 60%,#1d5a96 100%); position:relative; overflow:hidden; }
.cn-card::after { content:''; position:absolute; right:-40px; bottom:-40px; width:160px; height:160px; border-radius:50%; background:rgba(243,140,97,0.18); }
.cn-kicker { color:var(--accent); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; z-index:1; }
.cn-head { color:#fff; font-size:26px; font-weight:900; line-height:1.25; margin-top:10px; letter-spacing:-0.8px; z-index:1; }
.cn-desc { color:#bcd2ea; font-size:12px; line-height:1.55; margin-top:14px; z-index:1; }
.cn-foot { margin-top:auto; color:#7f9cbd; font-size:10.5px; z-index:1; padding-top:16px; }
.cn-foot b { color:#fff; }
.cn-dots { display:flex; gap:5px; justify-content:center; padding:12px 0 16px; background:#eef1f5; }
.cn-dots span { width:6px; height:6px; border-radius:50%; background:#c2ccd8; }
.cn-dots span.on { background:var(--accent); width:18px; border-radius:3px; }
/* daily brief story blocks */
.mock-story { padding:10px 0; border-bottom:1px solid #e6eaef; }
.mock-story:last-child { border-bottom:none; }
.mock-story .st-head { color:#0a2540; font-size:12.5px; font-weight:800; display:block; }
.mock-story .st-head em { font-style:normal; color:var(--accent); }
.mock-story .st-body { display:block; color:#3a434f; font-size:11.5px; line-height:1.55; margin-top:3px; }
/* card news cut strip */
.cn-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:24px; }
.cn-mini { border-radius:13px; padding:15px 13px; min-height:172px; display:flex; flex-direction:column;
  background:linear-gradient(160deg,#13243a 0%,#1d4570 100%); position:relative; overflow:hidden; }
.cn-mini::after { content:''; position:absolute; right:-30px; bottom:-30px; width:90px; height:90px; border-radius:50%; background:rgba(243,140,97,0.14); }
.cn-mini .mn-num { font-family:'Space Grotesk',monospace; font-size:11px; color:var(--accent); font-weight:700; z-index:1; }
.cn-mini .mn-head { color:#fff; font-size:15px; font-weight:800; line-height:1.3; margin-top:8px; letter-spacing:-0.3px; z-index:1; }
.cn-mini .mn-body { color:#bcd2ea; font-size:11px; line-height:1.5; margin-top:8px; z-index:1; }
@media screen and (max-width:768px){
  .preview-grid { grid-template-columns:1fr; gap:32px; }
  .cn-strip { grid-template-columns:1fr 1fr; }
}

/* ===== KIS-style card news (orange frame) ===== */
.cn2-cover { background:#fff; border:6px solid var(--accent); border-radius:16px; padding:18px 16px; min-height:330px; display:flex; flex-direction:column; }
.cn2-kick { font-size:11px; font-weight:700; color:var(--accent); letter-spacing:0.5px; }
.cn2-title { color:#10151c; font-size:26px; font-weight:900; letter-spacing:-1px; line-height:1.22; margin-top:8px; }
.cn2-illust { flex:1; display:flex; align-items:center; justify-content:center; }
.cn2-illust .emoji { font-size:92px; line-height:1; }
.cn2-cap { text-align:center; color:#10151c; font-size:14px; font-weight:800; }
.cn2-cap b { color:var(--accent); }
.cn2-foot { display:flex; align-items:center; justify-content:center; gap:6px; color:#9aa3b0; font-size:10px; font-weight:700; border-top:1px solid #eee; padding-top:10px; margin-top:12px; }
.cn2-foot b { color:#10151c; }
.cn2-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:22px; }
.cn2-cut { background:#fff; border:4px solid var(--accent); border-radius:13px; padding:13px 12px; display:flex; flex-direction:column; min-height:200px; }
.cn2-cut .ct-num { font-size:16px; font-weight:900; color:#10151c; letter-spacing:-0.5px; line-height:1.25; }
.cn2-cut .ct-visual { flex:1; display:flex; align-items:center; justify-content:center; padding:8px 0; }
.cn2-cut .ct-visual .vemoji { font-size:42px; }
.basket { display:flex; flex-wrap:wrap; gap:3px; width:74px; justify-content:center; }
.basket i { width:15px; height:15px; border-radius:3px; display:block; }
.points { font-size:10.5px; color:#28303b; line-height:1.7; }
.points b { color:var(--accent); }
.cn2-cut .ct-take { font-size:10.5px; color:#3a434f; line-height:1.45; }
.cn2-cut .ct-take b { color:var(--accent); }
.cn2-cut .ct-foot { font-size:8px; color:#b8c0ca; text-align:center; border-top:1px solid #f0f0f0; padding-top:6px; margin-top:8px; font-weight:700; }

/* real card news image gallery */
.cn-real { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:18px; }
.cn-real figure { margin:0; }
.cn-real img { width:100%; border-radius:12px; display:block; box-shadow:0 10px 28px rgba(0,0,0,0.45); }
.cn-real figcaption { font-size:10.5px; color:var(--text-dim); text-align:center; margin-top:7px; }
.mock-sig { font-size:10.5px; color:#9aa3b0; font-style:italic; margin-top:10px; padding-top:8px; border-top:1px dashed #d8dde3; }
@media screen and (max-width:768px){ .cn-real { grid-template-columns:1fr 1fr; } }

/* deep story card (real newsletter section) */
.story-card { background:#fff; border-radius:16px; padding:30px 32px; margin-top:8px; }
.story-card .sc-cat { display:inline-block; background:#0a2540; color:#fff; font-size:11px; font-weight:700; padding:3px 11px; border-radius:20px; letter-spacing:0.5px; }
.story-card .sc-title { color:#10151c; font-size:25px; font-weight:900; letter-spacing:-1px; margin:14px 0 6px; line-height:1.28; }
.story-card .sc-meta { color:#8a93a0; font-size:12px; margin-bottom:18px; }
.story-card .sc-lead { background:#fff6f1; border-left:3px solid var(--accent); padding:13px 15px; border-radius:0 8px 8px 0; font-size:14.5px; color:#10151c; line-height:1.65; margin-bottom:18px; font-weight:500; }
.story-card .sc-p { font-size:13.5px; color:#2a323d; line-height:1.8; padding:9px 0 9px 18px; position:relative; border-bottom:1px solid #f0f2f5; }
.story-card .sc-p:last-of-type { border-bottom:none; }
.story-card .sc-p::before { content:'◾'; position:absolute; left:0; top:11px; color:var(--accent); font-size:9px; }
.story-card .sc-p b, .story-card .sc-p strong { color:#10151c; font-weight:700; }
.story-card .sc-p .sub { font-size:0.85em; color:inherit; }
.story-card .sc-p .note { font-size:0.78em; color:#a2abb5; }
.story-card .sc-sig { font-size:12px; color:#9aa3b0; font-style:italic; margin-top:14px; padding-top:11px; border-top:1px dashed #e2e6eb; }
@media screen and (max-width:768px){ .story-card { padding:22px 20px; } .story-card .sc-title{ font-size:20px; } }

/* ===== Per-client screen mockups ===== */
.case-body { display:grid; grid-template-columns:1fr 224px; gap:26px; align-items:start; margin-top:4px; }
.phone.sm { max-width:224px; border-width:7px; border-radius:30px; margin:0; }
.phone.sm .phone-screen { min-height:auto; }
.shot-cap { text-align:center; font-size:11px; color:var(--text-dim); margin-top:9px; }
.appbar2 { color:#fff; padding:11px 13px; display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; }
.appbar2 .dot { width:15px; height:15px; border-radius:4px; background:rgba(255,255,255,0.9); }
.appbar2 .tab { margin-left:auto; font-size:9.5px; opacity:0.85; font-weight:500; }
.b-nh{background:#019e5d;} .b-bc{background:#e6004c;} .b-kis{background:#b81c22;} .b-sh{background:#0046ad;}
.feed { background:#f1f4f8; padding:11px; }
.feed-h { font-size:12px; font-weight:800; color:#10151c; margin:2px 2px 9px; }
.feed-h span { color:#8a93a0; font-weight:500; font-size:9.5px; display:block; margin-top:2px; }
.fitem { background:#fff; border-radius:9px; padding:9px 10px; margin-bottom:7px; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
.fitem .ft { font-size:11px; font-weight:700; color:#1a2230; line-height:1.35; }
.fitem .fm { font-size:9px; color:#9aa3b0; margin-top:3px; }
.fitem.hot { border-left:3px solid var(--accent); }
.mkt { display:flex; gap:5px; margin-bottom:8px; }
.mkt div { flex:1; background:#fff; border-radius:7px; padding:6px 3px; text-align:center; }
.mkt .mi { font-size:8.5px; color:#8a93a0; }
.mkt .mv { font-size:10px; font-weight:800; margin-top:2px; color:#10151c; }
.mkt .mc { font-size:8.5px; margin-top:1px; }
.mkt .up{color:#e6004c;} .mkt .dn{color:#1f6fe6;}
.wbrief { background:#fff; padding:13px; }
.wbrief .wb-tag { display:inline-block; background:#0046ad; color:#fff; font-size:9px; font-weight:700; padding:3px 8px; border-radius:20px; }
.wbrief .wb-title { font-size:14px; font-weight:900; color:#10151c; line-height:1.3; margin:9px 0 4px; letter-spacing:-0.4px; }
.wbrief .wb-sub { font-size:10px; color:#8a93a0; margin-bottom:10px; }
.wbrief .wb-li { font-size:10.5px; color:#28303b; line-height:1.5; padding:7px 0 7px 14px; position:relative; border-bottom:1px solid #eef0f3; }
.wbrief .wb-li:last-child { border-bottom:none; }
.wbrief .wb-li::before { content:''; position:absolute; left:1px; top:13px; width:5px; height:5px; border-radius:50%; background:#0046ad; }
.wbrief .wb-li b { color:#10151c; }
.kis-thumb { background:#fff; border:3px solid var(--accent); border-radius:10px; padding:10px; margin-top:7px; display:flex; align-items:center; gap:9px; }
.kis-thumb .kt-emo { font-size:26px; }
.kis-thumb .kt-t { font-size:10.5px; font-weight:800; color:#10151c; line-height:1.3; }
.kis-thumb .kt-s { font-size:9px; color:#9aa3b0; margin-top:2px; }

@media screen and (max-width:768px){
  .case-body { grid-template-columns:1fr; }
  .phone.sm { max-width:260px; margin:0 auto; }
  .cn2-strip { grid-template-columns:1fr 1fr; }
}

/* Gate overlay */
.gate-overlay { position:fixed; inset:0; z-index:9999; background:var(--bg);
  display:flex; align-items:center; justify-content:center; transition: opacity 0.4s ease; }
.gate-overlay.hidden { opacity:0; pointer-events:none; }
.gate-box { background:var(--surface); border:1px solid var(--border); border-radius:20px;
  padding:48px 36px; max-width:400px; width:90%; text-align:center; }
.gate-box h2 { font-size:24px; margin-bottom:8px; }
.gate-box p { font-size:14px; color:var(--text-dim); margin-bottom:20px; }
.gate-logo { width:80px; height:80px; object-fit:contain; border-radius:16px; display:block; margin:0 auto 16px; }
.gate-input { display:block; width:100%; padding:12px 16px; margin-bottom:12px;
  background:var(--surface2); border:1px solid var(--border); border-radius:10px;
  color:var(--text); font-size:14px; font-family:'Noto Sans KR',sans-serif; outline:none; }
.gate-input:focus { border-color:var(--accent); }
.gate-btn { display:block; width:100%; padding:14px; margin-top:8px;
  background:var(--accent); color:#000; border:none; border-radius:10px;
  font-size:15px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition: background 0.2s; }
.gate-btn:hover { background:var(--accent2); }
.gate-error { display:none; color:#e74c3c; font-size:13px; margin-top:12px; }
.gate-note { font-size:11px; color:var(--text-dim); margin-top:16px; opacity:0.7; }

/* Deck content — hidden until authenticated */
.deck-content { display:none; }
.deck-content.visible { display:block; }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div class="gate-overlay" id="gate">
  <div class="gate-box">
    <img src="soonsal-logo.png" class="gate-logo" alt="순살">
    <h2>콘텐츠 공급 제안서</h2>
    <p>열람을 위해 이메일과 액세스 코드를 입력해주세요.</p>
    <input type="email" class="gate-input" id="gate-email" placeholder="업무 이메일" required>
    <input type="password" class="gate-input" id="gate-password" placeholder="액세스 코드">
    <button class="gate-btn" onclick="checkAccess()">열람하기</button>
    <div class="gate-error" id="gate-error">액세스 코드가 올바르지 않습니다.</div>
    <p class="gate-note">입력하신 이메일은 제휴 안내 목적으로만 사용됩니다.</p>
  </div>
</div>

<!-- DECK CONTENT (hidden until authenticated) -->
<div class="deck-content" id="deck"></div>

<script>
// ============================================
// 설정
// ============================================
const ACCESS_CODE = '';
const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxUxmj9w4H1dR52nyBLhOA52mJPGOmzfCUJwHm6P_GB75sDPdu4fSyiH-AN8SxwLdA/exec';

function checkAccess() {
  const email = document.getElementById('gate-email').value.trim();
  const password = document.getElementById('gate-password').value.trim();
  const errorEl = document.getElementById('gate-error');

  if (!email || !email.includes('@')) {
    errorEl.textContent = '이메일을 입력해주세요.';
    errorEl.style.display = 'block';
    return;
  }
  if (password !== ACCESS_CODE) {
    errorEl.textContent = '액세스 코드가 올바르지 않습니다.';
    errorEl.style.display = 'block';
    return;
  }
  logView(email);
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('deck').classList.add('visible');
  setTimeout(() => { document.getElementById('gate').style.display = 'none'; }, 500);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('gate').style.display !== 'none') {
    checkAccess();
  }
});

function logView(email) {
  const data = { email: email, timestamp: new Date().toISOString(), page: 'KIM' };
  if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== '') {
    fetch(GOOGLE_SHEET_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).catch(() => {});
  }
}
</script>

  var b2a = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

  async function unlock(code) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    // 코드가 여러 개일 수 있다 — 맞는 것 하나가 내용 키를 풀어준다
    for (var j = 0; j < P.keys.length; j++) {
      var e = P.keys[j];
      try {
        var kek = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b2a(e.s), iterations: P.n, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2a(e.i) }, kek, b2a(e.k));
        var ck = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2a(P.i) }, ck, b2a(P.c));
        return { html: new TextDecoder().decode(plain), idx: j };
      } catch (err) { /* 다음 코드 */ }
    }
    throw new Error('bad code');
  }

  function reveal() {
    // 페이지마다 공개 방식이 다르다(style.display / classList) — 양쪽 다 맞춘다
    var d = document.getElementById('deck'), g = document.getElementById('gate');
    if (d) { d.style.display = ''; d.classList.add('visible'); }
    if (g) { g.classList.add('hidden'); g.style.display = 'none'; }
  }

  window.ssUnlock = async function (code, onOk, onFail) {
    try {
      var r = await unlock((code || '').trim());
      document.getElementById('deck').innerHTML = r.html;
      window.ssCodeIdx = r.idx;        // 유입 경로 라벨용(어느 코드로 열었는지)
      reveal();
      try { sessionStorage.setItem('ss_pk', (code || '').trim()); } catch (e) {}
      if (onOk) onOk();
    } catch (e) { if (onFail) onFail(); }
  };

  // 게이트의 열람 버튼을 가로챈다. 원래 checkAccess는 평문 코드를 비교했다.
  window.addEventListener('DOMContentLoaded', function () {
    var err = document.getElementById('gate-error');
    window.checkAccess = function () {
      var el = document.getElementById('gate-password');
      var pw = el ? el.value : '';
      window.ssUnlock(pw, null, function () {
        if (err) { err.textContent = '액세스 코드가 올바르지 않습니다.'; err.style.display = 'block'; }
      });
    };
  });

  // 같은 탭에서는 다시 묻지 않는다(sessionStorage — 탭을 닫으면 사라진다)
  try {
    var saved = sessionStorage.getItem('ss_pk');
    if (saved) window.addEventListener('DOMContentLoaded', function () {
      window.ssUnlock(saved, null, function () { sessionStorage.removeItem('ss_pk'); });
    });
  } catch (e) {}
})();
</script>

</body>
</html>
