<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>순살 운영</title>
<style>
:root{
  --bg:#0E0C0B; --card:#171412; --card2:#1F1A17; --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.16);
  --tx:#F5F1EB; --tx2:#B8AFA6; --tx3:#7E756C;
  --or:#F07040; --or-soft:rgba(240,112,64,.13);
  --red:#E5484D; --amb:#F5A524; --grn:#2FA96B; --blu:#5B8DEF;
  --r:12px; --r2:18px;
  --f:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
  --m:'JetBrains Mono','SFMono-Regular',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:var(--f);
     font-size:15px;line-height:1.5;padding:0 0 64px;
     padding-top:env(safe-area-inset-top)}
.wrap{max-width:780px;margin:0 auto;padding:0 14px}

/* 잠금 */
/* ★ [hidden] 이 ID 선택자에 밀린다 (2026-08-13). `#lock{display:flex}` 가
   브라우저 기본 `[hidden]{display:none}` 을 이겨서, 잠금이 풀려도 화면이 그대로였다.
   복호화는 165ms 에 끝났는데 「여는 중…」 에서 멈춘 것처럼 보였다. */
[hidden]{display:none!important}
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:340px;text-align:center}
#lock h1{font-size:26px;font-weight:900;letter-spacing:-.6px;margin-bottom:6px}
#lock p{color:var(--tx3);font-size:13px;margin-bottom:22px;line-height:1.6}
input{width:100%;padding:15px 16px;border-radius:var(--r);border:1px solid var(--line2);
      background:var(--card);color:var(--tx);font-size:16px;font-family:var(--f)}
input:focus{outline:none;border-color:var(--or)}
button.go{width:100%;margin-top:10px;padding:15px;border:0;border-radius:var(--r);
      background:var(--or);color:#fff;font-size:16px;font-weight:800;font-family:var(--f)}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}

/* 헤더 */
header{position:sticky;top:0;z-index:9;background:rgba(14,12,11,.94);
       backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:9px;padding:13px 14px;max-width:780px;margin:0 auto}
.hd b{font-size:17px;font-weight:900;letter-spacing:-.4px}
.hd .when{margin-left:auto;color:var(--tx3);font-size:11px;font-family:var(--m)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--or);flex:none}

/* 탭 */
nav{display:flex;gap:6px;padding:10px 14px 2px;max-width:780px;margin:0 auto;
    overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--tx2);font-size:13px;font-weight:700;font-family:var(--f)}
nav button.on{background:var(--or);border-color:var(--or);color:#fff}
nav button .n{opacity:.7;margin-left:5px;font-family:var(--m);font-size:11px}

section{padding-top:14px}
h2{font-size:12px;font-weight:800;color:var(--tx3);letter-spacing:.8px;
   margin:22px 0 9px;text-transform:uppercase}
h2:first-child{margin-top:8px}

/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
      padding:14px;margin-bottom:9px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.tt{font-weight:800;font-size:15px;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--tx3);font-size:12px;margin-top:3px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:var(--m);font-size:11px}

/* 알람 */
.al{border-left:3px solid var(--line2);padding-left:12px}
.al.critical{border-left-color:var(--red);background:linear-gradient(90deg,rgba(229,72,77,.09),transparent 60%)}
.al.high{border-left-color:var(--amb)}
.al.medium{border-left-color:var(--blu)}
.al .k{font-size:11px;font-weight:800;letter-spacing:.3px;margin-bottom:4px}
.al.critical .k{color:var(--red)} .al.high .k{color:var(--amb)} .al.medium .k{color:var(--blu)}
.al .m{font-size:14px;line-height:1.5;word-break:keep-all}
.al .e{color:var(--tx3);font-size:11px;margin-top:6px;font-family:var(--m);
       word-break:break-all}

/* 배지 */
.b{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;
   font-size:11px;font-weight:800;background:var(--card2);color:var(--tx2);flex:none}
.b.or{background:var(--or-soft);color:var(--or)}
.b.g{background:rgba(47,169,107,.14);color:var(--grn)}
.b.r{background:rgba(229,72,77,.14);color:var(--red)}
.b.a{background:rgba(245,165,36,.14);color:var(--amb)}
.chs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
     padding:12px 10px;text-align:center}
.kpi .v{font-size:22px;font-weight:900;font-family:var(--m);letter-spacing:-1px}
.kpi .l{font-size:11px;color:var(--tx3);margin-top:2px}
.kpi.crit .v{color:var(--red)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--tx3);font-size:11px;font-weight:700;padding:6px 4px;
   border-bottom:1px solid var(--line)}
th:first-child{text-align:left}
td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;
   font-family:var(--m);font-size:12px}
td:first-child{text-align:left;font-family:var(--f);font-size:13px;font-weight:600;
   max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--tx3);font-size:12px;line-height:1.65;padding:2px 2px 6px;word-break:keep-all}
.empty{color:var(--tx3);font-size:13px;padding:20px 2px;text-align:center}
a{color:var(--or);text-decoration:none}
</style>
</head>
<body>
<div id="soonsal-live-ticker" style="display:none;"></div>
<style>
#soonsal-live-ticker{position:fixed;top:0;left:0;right:0;width:100%;background:#0a0a0a;border-bottom:1px solid #1a1a1a;overflow:hidden;z-index:99999;user-select:none;-webkit-user-select:none}
#soonsal-live-ticker::before,#soonsal-live-ticker::after{content:'';position:absolute;top:0;bottom:0;width:48px;z-index:2;pointer-events:none}
#soonsal-live-ticker::before{left:0;background:linear-gradient(to right,#0a0a0a,transparent)}
#soonsal-live-ticker::after{right:0;background:linear-gradient(to left,#0a0a0a,transparent)}
#soonsal-live-ticker .stk-track{display:flex;width:max-content;animation:stk-scroll 90s linear infinite;padding:8px 0}
#soonsal-live-ticker .stk-track:hover{animation-play-state:paused}
@keyframes stk-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
#soonsal-live-ticker .stk-item{display:inline-flex;align-items:center;gap:7px;padding:0 16px;border-right:1px solid #1a1a1a;white-space:nowrap;flex-shrink:0}
#soonsal-live-ticker .stk-lbl{font-family:'DM Sans',-apple-system,sans-serif;font-size:11px;font-weight:600;color:#555;letter-spacing:0.3px;text-transform:uppercase}
#soonsal-live-ticker .stk-lbl.crypto{color:#F07040}
#soonsal-live-ticker .stk-prc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#e0ddd8;letter-spacing:-0.3px}
#soonsal-live-ticker .stk-chg{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:3px}
#soonsal-live-ticker .stk-chg.up{color:#4ade80;background:rgba(74,222,128,0.08)}
#soonsal-live-ticker .stk-chg.down{color:#f87171;background:rgba(248,113,113,0.08)}
#soonsal-live-ticker .stk-chg.zero{color:#777}
#soonsal-live-ticker .au{display:inline-block;width:0;height:0;border-style:solid;border-width:0 3px 5px;border-color:transparent transparent #4ade80}
#soonsal-live-ticker .ad{display:inline-block;width:0;height:0;border-style:solid;border-width:5px 3px 0;border-color:#f87171 transparent transparent}
#soonsal-live-ticker .stk-div{display:inline-flex;align-items:center;padding:0 12px;flex-shrink:0}
#soonsal-live-ticker .stk-div span{width:3px;height:3px;border-radius:50%;background:#F07040}
#soonsal-live-ticker .stk-ts{display:inline-flex;align-items:center;gap:5px;padding:0 16px;flex-shrink:0}
#soonsal-live-ticker .stk-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:stk-pulse 2s ease-in-out infinite}
@keyframes stk-pulse{0%,100%{opacity:1}50%{opacity:0.3}}
#soonsal-live-ticker .stk-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;letter-spacing:0.5px}
#soonsal-live-ticker .stk-loading{display:flex;align-items:center;justify-content:center;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#555;gap:8px}
#soonsal-live-ticker .stk-spin{width:10px;height:10px;border:2px solid #222;border-top-color:#F07040;border-radius:50%;animation:stk-sp 0.8s linear infinite}
@keyframes stk-sp{to{transform:rotate(360deg)}}
.site-header{margin-top:34px}
@media(max-width:768px){#soonsal-live-ticker .stk-item{padding:0 12px}#soonsal-live-ticker .stk-lbl{font-size:10px}#soonsal-live-ticker .stk-prc{font-size:11px}#soonsal-live-ticker .stk-chg{font-size:10px}.site-header{margin-top:30px}}

  @media (max-width:768px) {
    .nav a { padding:12px 14px; font-size:12px; }
    .sub-btn-header { font-size:11px !important; padding:6px 12px !important; }
  }
  @media (max-width:480px) {
    .sub-btn-header { font-size:10px !important; padding:5px 10px !important; right:10px !important; }
  }
</style>
<script>
(function(){'use strict';var WORKER_URL='https://soonsal-data.kd-d0a.workers.dev/';var COINGECKO_URL='https://api.coingecko.com/api/v3';var TRADFI_ORDER=['S&P 500','NASDAQ','Dow Jones','KOSPI','US 10Y','WTI Oil','Gold','DXY','EUR/USD','USD/JPY','USD/KRW'];var CRYPTO_ORDER=['Bitcoin','Ethereum','Solana','XRP','BNB','Crypto Total'];var CRYPTO_IDS={'Bitcoin':'bitcoin','Ethereum':'ethereum','Solana':'solana','XRP':'ripple','BNB':'binancecoin'};var REFRESH=60000;var container,timer,lastTradfi,lastCrypto;function init(){container=document.getElementById('soonsal-live-ticker');if(!container)return;container.style.display='block';container.innerHTML='<div class="stk-loading"><div class="stk-spin"></div>Loading market data...</div>';fetchAll();timer=setInterval(fetchAll,REFRESH)}function fetchAll(){var p1=fetchTradFi();var p2=fetchCrypto();Promise.allSettled?Promise.allSettled([p1,p2]).then(render):Promise.all([p1.catch(function(){return null}),p2.catch(function(){return null})]).then(render)}function fetchTradFi(){return fetch(WORKER_URL).then(function(r){return r.json()}).then(function(data){if(data.tradfi)lastTradfi=data;return data}).catch(function(e){console.warn('[Ticker] TradFi error:',e.message);return null})}function fetchCrypto(){var ids=Object.values(CRYPTO_IDS).join(',');var url=COINGECKO_URL+'/simple/price?ids='+ids+'&vs_currencies=usd&include_24hr_change=true&include_market_cap=true';var globalUrl=COINGECKO_URL+'/global';return Promise.all([fetch(url).then(function(r){return r.json()}),fetch(globalUrl).then(function(r){return r.json()}).catch(function(){return null})]).then(function(results){var prices=results[0];var global=results[1];var crypto={};for(var name in CRYPTO_IDS){var id=CRYPTO_IDS[name];var d=prices[id];if(!d)continue;var p=d.usd;var ch=d.usd_24h_change||0;crypto[name]={price:'$'+formatNum(p),change:(ch>=0?'+':'')+ch.toFixed(2)+'%',direction:ch>0.01?'up':ch<-0.01?'down':'zero'}}if(global&&global.data){var mc=global.data.total_market_cap&&global.data.total_market_cap.usd;var mch=global.data.market_cap_change_percentage_24h_usd;if(mc){crypto['Crypto Total']={price:'$'+(mc/1e12).toFixed(2)+'T',change:(mch>=0?'+':'')+(mch||0).toFixed(2)+'%',direction:mch>0?'up':mch<0?'down':'zero'}}}lastCrypto=crypto;return crypto}).catch(function(e){console.warn('[Ticker] Crypto error:',e.message);return null})}function render(){var tradfi=lastTradfi?lastTradfi.tradfi:{};var crypto=lastCrypto||{};var kst=lastTradfi?lastTradfi.kst:new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});var html=[];html.push('<div class="stk-ts"><span class="stk-dot"></span><span class="stk-time">'+esc(kst)+' KST</span></div>');for(var i=0;i<TRADFI_ORDER.length;i++){var name=TRADFI_ORDER[i];var d=tradfi[name];if(d)html.push(makeItem(name,d,false))}html.push('<div class="stk-div"><span></span></div>');for(var j=0;j<CRYPTO_ORDER.length;j++){var cname=CRYPTO_ORDER[j];var cd=crypto[cname];if(cd)html.push(makeItem(cname,cd,true))}var track=html.join('');container.innerHTML='<div class="stk-track">'+track+track+'</div>'}function makeItem(name,d,isCrypto){var dir=d.direction||'zero';var arrow=dir==='up'?'<span class="au"></span>':dir==='down'?'<span class="ad"></span>':'';return'<div class="stk-item"><span class="stk-lbl'+(isCrypto?' crypto':'')+'">'+esc(name)+'</span><span class="stk-prc">'+esc(d.price)+'</span><span class="stk-chg '+dir+'">'+arrow+' '+esc(d.change)+'</span></div>'}function formatNum(n){if(n>=10000)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=100)return n.toFixed(2);if(n>=1)return n.toFixed(2);return n.toFixed(4)}function esc(s){if(!s)return'';var d=document.createElement('span');d.textContent=String(s);return d.innerHTML}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}})();
</script>

<div id="lock">
  <div class="box">
    <h1>순살 운영</h1>
    <p>암호를 넣으면 이 브라우저에 기억합니다.<br>암호 없이는 아무것도 안 보입니다.</p>
    <input id="pw" type="password" placeholder="암호" autocomplete="current-password">
    <button class="go" onclick="unlock()">열기</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="hd">
      <span class="dot"></span><b>순살 운영</b>
      <span class="when" id="when"></span>
    </div>
    <nav id="tabs"></nav>
  </header>
  <div class="wrap"><div id="view"></div></div>
</div>

<script>
const $=(s)=>document.querySelector(s);
const KEY='soonsal_ops_key';
let DATA=null, TAB='알람';

async function decrypt(blob, pass){
  const b=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b(blob.salt),iterations:blob.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(blob.nonce)},k,b(blob.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function boot(pass){
  const blob=await (await fetch('data.json',{cache:'no-store'})).json();
  DATA=await decrypt(blob,pass);
  localStorage.setItem(KEY,pass);
  $('#lock').hidden=true; $('#app').hidden=false;
  $('#when').textContent=DATA.meta.generated_at.replace('T',' ').slice(5,16)+' 기준';
  render();
}
async function unlock(){
  const p=$('#pw').value.trim(); if(!p) return;
  $('#err').textContent='여는 중…';
  try{ await boot(p); }catch(e){ $('#err').textContent='암호가 틀렸습니다'; }
}
$('#pw')?.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

const STATUS={published:'발행됨',scheduled:'예약됨',review_ready:'검수 통과',
  review_stale:'관문 무효',in_production:'제작 중',gated:'착수 승인',
  planning:'기획',ambiguous:'확인 필요'};
const CH={ig_carousel:'IG 캐러셀',ig_reel:'IG 릴스',yt_shorts:'YT 숏츠',threads:'쓰레드',web:'웹'};
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(n)=>n==null?'—':n.toLocaleString('ko-KR');
function when(ep){ if(!ep) return ''; const d=new Date(ep*1000);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function tabs(){
  const a=DATA.alerts.length, s=DATA.meta.counts;
  const defs=[['알람',a],['예약',s.scheduled||0],['제작',(s.in_production||0)+(s.review_ready||0)+(s.review_stale||0)],
              ['발행',s.published||0],['성과',null],['인프라',null]];
  $('#tabs').innerHTML=defs.map(([n,c])=>
    `<button class="${n===TAB?'on':''}" onclick="TAB='${n}';render()">${n}${c!=null?`<span class="n">${c}</span>`:''}</button>`).join('');
}

function itemCard(it){
  const ch=Object.entries(it.channels||{}).filter(([,v])=>v).map(([k])=>`<span class="b">${CH[k]||k}</span>`).join('');
  const rv=it.review;
  const rb=rv?(rv.verdict==='approve'?'<span class="b g">검수 승인</span>'
      :rv.verdict==='hold'?'<span class="b a">보류</span>':'<span class="b r">반려</span>')
      :'<span class="b r">검수 없음</span>';
  const gate=it.gate||{};
  const gb=gate.preflight?(gate.digest_ok===false?'<span class="b r">관문 무효</span>':'<span class="b g">관문 통과</span>')
      :'<span class="b">관문 전</span>';
  return `<div class="card">
    <div class="row"><div class="grow">
      <div class="tt">${esc(it.slug)}</div>
      <div class="sub">${STATUS[it.status]||it.status}${it.date?' · '+it.date:''}${it.target_epoch?' · '+when(it.target_epoch):''}</div>
    </div><span class="b or">${it.kind==='cardnews'?'카드뉴스':it.kind==='single_video'?'영상':it.kind}</span></div>
    <div class="chs">${ch}${rb}${gb}</div>
    ${it.dir?`<div class="sub mono" style="margin-top:8px">~/${esc(it.dir)}</div>`:
      '<div class="sub" style="margin-top:8px;color:var(--amb)">폴더 미상</div>'}
  </div>`;
}

function render(){
  tabs();
  const v=$('#view'); const D=DATA;
  if(TAB==='알람'){
    const c=D.alerts.filter(a=>a.severity==='critical').length;
    v.innerHTML=`<div class="kpis" style="margin-top:12px">
      <div class="kpi ${c?'crit':''}"><div class="v">${c}</div><div class="l">즉시 확인</div></div>
      <div class="kpi"><div class="v">${D.alerts.length}</div><div class="l">전체 알람</div></div>
      <div class="kpi"><div class="v">${D.meta.counts.scheduled||0}</div><div class="l">예약</div></div>
      <div class="kpi"><div class="v">${D.meta.counts.published||0}</div><div class="l">발행</div></div>
    </div><h2>알람</h2>`+
    (D.alerts.length?D.alerts.map(a=>`<div class="card al ${a.severity}">
        <div class="k">${esc(a.kind)}</div><div class="m">${esc(a.message)}</div>
        ${a.evidence?`<div class="e">${esc(a.evidence)}</div>`:''}</div>`).join('')
      :'<div class="empty">막힌 데 없습니다</div>');
  }
  else if(TAB==='성과'){
    const p=D.performance||{}, t=p.tracks||{};
    const blk=(name,label,rows)=>{
      const s=t[name]; if(!s) return '';
      const st=s.reach||s.views; const n=s.n||0;
      if(!s.ranked) return `<h2>${label}</h2><div class="card"><div class="note">
        표본 ${n}건 — <b>기준선을 내지 않습니다.</b> 적은 표본으로 만든 평균은 오해를 부릅니다.</div></div>`;
      return `<h2>${label} <span class="mono">n=${n}</span></h2>
        <div class="kpis"><div class="kpi"><div class="v">${num(st?.median)}</div><div class="l">중앙값</div></div>
        <div class="kpi"><div class="v">${num(st?.max)}</div><div class="l">최고</div></div>
        <div class="kpi"><div class="v">${num(st?.mean)}</div><div class="l">평균</div></div></div>`;
    };
    let h=blk('ig_carousel','IG 캐러셀 도달')+blk('ig_reel','IG 릴스 도달')+blk('yt_shorts','YT 숏츠 조회');
    const yr=(t.yt_shorts||{}).rows||[];
    if(yr.length) h+=`<h2>유튜브 숏츠</h2><div class="card"><table>
      <tr><th>편</th><th>조회</th><th>좋아요</th><th>경과</th></tr>
      ${yr.slice(0,12).map(r=>`<tr><td>${esc(r.title||r.slug)}</td><td>${num(r.views)}</td>
        <td>${num(r.likes)}</td><td>${r.hours_since?Math.round(r.hours_since)+'h':'—'}</td></tr>`).join('')}
      </table></div>`;
    if((p.absent||[]).length) h+=`<h2>없는 지표</h2><div class="card"><div class="note">
      ${p.absent.map(x=>'· '+esc(x)).join('<br>')}<br><br>
      빈칸으로 두면 0 으로 읽히므로 <b>없다고 적습니다.</b></div></div>`;
    v.innerHTML=h||'<div class="empty">성과 데이터 없음</div>';
  }
  else if(TAB==='인프라'){
    const c=D.meta.cron||{};
    const ok=c.ok===true;
    v.innerHTML=`<h2>클라우드 발행 크론</h2><div class="card">
      <div class="row"><div class="grow"><div class="tt">${ok?'정상':c.ok===false?'멈춤':'확인 불가'}</div>
      <div class="sub">마지막 실행 ${c.gap_h!=null?c.gap_h+'시간 전':'—'} · 예정 주기 15분</div></div>
      <span class="b ${ok?'g':'r'}">${c.gap_h!=null?c.gap_h+'h':'?'}</span></div>
      ${c.fails?`<div class="sub" style="margin-top:8px;color:var(--amb)">최근 5회 중 ${c.fails}회 실패</div>`:''}
    </div>
    <h2>데이터 신선도</h2><div class="card"><table>
    ${Object.entries(D.meta.sources||{}).map(([k,v2])=>{
      const h=(Date.now()/1000-v2)/3600;
      return `<tr><td>${esc(k.split('/').pop())}</td><td style="color:${h>30?'var(--amb)':'var(--tx2)'}">${h<1?'방금':Math.round(h)+'시간 전'}</td></tr>`;
    }).join('')}</table></div>
    <h2>상태별 건수</h2><div class="card"><table>
    ${Object.entries(D.meta.counts).map(([k,v2])=>`<tr><td>${STATUS[k]||k}</td><td>${v2}</td></tr>`).join('')}
    </table></div>`;
  }
  else{
    const want=TAB==='예약'?['scheduled']:TAB==='발행'?['published']
      :['in_production','review_ready','review_stale','gated','ambiguous'];
    let its=D.items.filter(i=>want.includes(i.status));
    if(TAB==='예약') its.sort((a,b)=>(a.target_epoch||0)-(b.target_epoch||0));
    else its.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const groups={};
    its.forEach(i=>{(groups[i.status]=groups[i.status]||[]).push(i)});
    v.innerHTML=Object.entries(groups).map(([s,arr])=>
      `<h2>${STATUS[s]||s} <span class="mono">${arr.length}</span></h2>`+
      arr.slice(0,60).map(itemCard).join('')+
      (arr.length>60?`<div class="note">외 ${arr.length-60}건</div>`:'')
    ).join('')||'<div class="empty">해당 없음</div>';
  }
}

(async()=>{ const s=localStorage.getItem(KEY);
  if(s){ try{ await boot(s); }catch(e){ localStorage.removeItem(KEY); } } })();
</script>
</body>
</html>
