<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;
font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:20px 0 96px}
.hd{padding:0 16px 0}
.hd .sec-head{margin-bottom:20px}   /* 설명과 안내 사이 42px → 20px (KD 2026-10-09 검수) */
h1{font-size:1.44rem;font-weight:800;margin:0 0 5px;letter-spacing:-.025em;color:#f2efe8}
.sub{color:#8b8578;font-size:.86rem;margin:0;line-height:1.6}
.live{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:#8b8578;
background:#161616;border:1px solid #262626;border-radius:20px;padding:3px 9px;margin-left:6px}
.live b{width:6px;height:6px;border-radius:50%;background:#4ea87a;display:inline-block;
animation:bp 2.4s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}

/* 스레드 = 카드가 아니라 '줄'. 트위터처럼 경계선만으로 나눈다 —
   모바일에서 카드마다 테두리가 있으면 화면이 조각조각 나 보인다. */
.th{border-top:1px solid #1c1c1c;padding:15px 16px 7px;transition:background .5s}
.th.new{background:#17130f}
/* 원글이 무슨 이야기였는지가 스레드 머리에 있어야 댓글이 대화로 읽힌다.
   한 줄짜리 회색 링크로는 아무도 안 누르고, 문맥도 안 준다.
   다만 카드가 너무 세면 대화가 아니라 기사 목록처럼 보인다 — 배경을 한 톤만
   올리고 왼쪽에 선을 둬서 '인용된 원글'로 읽히게 한다. */
.src{display:block;text-decoration:none;background:#141414;border:1px solid #1f1f1f;
border-left:2px solid #E55A00;border-radius:8px;padding:10px 13px;margin-bottom:10px}
.src:hover{background:#181818;border-color:#2a2a2a;border-left-color:#F07040}
.src .lb{display:block;font-size:.62rem;font-weight:800;letter-spacing:.07em;
color:#8a6f5c;margin-bottom:4px}
.src .ti{display:block;font-size:.88rem;font-weight:700;letter-spacing:-.02em;
color:#d8d3ca;line-height:1.4}
.src:hover .ti{color:#fff}
/* 두 줄까지만. 더 길면 카드가 대화보다 커진다 */
.src .ld{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
font-size:.78rem;line-height:1.55;color:#7a756c;margin-top:5px}
.src:hover .ld{color:#8f8a80}
.src .mt{display:block;font-size:.68rem;color:#5a554d;margin-top:6px}
.src:hover .mt{color:#E55A00}


/* 코멘트 한 줄 — 아바타 + 본문. 인스타·링크드인 공통 문법이다. */
.c{display:flex;gap:10px;padding:5px 0}
.c.rep{padding-left:30px;position:relative}
.c.rep:before{content:"";position:absolute;left:15px;top:0;bottom:0;width:1.5px;background:#232323}
.av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:.78rem;font-weight:800;color:#111;letter-spacing:-.02em}
.c.rep .av{width:26px;height:26px;font-size:.68rem}
.bd{flex:1;min-width:0}
.nm{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.3}
/* 인스타식 댓글 (KD 10/26) — 이름+본문 한 문단, 아래 행동 줄, 하트 오른쪽 */
.tx .nmx{margin-right:4px}.tx .nmx .k{font-weight:800;color:#f0ede6;font-size:.9rem}
.tx .nmx button.k{background:none;border:0;padding:0;min-height:0;height:auto;line-height:inherit;font:inherit;font-weight:800;color:#f0ede6;cursor:pointer;
text-decoration:underline dotted #5a524a;text-underline-offset:3px}
.tx .ob,.tx .g{vertical-align:middle;margin-right:4px}
.c > .like{flex:0 0 auto;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:1px;width:30px;margin-top:2px;background:none;border:0;
padding:0;min-height:0;font:600 15px/1 Pretendard,-apple-system,sans-serif;color:#6b665e;cursor:pointer}
.c > .like span{font-size:10.5px;font-variant-numeric:tabular-nums}
.c > .like.on{color:#E55A00}
.morec,.morer{display:block;background:none;border:0;padding:4px 0;min-height:0;color:#8b8578;font:600 12.5px Pretendard,-apple-system,sans-serif;cursor:pointer;text-align:left}
.morec{margin:2px 16px 0}.morer{padding-left:36px;font-size:12px}.morec:hover,.morer:hover{color:#F59B75}
/* 참전 막대 — 오늘의 질문 .cbar 와 같은 모양 */
.th.say .cbar{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0 2px;padding:6px 6px 6px 8px;border:1px solid #2e2620;border-radius:999px;
background:#111;cursor:text;text-align:left;font:500 14px Pretendard,-apple-system,sans-serif;color:#8b8578;min-height:0}
.th.say .cbar .av{width:28px;height:28px;font-size:.7rem}
.th.say .cbar .ph{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th.say .cbar b{flex:0 0 auto;display:flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;background:#2a2420;color:#F59B75;font-weight:800;font-size:13px}
.th.say .cbar:hover{border-color:#5a3524}.th.say .cbar:hover b{background:#F07040;color:#12100e}
.rf .rav .av{width:28px;height:28px;font-size:.7rem;margin-top:5px}
.th.say .rf{padding-left:0}
.nm .k{font-weight:700;color:#f0ede6;font-size:.87rem}
.nm .g{font-size:.65rem;color:#8b8578;background:#1e1e1e;border-radius:4px;padding:1px 6px}
.nm .t{font-size:.7rem;color:#4a453d}
.tx{color:#ccc6bb;font-size:.93rem;line-height:1.62;margin-top:3px;word-break:break-word}
/* 멘션은 '누구에게 하는 말인가'지 강조가 아니다. 주황은 행동(답글·원문 보기)에
   쓰는 색이라 여기 쓰면 본문보다 태그가 먼저 읽힌다. 한 톤 낮추고 굵기만 준다. */
.tx .at{color:#8f8578;font-weight:600}
.c.op .nm .k{color:#F5A481}
.mb{font-size:.62rem;font-weight:700;color:#F5A481;border:1px solid #5a3524;border-radius:999px;padding:0 6px}
.tkme{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 16px 24px;padding:12px 14px;border:1px solid #3a2a20;
background:#1a1512;border-radius:12px;font-size:.84rem;color:#cfc8bb;text-decoration:none;line-height:1.5}
.tkme b{color:#F5A481;white-space:nowrap}.tkme em{font-style:normal;background:#F07040;color:#12100e;border-radius:9px;padding:0 7px;font-weight:800;font-size:.75rem}
.ob{font-size:.62rem;font-weight:700;color:#fff;background:#C24A00;border-radius:999px;padding:1px 6px}
.ob.bot{background:#5a6b7a}

/* 액션 — 아이콘 + 숫자, 탭 영역을 넉넉히 */
.act{display:flex;align-items:center;gap:10px;margin:4px 0 0}
.act .t{font-size:.7rem;color:#5a554d}
.act button{display:flex;align-items:center;gap:5px;background:none;border:none;
padding:7px 8px;font-size:.76rem;color:#6b665e;cursor:pointer;font-family:inherit;
border-radius:16px;transition:background .15s,color .15s;min-height:32px}
.act button:hover{background:#1c1c1c;color:#b8b2a8}
/* 답글 = 참여 행동 — 오늘의 질문과 같은 주황 알약(KD 10/26 「답글 버튼이 좀 더 눈에 띄어야」) */
.act button.repb{background:rgba(240,112,64,.12);color:#F59B75;font-weight:800;border-radius:999px;padding:0 10px;min-height:24px;height:24px}
.act button.repb:hover{background:#F07040;color:#12100e}
.act .like:hover{color:#E55A00}
.act .like.on{color:#E55A00;font-weight:700}
.act .like.on:hover{background:#1f1613}

/* 답글 입력 — 아바타 옆에 붙여 대화가 이어지는 느낌 */
.rf{display:none;gap:10px;padding:9px 0 12px 30px}
.rf.on{display:flex}
.rf .bx{flex:1;min-width:0}
.rf textarea{width:100%;border:1px solid #2a2a2a;border-radius:16px;padding:10px 14px;
font-size:16px;font-family:inherit;resize:none;background:#181818;color:#eee;line-height:1.5}
.rf textarea:focus{outline:none;border-color:#F07040;background:#1c1a18}
.rf .row{display:flex;align-items:center;gap:8px;margin-top:8px}
.rf .who{flex:1;font-size:.74rem;color:#8b8578;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px}
.rf .who em{font-style:normal;color:#F07040;font-size:.68rem;background:#1f1713;
border-radius:5px;padding:2px 7px;flex:0 0 auto}
.rf .who:hover em{background:#2a1d16}
.rf button.go{background:#E55A00;color:#fff;border:none;border-radius:18px;padding:8px 18px;
font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;min-height:34px}
.rf button.go:disabled{background:#242424;color:#5f5a52}
.rf button.x{background:none;border:none;color:#6b665e;font-size:.76rem;cursor:pointer;
font-family:inherit;padding:8px 4px}

.empty{color:#7a756c;text-align:center;padding:56px 20px;line-height:1.75;font-size:.9rem}
.empty b{display:block;color:#f0ede6;font-size:1.14rem;margin-bottom:10px;letter-spacing:-.02em}
.empty .ecta{display:inline-block;margin-top:20px;background:#E55A00;color:#fff;
text-decoration:none;font-weight:700;font-size:.87rem;border-radius:22px;padding:13px 24px}
.empty .ecta:hover{background:#F07040}

/* 브리핑으로 돌아가는 길만 작게 남긴다. 내용보다 커 보이지 않게 함 */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50}
.fab a{display:inline-flex;align-items:center;gap:8px;background:#211d1a;border:0;
border-radius:999px;padding:10px 14px;color:#b7afa5;font-size:.8rem;font-weight:700;
text-decoration:none;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.fab a:hover{background:#29231f;color:#f4eee7}
.fab .arrow{color:#F07040;font-size:1rem;line-height:1}
@media(min-width:620px){.wrap{padding-bottom:80px}}

/* ── 고도화 (KD 2026-10-23) ── 맨 위: 참여 현황 · 오늘의 질문 · 🔥 뜨거운 이야기 · 필터 */
.hd .sec-head{margin-bottom:10px}
.pulse{margin:0 16px 14px;font-size:13px;color:#a39c90}
.pulse b{color:#f6f1e8;font-variant-numeric:tabular-nums}
.tq{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:0 16px 14px;padding:13px 15px;border-radius:14px;
text-decoration:none;background:linear-gradient(135deg,#2a1a12,#1a1411);border:1px solid #5a3524}
.tq[hidden]{display:none}
.tq .k{grid-column:1;font-size:11px;font-weight:800;color:#F59B75;letter-spacing:.04em}
.tq .tqq{grid-column:1;font-size:15px;font-weight:800;color:#fff;line-height:1.4;letter-spacing:-.02em;word-break:keep-all}
.tq .go{grid-column:2;grid-row:1/3;font-size:13px;font-weight:800;color:#12100e;background:#F07040;border-radius:999px;padding:8px 12px;white-space:nowrap}
.hot{display:flex;gap:6px;margin:0 0 12px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.hot[hidden]{display:none}.hot::-webkit-scrollbar{display:none}
.hot .hk{flex:0 0 auto;align-self:center;font-size:12px;font-weight:800;color:#bdb6aa;margin-right:2px}
.hot a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;max-width:220px;height:32px;padding:0 12px;border-radius:999px;
background:#1b1715;border:1px solid #2e2620;color:#e8e3da;font-size:12.5px;font-weight:700;text-decoration:none;overflow:hidden;white-space:nowrap}
.hot a b{color:#F59B75;font-variant-numeric:tabular-nums}
.flt{display:flex;gap:6px;margin:0 16px 8px}
.flt button{height:32px;padding:0 13px;border-radius:999px;border:1px solid #2e2924;background:transparent;color:#bdb6aa;
font:700 12.5px Pretendard,-apple-system,sans-serif;cursor:pointer}
.flt button.on{background:#F07040;border-color:#F07040;color:#12100e}
.tkme{display:block;margin:0 16px 18px;padding:0;border:0;background:none;font-size:12.5px;color:#8b8578}
.tkme b{color:#F59B75}

/* ── 역할별 모양 (KD 10/24 「워딩이 너무 폭력적으로 많음 — 참여·읽을 내용·안내문·댓글 구분이 안 감」) ──
   읽을 원글 = 작고 흐린 인용(왼쪽 선) · 댓글 = 아바타 + 흰 본문 · 참여 = 주황 테두리 작은 버튼/입력 · 안내 = 맨 아래 작은 글자 */
.hd .sec-head .deck{display:none}
.hd .sec-head{margin-bottom:14px}
.tkme{text-align:center;margin:28px 16px 0!important;font-size:12px!important;color:#6f695f!important}
/* 회원 이름 = 지난 글 보기 버튼 (밑줄 점선으로 누를 수 있음을 표시) */
.nm .ku{background:none;border:0;padding:0;min-height:0;height:auto;line-height:inherit;font:inherit;font-weight:700;color:#f0ede6;font-size:14px;cursor:pointer;
text-decoration:underline dotted #5a524a;text-underline-offset:3px}
.nm .ku:hover{color:#F59B75}
/* 스토리 묶음 — 원글 머리는 한 번, 아래로 대화 */
.sg{border-top:6px solid #0c0c0c;padding:16px 0 6px;scroll-margin-top:80px}
.sg.flash{animation:sgf 1.6s ease}
@keyframes sgf{0%,40%{background:#1a1411}100%{background:transparent}}
.sg .src{margin:0 16px 4px;background:none;border:0;border-left:3px solid #E55A00;border-radius:0;padding:2px 0 2px 12px}
.sg .src:hover{background:none}
.sg .src{border-left-color:#4a3428!important}
.sg .src .lb{font-size:10.5px;color:#7c756c;letter-spacing:.04em;margin-bottom:2px}
.sg .src .ti{font-size:14px;font-weight:700;color:#a39c90;line-height:1.45}
.sg .src:hover .ti{color:#e8e3da}
.sg .src .ld{-webkit-line-clamp:1;font-size:12.5px;color:#7c756c;margin-top:3px}
.sg .th{border-top:0;padding:10px 16px 2px}
.th.new{background:#17130f}
/* 읽기 편하게 — 본문 크게, 줄 간격 넓게 */
.tx{font-size:15.5px;line-height:1.7;color:#ddd7cc}
.nm .k{font-size:14px}
.nm .t{color:#6f695f}
.nw{font-size:10px;font-weight:900;color:#12100e;background:#F07040;border-radius:4px;padding:1px 5px;letter-spacing:.04em}
/* 「순살이 묻다」 — 봇 글을 대화를 여는 질문 카드로 */
.q{padding:12px 14px;border-radius:14px;background:#161412;border:1px dashed #3a2f27}
.q{border-style:solid!important;border-color:#2a2622!important;background:#141210!important}
.q .qk{font-size:10.5px;font-weight:800;color:#7f93a5;letter-spacing:.04em}
.q p{margin:5px 0 10px;font-size:15.5px;font-weight:700;color:#f0ece4;line-height:1.55;word-break:keep-all}
.q .qa{display:flex;align-items:center;justify-content:space-between;gap:10px}
.q .qa span{font-size:12px;color:#8b8578}
.q .qb{height:32px;padding:0 14px;border-radius:999px;border:1px solid #F07040;background:transparent;color:#F59B75;font:800 12.5px Pretendard,sans-serif;cursor:pointer}
.q .qb:hover{background:#F07040;color:#12100e}
/* 이 이야기에 한마디 — 평소엔 입력칸처럼 보이는 한 줄 */
.th.say{padding:8px 16px 12px}
/* 기존(10/24): 흐린 글자 「＋ 한마디」 → 최신(10/26): 입력창 모양 참전 막대(.cbar, 위 인스타식 댓글 CSS 쪽) */
@media (prefers-reduced-motion:reduce){.sg.flash{animation:none}}
</style><style id="soonsal-nav-visibility-v3">
.nav-menu a.nav-mobile-only{display:none}
.nav>a.nav-desktop-link.biz{color:#F07040}
.nav>a.nav-desktop-link.biz:hover{color:#ff8a52}
.nav-menu a.biz{color:#F07040}
@media(max-width:560px){
  .nav>a.nav-desktop-link{display:none}
  .nav-menu a.nav-mobile-only{display:block}
  .nav-more.mobile-active>summary{color:#F07040;border-bottom-color:#F07040}
  /* 코어 4개 + 더보기 = 5칸. 예전 CSS가 4칸이라 다섯 번째가 다음 줄로 넘어갔다.
     이 블록은 페이지마다 나중에 주입되므로 안에 박힌 옛 규칙을 덮는다. */
  .nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%}
  .nav>a,.nav-more>summary{justify-content:center;padding:11px 2px;font-size:11.5px;
    letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(max-width:360px){
  .nav>a,.nav-more>summary{font-size:10.5px;letter-spacing:-.5px;padding:11px 1px}
}
/* ── 눌러보고 싶게 ──────────────────────────────────────
   탭은 '지금 어디' 말고는 아무것도 알려주지 않는다. 더보기는 특히 그렇다 —
   안에 뭐가 있는지 모르면 누를 이유가 없다. 세 가지를 바꾼다:
   (1) 밑줄이 자라며 눌리는 느낌, (2) 화살표가 열림에 반응, (3) 메뉴 안에
   아이콘을 붙여 목록이 아니라 '갈 곳'으로 보이게. */
.nav>a,.nav-more>summary{position:relative;transition:color .18s}

function apiFetch(path, opt) {
  var i = 0;
  function attempt() {
    var host = HOSTS[i];
    return fetch(host.replace(/[/]$/, '') + path, opt).then(function (r) {
      API = host;
      try { localStorage.setItem('ss_host', host); } catch (e) {}
      return r;
    }).catch(function (err) {
      i += 1;
      if (i < HOSTS.length) { return attempt(); }
      throw err;
    });
  }

}
var app = document.getElementById('app');

try { liked = JSON.parse(localStorage.getItem('ss_liked') || '{}'); } catch (e) {}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function ago(ts) {
  var s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분';
  if (s < 86400) return Math.floor(s / 3600) + '시간';
  return Math.floor(s / 86400) + '일';
}
function vid() {
  try {
    var v = localStorage.getItem('ss_vid');
    if (!v || !/^[a-z0-9-]{8,32}$/.test(v)) {
      v = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).slice(0, 16);
      localStorage.setItem('ss_vid', v);
    }
    return v;
  } catch (e) { return null; }
}
// 이름에서 색을 뽑아 아바타를 만든다. 이미지 없이도 누가 누군지 구분된다.
var AVC = ['#F0A070','#8FB0A0','#A09CD8','#D89AA8','#C8B060','#7FA8C8','#B8A090','#98B87F'];
function avatar(nick, isOp) {
  var h = 0, s = String(nick || '?');
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  // 「순살 치킨집」 봇 캐릭터는 캐릭터 이모지·색 (KD 2026-10-24) — 정의는 ss-header.js window.ssCrew
  var cr = isOp === 2 && window.ssCrew && window.ssCrew[s];
  if (cr) return '<span class="av" style="background:' + cr.c + '">' + cr.e + '</span>';
  var bg = isOp === 2 ? '#5a6b7a' : isOp ? '#E55A00' : AVC[h % AVC.length];
  var ch = s.replace(/[^가-힣A-Za-z0-9]/g, '').charAt(0) || '?';
  return '<span class="av" style="background:' + bg + (isOp ? ';color:#fff' : '') + '">' +
    esc(ch) + '</span>';
}

// 로그인한 사람은 계정 이름으로 쓴다 — 서버(POST /comment)도 계정 별명으로 맞춘다 (KD 2026-10-24 「자기 아이디로」)
var ME = null;
try { if (localStorage.getItem('ss_auth') === '1') fetch('https://api.soonsal.com/me', { credentials: 'include' })
  .then(function (r) { return r.json(); }).then(function (j) { ME = j && j.user; }).catch(function () {}); } catch (e) {}
function whoLabel() {
  if (ME && ME.nick) return '✓ ' + esc(ME.nick) + '<em>내 계정 이름</em>';
  // 로그인했는데 계정 별명이 비었으면 — 실명 대신 별명을 정하게 (KD 10/25 「로그인했는데 자동 생성 별명이 뜸」)
  if (ME) return '✓ 회원 별명 정하기<em>✎</em>';
  var n = prof().n || '';
  return (n ? esc(n) : '이름 없음') + '<em>✎ 바꾸기</em>';
}

function prof() {
  try { return JSON.parse(localStorage.getItem('ss_prof') || 'null') || {}; } catch (e) { return {}; }
}

// 회원 별명 정하기 — 계정에 저장(POST /me/nick)돼 어느 기기에서 써도 같은 이름. 끝나면(취소 포함) done() (KD 10/25)
function setNick(done) {
  var v = prompt('회원 별명을 정해요 (2~16자) — 어느 기기에서 남겨도 이 이름으로 보여요', prof().n || '');
  if (v === null || !v.trim()) { if (done) done(); return; }
  fetch('https://api.soonsal.com/me/nick', { method: 'POST', credentials: 'include',
    headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nick: v.trim() }) })
    .then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) {
        ME.nick = j.nick;
        app.querySelectorAll('.who').forEach(function (x) { if (x.textContent) x.innerHTML = whoLabel(); });
      } else alert('2~16자 한글·영문·숫자로, 운영자·봇으로 오해될 이름은 빼고 지어 주세요');
      if (done) done();
    }).catch(function () { if (done) done(); });
}
var nickAsked = false;

// 스토리 제목 — 없는 회차면 경로만 보여준다
function label(story) {
  var m = SMAP[story];
  return m ? m.t : story;
}
function href(story) {
  var m = SMAP[story], x = /^(\d{4})(c?)-(\d+)$/.exec(story);
  if (!m || !x) return '#';
  return '/newsletters/' + m.y + '/' + x[1] + (x[2] ? '-crypto' : '') +
         '.html#story-' + x[3];
}
// 0812-3 → 08.12. 날짜를 따로 심지 않는다.
function sdate(story) {
  var x = /^(\d{2})(\d{2})c?-/.exec(story);
  return x ? x[1] + '.' + x[2] : '';
}
function slabel(story) {
  var m = SMAP[story];
  return m && m.l ? m.l : '';
}
function slead(story) {
  var m = SMAP[story];
  return m && m.s ? m.s : '';
}

// ── 고도화 (KD 2026-10-23 「순살톡 화면도 더 가독성 좋고 더 참여를 불러올 수 있는 형태로 — 우리가 아는 기법 최대한」) ──
//   기존: 스레드마다 원글 머리(같은 스토리면 같은 머리가 여러 번), 봇 질문도 댓글처럼, 이 페이지에선 새 글을 못 씀.
//   최신: 스토리별로 한 번 묶고(최근 활동 순) · 봇 글은 「순살이 묻다」 질문 카드 + 답하기 · 스토리마다 「이 이야기에 한마디」 ·
//   맨 위 참여 현황·오늘의 질문·🔥 뜨거운 이야기 · 필터(최신/인기/답 기다리는 질문) · 하루 안 글 NEW.
var ITEMS = [], FILT = 'new', OPENALL = {}, EXP = {};   // 스토리 「모두 보기」·스레드 「이전 답글」 펼침
// ss-header.js(defer)가 늦게 실리면 봇 캐릭터 모양(window.ssCrew)이 첫 그림에 빠진다 — 실린 뒤 한 번 더 그림
document.addEventListener('DOMContentLoaded', function () { if (window.ssCrew && ITEMS.length) render(ITEMS); });
function isBot(c) { return c.op === 2; }
function groups(items) {
  var order = [], roots = {}, byStory = {}, sOrder = [];
  NICK = {};
  items.forEach(function (c) {
    NICK[c.id] = c.nick;
    if (!roots[c.root_id]) { roots[c.root_id] = []; order.push(c.root_id); }
    roots[c.root_id].push(c);
  });
  order.forEach(function (rid) {
    var list = roots[rid], st = list[0].story;
    if (!byStory[st]) { byStory[st] = { story: st, threads: [], last: 0, people: 0, likes: 0, n: 0 }; sOrder.push(st); }
    var g = byStory[st];
    g.threads.push(list);
    list.forEach(function (c) { g.last = Math.max(g.last, c.ts); if (!isBot(c)) { g.n++; g.likes += (c.likes || 0); } });
  });
  return sOrder.map(function (k) { var g = byStory[k]; g.score = g.n + g.likes; return g; });
}
function waiting(list) { return isBot(list[0]) ? list.length === 1 : list.length === 1 && !list[0].op; }
function render(items) {
  ITEMS = items;
  if (!items.length) {
    app.innerHTML = '<div class="empty"><b>여기가 첫 줄이 될 자리예요</b>' +
      '브리핑을 읽다 남긴 한마디가 회차 상관없이 여기 모입니다.<br>' +
      '읽고 든 생각, 아는 이야기, 질문 — 무엇이든 좋아요.' +
      '<a class="ecta" href="/">오늘 브리핑 읽으러 가기 →</a></div>';
    return;
  }
  var gs = groups(items);
  drawTop(items, gs);
  if (FILT === 'hot') gs = gs.slice().sort(function (a, b) { return b.score - a.score || b.last - a.last; });
  else gs = gs.slice().sort(function (a, b) { return b.last - a.last; });
  if (FILT === 'ask') gs = gs.map(function (g) { var t = g.threads.filter(waiting); return t.length ? { story: g.story, threads: t } : null; }).filter(Boolean);
  if (!gs.length) { app.innerHTML = '<div class="empty"><b>답을 기다리는 글이 없어요</b>지금은 모두 대화가 이어지고 있어요 👏</div>'; return; }
  app.innerHTML = gs.map(function (g) {
    var st = g.story;
    return '<section class="sg" id="s-' + esc(st) + '">' +
      '<a class="src" href="' + href(st) + '">' +
        '<span class="lb">' + (slabel(st) ? esc(slabel(st)) + ' · ' : '') + sdate(st) + ' 브리핑</span>' +
        '<span class="ti">' + esc(label(st)) + '</span>' +
      '</a>' +
      // 인스타 피드식 접기(KD 10/26 「순살톡도 오늘의 질문처럼 — 참여는 늘리고 간결하게」):
      //   스토리마다 최근 2스레드만(나머지는 「댓글 N개 모두 보기」), 답글이 2개 넘으면 마지막 1개만(「└ 이전 답글 N개 보기」)
      (function () {
        var all = OPENALL[st], ths = all ? g.threads : g.threads.slice(0, 2), total = 0;
        g.threads.forEach(function (l) { total += l.length; });
        var more = !all && g.threads.length > 2 ? '<button type="button" class="morec" data-s="' + esc(st) + '">댓글 ' + total + '개 모두 보기</button>' : '';
        return more + ths.map(function (list) {
          var head = list[0], isNew = !first && !seen[head.id], reps = list.slice(1), rid = head.root_id;
          var fold = reps.length >= 2 && !EXP[rid] ? '<button type="button" class="morer" data-r="' + rid + '">└ 이전 답글 ' + (reps.length - 1) + '개 보기</button>' : '';
          var shownReps = fold ? reps.slice(-1) : reps;
          var body = isBot(head)
            ? '<div class="q"><span class="qk">🤖 순살이 묻다</span><p>' + esc(head.body) + '</p>' +
                (reps.length ? '<div class="qa"><span>답 ' + reps.length + '</span></div>' : '') + '</div>' +
              fold + shownReps.map(function (c) { return one(c, true); }).join('')
            : one(head, head.parent_id) + fold + shownReps.map(function (c) { return one(c, true); }).join('');
          return '<div class="th' + (isNew ? ' new' : '') + '" data-r="' + rid + '">' + body + rform(rid) + '</div>';
        }).join('');
      })() +
      // 「＋ 한마디」 글자 대신 내 아바타가 붙은 입력창 모양 막대 + 상황 맞춤 문구 (오늘의 질문과 같은 참전 막대)
      // 「🤖 순살이 묻다」가 있는 스토리는 이 막대가 곧 그 질문에 답하는 자리 — 카드 속 「답하기」 버튼과 중복이라 버튼은 뺌 (KD 10/26)
      (function () {
        var bq = g.threads.filter(function (l) { return isBot(l[0]); })[0];
        return '<div class="th say" data-r="s-' + esc(st) + '">' +
          '<button type="button" class="sayb cbar" data-s="' + esc(st) + '"' + (bq ? ' data-q="' + bq[0].id + '"' : '') + '>' +
          avatar((ME && ME.nick) || prof().n || '나', 0) +
          '<span class="ph">' + (bq ? '🤖 질문에 내 답은?' : g.n ? g.n + '개 한마디 · 내 생각은?' : '첫 한마디를 남겨 보세요') + '</span><b>' + (bq ? '답하기' : '남기기') + '</b></button>' +
          rform('s-' + st) + '</div>';
      })() +
    '</section>';
  }).join('');
  items.forEach(function (c) { seen[c.id] = 1; });
  first = false;
  wire();
}
function rform(rid) {
  return '<div class="rf" data-r="' + esc(rid) + '"><span class="rav"></span><div class="bx">' +
    '<textarea rows="1" maxlength="140" placeholder="답글 남기기"></textarea>' +
    '<div class="row"><span class="who"></span>' +
    '<button type="button" class="x">취소</button>' +
    '<button type="button" class="go" disabled>남기기</button></div></div></div>';
}
// 맨 위 — 참여 현황 한 줄 · 🔥 지금 뜨거운 이야기(최근 14일 한마디+좋아요 상위 3) · 오늘의 질문
function drawTop(items, gs) {
  var now = Date.now() / 1000, wk = items.filter(function (c) { return !isBot(c) && now - c.ts < 7 * 86400; }),
      ppl = {}; wk.forEach(function (c) { ppl[c.nick] = 1; });
  var lv = document.querySelector('.hd .live');
  if (lv && wk.length) lv.innerHTML = '<b></b>이번 주 ' + wk.length + '개';
  var hot = gs.filter(function (g) { return now - g.last < 14 * 86400 && g.score >= 2; })
    .sort(function (a, b) { return b.score - a.score; }).slice(0, 3);
  var ho = document.getElementById('hot');
  if (ho) { ho.hidden = hot.length < 2;   // 하나뿐이면 줄을 따로 두지 않는다
    ho.innerHTML = '<span class="hk">🔥</span>' + hot.map(function (g) {
      return '<a href="#s-' + esc(g.story) + '" data-go="' + esc(g.story) + '">' + esc(label(g.story)) + '<b>' + g.n + '</b></a>'; }).join(''); }
}
function todayQ() {
  apiFetch('/poll').then(function (r) { return r.json(); }).then(function (j) {
    var p = j && j.poll, el = document.getElementById('tq'); if (!p || !el) return;
    var voted = 0; try { voted = parseInt(localStorage.getItem('ss_poll_' + p.day) || '0', 10); } catch (e) {}
    el.href = '/poll/#d-' + p.day;
    el.innerHTML = '<span class="k">🗳️ 오늘의 질문</span><span class="tqq">' + esc(p.q) + '</span><span class="go">' + (voted ? '결과 보기' : '투표하기') + ' →</span>';
    if (!voted) el.classList.add('ss-shine');
    el.hidden = false;
  }).catch(function () {});
}
var NICK = {};   // id → 닉네임. 답글 본문의 @태그를 정확히 집어내는 데 쓴다

function atHTML(body, toNick) {
  var s = esc(body);
  if (!toNick) return s;
  var tag = esc('@' + toNick);
  return s.indexOf(tag) === 0
    ? '<span class="at">' + tag + '</span>' + s.slice(tag.length)
    : s;
}

// 인스타식 한 덩어리(오늘의 질문과 같은 부품 모양, KD 10/26): [이름·배지 + 본문] 한 문단 · 아래 흐린 행동 줄(시간·NEW·💬 답글) · 하트는 오른쪽 끝
function one(c, isRep) {
  var tag = [c.tag, c.co].filter(Boolean).join(' · ');
  return '<div class="c' + (isRep ? ' rep' : '') + (c.op ? ' op' : '') +
    '" data-i="' + c.id + '">' +
    avatar(c.nick, c.op) +
    '<div class="bd">' +
      '<div class="tx"><span class="nmx">' + (c.u ? '<button type="button" class="k ku" data-u="' + esc(c.u) + '" title="이 회원의 지난 글">' + esc(c.nick) + ' ✓</button>'
                                  : (c.op === 2 && window.ssCrew && window.ssCrew[c.nick]
                                     ? '<button type="button" class="k ku" data-crew="' + esc(c.nick) + '" title="봇 캐릭터 소개">' + esc(c.nick) + '</button>'
                                     : '<span class="k">' + esc(c.nick) + '</span>')) + '</span>' +
        (c.op ? '<span class="ob' + (c.op === 2 ? ' bot' : '') + '">' +
          (c.op === 2 ? '🤖 봇' : '순살 팀') + '</span>' : '') +
        (tag ? '<span class="g">' + esc(tag) + '</span>' : '') + ' ' +
        atHTML(c.body, NICK[c.parent_id] || '') + '</div>' +
      '<div class="act"><span class="t">' + ago(c.ts) + '</span>' +
        (Date.now() / 1000 - c.ts < 86400 ? '<span class="nw">NEW</span>' : '') +
        '<button type="button" class="repb" data-i="' + c.id +
          '" data-k="' + esc(c.nick) + '" data-s="' + esc(c.story) + '">' +
          '💬 <span>답글</span></button>' +
      '</div>' +
    '</div>' +
    '<button type="button" class="like' + (liked[c.id] ? ' on' : '') +
      '" data-i="' + c.id + '" aria-label="좋아요">' + (liked[c.id] ? '♥' : '♡') +
      '<span>' + (c.likes || '') + '</span></button>' +
  '</div>';
}

function wire() {
  app.querySelectorAll('.like').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = parseInt(b.getAttribute('data-i'), 10), v = vid();
      if (!API || !v) return;
      b.disabled = true;
      apiFetch('/like', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: id, v: v }),
      }).then(function (r) { return r.json(); }).then(function (res) {
        b.disabled = false;
        if (!res || !res.ok) return;
        if (res.on) liked[id] = 1; else delete liked[id];
        try { localStorage.setItem('ss_liked', JSON.stringify(liked)); } catch (e) {}
        b.className = 'like' + (res.on ? ' on' : '');
        b.innerHTML = (res.on ? '♥' : '♡') + '<span>' + (res.n || '') + '</span>';
        if (res.on) { try { window.ssCanAt && window.ssCanAt(b); } catch (e) {} }
      }).catch(function () { b.disabled = false; });
    });
  });

  app.querySelectorAll('.morec').forEach(function (b) {
    b.addEventListener('click', function () { OPENALL[b.getAttribute('data-s')] = 1; render(ITEMS); });
  });
  app.querySelectorAll('.morer').forEach(function (b) {
    b.addEventListener('click', function () { EXP[b.getAttribute('data-r')] = 1; render(ITEMS); });
  });
  function myAv(rf) { var r = rf.querySelector('.rav'); if (r) r.innerHTML = avatar((ME && ME.nick) || prof().n || '나', 0); }
  app.querySelectorAll('.repb').forEach(function (b) {
    b.addEventListener('click', function () {
      var th = b.closest('.th'), rf = th.querySelector('.rf');
      myAv(rf);
      var ta = rf.querySelector('textarea'), go = rf.querySelector('.go');
      rf.className = 'rf on';
      // 답글 버튼이 그대로 있으면 같은 기능이 두 군데 있는 것처럼 보인다
      th.querySelectorAll('.repb').forEach(function (x) { x.style.visibility = 'hidden'; });
      rf._btns = th;
      rf._pid = parseInt(b.getAttribute('data-i'), 10);
      rf._story = b.getAttribute('data-s');
      var k = b.getAttribute('data-k');
      if (k && ta.value.indexOf('@') !== 0) ta.value = '@' + k + ' ' + ta.value;
      ta.placeholder = k ? '답글 남기기' : '내 생각은…';
      rf.querySelector('.who').innerHTML = whoLabel();
      go.disabled = !ta.value.trim();
      ta.focus();
    });
  });

  app.querySelectorAll('.sayb').forEach(function (b) {
    b.addEventListener('click', function () {
      var th = b.closest('.th'), rf = th.querySelector('.rf'), ta = rf.querySelector('textarea');
      myAv(rf);
      var qid = parseInt(b.getAttribute('data-q') || '0', 10);
      b.style.display = 'none'; rf.className = 'rf on'; rf._btns = th; rf._pid = qid; rf._story = b.getAttribute('data-s');
      ta.placeholder = qid ? '질문에 내 생각은…' : '이 이야기, 어떻게 보셨어요?';
      rf.querySelector('.who').innerHTML = whoLabel(); ta.focus();
      rf.querySelector('.x').addEventListener('click', function () { b.style.display = ''; }, { once: true });
    });
  });
  // 답글 폼의 '누구로' 줄을 눌러 이름을 바꾼다. 스토리 댓글창에만 있고
  // 여기엔 없어서, 순살톡에서 답글만 다는 사람은 이름을 못 바꿨다.
  app.querySelectorAll('.who').forEach(function (el) {
    el.addEventListener('click', function () {
      if (ME && ME.nick) { location.href = '/account/'; return; }   // 계정 이름은 내 계정에서 바꾼다
      if (ME) { setNick(); return; }
      var p = prof();
      var v = prompt('이름을 바꿔요 (12자까지)', p.n || '');
      if (v === null) return;
      v = v.trim().slice(0, 12);
      if (!v) return;
      p.n = v;
      try { localStorage.setItem('ss_prof', JSON.stringify(p));
            localStorage.setItem('ss_nick', v); } catch (e) {}
      app.querySelectorAll('.who').forEach(function (x) {
        if (x.textContent) x.innerHTML = whoLabel();
      });
    });
  });

  app.querySelectorAll('.rf').forEach(function (rf) {
    var ta = rf.querySelector('textarea'), go = rf.querySelector('.go');
    ta.addEventListener('input', function () {
      go.disabled = !ta.value.trim();
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
    });
    ta.addEventListener('focus', function () { typing = true; });
    ta.addEventListener('blur', function () { typing = false; });
    rf.querySelector('.x').addEventListener('click', function () {
      rf.className = 'rf'; ta.value = ''; typing = false;
      if (rf._btns) rf._btns.querySelectorAll('.repb').forEach(function (x) {
        x.style.visibility = '';
      });
    });
    go.addEventListener('click', function () { submit(rf, ta, go); });
  });
}

function submit(rf, ta, go) {
  var body = ta.value.trim(), v = vid(), p = prof();
  if (!body || !API || !v) return;
  // 회원인데 별명이 없으면 첫 글 전에 한 번 묻고 이어서 보낸다
  if (ME && !ME.nick && !nickAsked) { nickAsked = true; setNick(function () { submit(rf, ta, go); }); return; }
  go.disabled = true;
  apiFetch('/comment', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      story: rf._story, v: v, nick: (ME && ME.nick) || p.n || '익명', body: body,
      tag: p.i || '', co: p.sc ? (p.c || '') : '', parent: rf._pid || 0,
    }),
  }).then(function (r) { return r.json(); }).then(function (res) {
    go.disabled = false;
    if (res && res.error) { alert('남기지 못했어요'); return; }
    ta.value = ''; rf.className = 'rf'; typing = false;
    if (rf._btns) rf._btns.querySelectorAll('.repb').forEach(function (x) { x.style.visibility = ''; });
    load();                                   // 바로 반영
  }).catch(function () { go.disabled = false; });
}

var typing = false;
function load() {
  if (!API) { app.innerHTML = '<div class="empty">집계 저장소가 연결되지 않았습니다.</div>'; return; }
  // 모바일에서 요청이 멈추면 화면이 '불러오는 중…'에 갇힌다 — 12초에 끊는다
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 12000);
  apiFetch('/recent?n=60', { signal: ctl ? ctl.signal : undefined })
    .then(function (r) { clearTimeout(timer); return r.json(); })
    .then(function (d) {
      if (d && d.off) {
        app.innerHTML = '<div class="empty"><b>코멘트를 잠시 닫았어요</b>곧 다시 열립니다.</div>';
        return;
      }
      render((d && d.items) || []);
    })
    .catch(function (e) {
      clearTimeout(timer);
      // 이미 뭔가 보여주고 있으면 건드리지 않는다 — 갱신 실패로 화면을 비우면 손해다
      if (!first) { return; }
      // 첫 시도가 실패해도 한 번은 더 해본다. 순간적인 끊김이 대부분이라
      // 사람이 새로고침하기 전에 스스로 붙는 경우가 많다.
      if (!load._retried) {
        load._retried = 1;
        setTimeout(load, 1200);
        return;
      }
      // 두 번 다 실패했으면 왜 실패했는지까지 알려준다. '연결을 확인하라'만으로는
      // 느린 건지 막힌 건지 알 수 없어 다음에 물어볼 것도 없다.
      var slow = e && (e.name === 'AbortError' || String(e).indexOf('abort') >= 0);
      app.innerHTML = '<div class="empty"><b>' +
        (slow ? '응답이 너무 느려요' : '집계 서버에 닿지 못했어요') + '</b>' +
        (slow ? '잠시 뒤 다시 시도해 주세요.'
              : '광고 차단기나 사내망이 막고 있을 수 있어요.') +
        '<br><button type="button" class="go" id="retry" ' +
        'style="margin-top:12px;padding:8px 16px;border-radius:8px;cursor:pointer">' +
        '다시 시도</button></div>';
      var rb = document.getElementById('retry');
      if (rb) rb.addEventListener('click', function () {
        load._retried = 0;
        app.innerHTML = '<div class="empty">불러오는 중…</div>';
        load();
      });
    });
}

(function () {
  var f = document.getElementById('flt');
  if (f) f.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-f]'); if (!b) return;
    FILT = b.getAttribute('data-f');
    [].forEach.call(f.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
    render(ITEMS);
  });
  document.addEventListener('click', function (e) {
    var mu = e.target.closest('[data-u]');
    if (mu) { if (window.ssMember) window.ssMember(mu.getAttribute('data-u'), label); return; }
    var cw = e.target.closest('[data-crew]');
    if (cw && !cw.closest('#ss-crew')) { if (window.ssCrewCard) window.ssCrewCard(cw.getAttribute('data-crew')); return; }
    var a = e.target.closest('#hot a[data-go]'); if (!a) return;
    e.preventDefault();
    if (FILT === 'ask') { FILT = 'new'; [].forEach.call(document.querySelectorAll('#flt button'), function (x) { x.classList.toggle('on', x.getAttribute('data-f') === 'new'); }); render(ITEMS); }
    var t = document.getElementById('s-' + a.getAttribute('data-go'));
    if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); t.classList.add('flash'); setTimeout(function () { t.classList.remove('flash'); }, 1600); }
  });
})();
load();
// 상시 폴링은 없앴다(KD 2026-09-12) — 열어둔 탭이 15초마다 D1 을 때려
// rows_read 를 하루 수백만으로 밀어올렸다. 트래픽 낮은 지금 라이브 효과는 과하다.
// 대신 「들어올 때」에만 읽는다: 최초 로드 + 탭에 다시 돌아왔을 때 1회.
// (내가 쓴 댓글은 post 핸들러가 곧바로 반영하므로 내 글은 바로 보인다.)
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

</script>
