#soonsal-live-ticker::before{left:0;background:linear-gradient(to right,#0a0a0a,transparent)}
#soonsal-live-ticker::after{right:0;background:linear-gradient(to left,#0a0a0a,transparent)}
#soonsal-live-ticker .stk-track{display:flex;align-items:center;width:max-content;height:34px;animation:stk-scroll 90s linear infinite}
#soonsal-live-ticker .stk-track:hover{animation-play-state:paused}
@keyframes stk-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
#soonsal-live-ticker .stk-item{display:inline-flex;align-items:center;gap:7px;padding:0 16px;border-right:1px solid #1a1a1a;white-space:nowrap;flex-shrink:0}
#soonsal-live-ticker .stk-lbl{font-family:'DM Sans',-apple-system,sans-serif;font-size:11px;font-weight:600;color:#555;letter-spacing:0.3px;text-transform:uppercase}
#soonsal-live-ticker .stk-lbl.crypto{color:#F07040}
#soonsal-live-ticker .stk-prc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#e0ddd8;letter-spacing:-0.3px}
#soonsal-live-ticker .stk-chg{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:3px}
#soonsal-live-ticker .stk-chg.up{color:#4ade80;background:rgba(74,222,128,0.08)}
#soonsal-live-ticker .stk-chg.down{color:#f87171;background:rgba(248,113,113,0.08)}
#soonsal-live-ticker .stk-chg.zero{color:#777}
#soonsal-live-ticker .au{display:inline-block;width:0;height:0;border-style:solid;border-width:0 3px 5px;border-color:transparent transparent #4ade80}
#soonsal-live-ticker .ad{display:inline-block;width:0;height:0;border-style:solid;border-width:5px 3px 0;border-color:#f87171 transparent transparent}
#soonsal-live-ticker .stk-div{display:inline-flex;align-items:center;padding:0 12px;flex-shrink:0}
#soonsal-live-ticker .stk-div span{width:3px;height:3px;border-radius:50%;background:#F07040}
#soonsal-live-ticker .stk-ts{display:inline-flex;align-items:center;gap:5px;padding:0 16px;flex-shrink:0}
#soonsal-live-ticker .stk-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:stk-pulse 2s ease-in-out infinite}
@keyframes stk-pulse{0%,100%{opacity:1}50%{opacity:0.3}}
#soonsal-live-ticker .stk-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;letter-spacing:0.5px}
#soonsal-live-ticker .stk-loading{display:flex;align-items:center;justify-content:center;height:34px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#555;gap:8px}
#soonsal-live-ticker .stk-spin{width:10px;height:10px;border:2px solid #222;border-top-color:#F07040;border-radius:50%;animation:stk-sp 0.8s linear infinite}
@keyframes stk-sp{to{transform:rotate(360deg)}}

a.total_market_cap.usd;var mch=global.data.market_cap_change_percentage_24h_usd;if(mc){crypto['Crypto Total']={price:'$'+(mc/1e12).toFixed(2)+'T',change:(mch>=0?'+':'')+(mch||0).toFixed(2)+'%',direction:mch>0?'up':mch<0?'down':'zero'}}}lastCrypto=crypto;return crypto}).catch(function(e){console.warn('[Ticker] Crypto error:',e.message);return null})}function render(){var tradfi=lastTradfi?lastTradfi.tradfi:{};var crypto=lastCrypto||{};var kst=lastTradfi?lastTradfi.kst:new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});var html=[];html.push('<div class="stk-ts"><span class="stk-dot"></span><span class="stk-time">'+esc(kst)+' KST</span></div>');for(var i=0;i<TRADFI_ORDER.length;i++){var name=TRADFI_ORDER[i];var d=tradfi[name];if(d)html.push(makeItem(name,d,false))}html.push('<div class="stk-div"><span></span></div>');for(var j=0;j<CRYPTO_ORDER.length;j++){var cname=CRYPTO_ORDER[j];var cd=crypto[cname];if(cd)html.push(makeItem(cname,cd,true))}var track=html.join('');container.innerHTML='<div class="stk-track">'+track+track+'</div>'}function makeItem(name,d,isCrypto){var dir=d.direction||'zero';var arrow=dir==='up'?'<span class="au"></span>':dir==='down'?'<span class="ad"></span>':'';return'<div class="stk-item"><span class="stk-lbl'+(isCrypto?' crypto':'')+'">'+esc(name)+'</span><span class="stk-prc">'+esc(d.price)+'</span><span class="stk-chg '+dir+'">'+arrow+' '+esc(d.change)+'</span></div>'}function formatNum(n){if(n>=10000)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=100)return n.toFixed(2);if(n>=1)return n.toFixed(2);return n.toFixed(4)}function esc(s){if(!s)return'';var d=document.createElement('span');d.textContent=String(s);return d.innerHTML}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}})();

function wireTrend(root) {

    var card = t.closest('.card, .spark') || t.parentNode;
    var out = card.querySelector('.rd');
    if (!out) return;
    var bars = [].slice.call(t.querySelectorAll('i'));
    function show(x) {
      var hit = null;
      bars.forEach(function (b) {
        var r = b.getBoundingClientRect();
        if (x >= r.left - 1 && x <= r.right + 1) hit = b;
        b.classList.remove('on');
      });
      // 막대 사이 틈에 닿아도 가장 가까운 걸 잡는다 — 폰에서 자주 빗나간다
      if (!hit && bars.length) {
        var best = Infinity;
        bars.forEach(function (b) {
          var r = b.getBoundingClientRect(), d = Math.abs((r.left + r.right) / 2 - x);
          if (d < best) { best = d; hit = b; }
        });
      }
      if (!hit) return;
      hit.classList.add('on');
      out.textContent = hit.getAttribute('data-d') + ' · ' + hit.getAttribute('data-v');
    }
    function clear() {
      bars.forEach(function (b) { b.classList.remove('on'); });
      out.textContent = '';
    }
    t.addEventListener('pointermove', function (e) { show(e.clientX); });
    t.addEventListener('pointerdown', function (e) { show(e.clientX); });
    t.addEventListener('pointerleave', clear);
    t.addEventListener('pointercancel', clear);
  });
}

function bars(items, unit) {
  var max = 0;
  items.forEach(function (i) { if (i[1] > max) max = i[1]; });
  if (!max) return '<div class="empty">아직 데이터가 없습니다.</div>';
  return items.map(function (i) {
    return '<div class="bar"><span class="nm" title="' + i[0] + '">' + i[0] + '</span>' +
      '<span class="tr"><span class="fl" style="width:' + Math.max(2, i[1] / max * 100) + '%"></span></span>' +
      '<span class="vn">' + i[1] + (unit || '') + '</span></div>';
  }).join('');
}

function dailyChart(days, title, series, note, unit) {
  series = (series || []).filter(function (s) {
    return days.some(function (d) {
      var v = s.value(d);
      return v !== null && v !== undefined;
    });
  });
  if (!days.length || !series.length) {
    return '<div class="card ch"><div class="cht">' + title + '</div>' +
      '<div class="empty">집계 전</div></div>';
  }
  var max = 1;
  days.forEach(function (d) {
    series.forEach(function (s) {
      var v = s.value(d);
      if (v !== null && v !== undefined && Number(v) > max) max = Number(v);
    });
  });
  var minw = Math.max(320, days.length * Math.max(7, series.length * 3));
  var groups = days.map(function (d) {
    return '<span class="dg">' + series.map(function (s) {
      var raw = s.value(d), missing = raw === null || raw === undefined;
      var val = missing ? 0 : Number(raw) || 0;
      var shown = missing ? '집계 전' : val.toLocaleString() + (unit || '');
      return '<i style="height:' + (missing ? 2 : Math.max(2, val / max * 68)) +
        'px;background:' + (missing ? '#383838' : s.color) + '" data-d="' + d +
        '" data-v="' + esc(s.name + ' ' + shown) + '"></i>';
    }).join('') + '</span>';
  }).join('');
  return '<div class="card ch"><div class="cht">' + title + ' <b class="rd"></b></div>' +
    '<div class="chart-scroll"><div class="trend multi" style="min-width:' + minw + 'px">' +
    groups + '</div></div><div class="tl"><span>' + days[0].slice(5) + '</span><span>' +
    days[days.length - 1].slice(5) + '</span></div><div class="lgd">' +
    series.map(function (s) {
      return '<span><b style="background:' + s.color + '"></b>' + esc(s.name) + '</span>';
    }).join('') + '</div>' + (note ? '<p class="note">' + note + '</p>' : '') + '</div>';
}

function median(nums) {

  if (!a.length) return 0;
  var m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

function contentMatrix(rows, id, outcomesComparable) {

  var eligible = rows.filter(function (r) { return r.views > 0 || r.dwell > 0; });
  if (!eligible.length) {
    return '<div class="matrix-wrap"><div class="matrix-head"><b>콘텐츠 기회 매트릭스</b></div>' +
      '<div class="empty">유효 열람·체류 데이터가 쌓이면 표시됩니다.</div></div>';
  }

  var pins = eligible.filter(function (r) { return r.dwell >= medD && r.views <= medV; })

  var maxD = Math.max.apply(null, usable.map(function (r) { return r.dwell; }).concat([1]));

    var rr = useOutcomes ? Math.min(12, 5 + Math.sqrt(r.outcomes || 0) * 1.8) : 7;

      'data-discover-label="' + discoverLabel + '" data-discover-observed="' + (r.sourceObserved ? '1' : '0') + '" ' +

    '<line x1="' + mx + '" x2="' + mx + '" y1="' + top + '" y2="' + (h-bottom) + '" stroke="#444"/>' +
    '<line x1="' + left + '" x2="' + (w-right) + '" y1="' + my + '" y2="' + my + '" stroke="#444"/>' +
    '<text x="' + (left+6) + '" y="' + (top+14) + '" fill="#aaa" font-size="9">유통 강화 후보</text>' +

    '<text x="' + (w/2) + '" y="' + (h-10) + '" text-anchor="middle" fill="#aaa" font-size="10">유효 열람 →</text>' +
    '<text transform="translate(12 ' + (h/2) + ') rotate(-90)" text-anchor="middle" fill="#aaa" font-size="10">평균 체류(초) →</text>' +
    points + '</svg></div><div class="matrix-detail" id="' + id + '">' +

function sourceMix(rows) {

  rows.forEach(function (r) {
    Object.keys(r.referrals || {}).forEach(function (s) {
      var n = Number(r.referrals[s]) || 0; sums[s] = (sums[s] || 0) + n; total += n;
    });

  var keys = Object.keys(sums).sort(function (a, b) { return sums[b] - sums[a]; });

var SORTS = [
  ['hot',  '반응 많은 순'],
  ['new',  '최신 반응 순'],
  ['date', '콘텐츠 날짜 순'],
];
var SORT = 'hot';
try { SORT = localStorage.getItem('ss_sort') || 'hot'; } catch (e) {}

var PAGE = 30;   // 한 번에 그리는 줄 수 — 스크롤이 끝에 닿으면 더 그린다

function sparkline(b, now, act) {
  var max = 0;
  b = b || [];
  b.forEach(function (n) { if (n > max) max = n; });
  if (!max) return '';
  // 하루를 고르면 서버가 그날 0~23시로 보낸다. 아니면 지금 기준 최근 24시간.
  var of = act && act.hoursOf;
  var bs = b.map(function (n, i) {
    var hh = of ? i : new Date((now - (23 - i) * 3600) * 1000).getHours();
    return '<i style="height:' + Math.max(2, Math.round(n / max * 34)) +
           'px" data-d="' + hh + '시" data-v="' + n + '건"></i>';
  }).join('');
  return '<div class="spark"><div class="sl">' +
    (of ? of + ' 시간대별' : '최근 24시간 (시간대별)') +
    ' <b class="rd"></b></div><div class="bars trend">' + bs + '</div></div>';
}

function rowHTML(k, by, last, now) {
  var m = SMAP[k] || { t: k, d: '' };
  m = { t: m.t, d: m.d, u: m.u || sUrl(k) };
  return '<a class="row" href="' + m.u + '"><span class="dt">' + (m.d || '').slice(5) + '</span>' +
    '<span class="ti">' + m.t + '</span><span class="when">' + ago(last[k], now) + '</span>' +
    '<span class="cnt">' + EMO.map(function (e) {
      var n = by[k][e] || 0;
      return '<span class="' + (n ? '' : 'z') + '">' + e + ' ' + n + '</span>';
    }).join('') + '</span></a>';
}

function renderReactions() {
  var obj = D.counts || {}, act = D.activity;
  var last = (act && act.last) || {}, hours = (act && act.hours) || [];
  var now = (act && act.now) || Math.floor(Date.now() / 1000);

  var by = {}, sum = {};
  Object.keys(obj).forEach(function (s) {
    by[s] = obj[s];
    var n = 0;
    EMO.forEach(function (e) { n += obj[s][e] || 0; });
    sum[s] = n;
  });

  var keys = Object.keys(by);
  if (!keys.length) { app.innerHTML = '<div class="empty">아직 반응이 없습니다.</div>'; return; }

  var cmp = {
    hot:  function (a, b) { return (sum[b] - sum[a]) || ((last[b] || 0) - (last[a] || 0)); },
    new:  function (a, b) { return ((last[b] || 0) - (last[a] || 0)) || (sum[b] - sum[a]); },
    date: function (a, b) {
      var da = (SMAP[a] || {}).d || '', db = (SMAP[b] || {}).d || '';
      return (db < da ? -1 : db > da ? 1 : 0) || (sum[b] - sum[a]);
    },
  };
  keys.sort(cmp[SORT] || cmp.hot);

  var tot = 0;
  keys.forEach(function (k) { tot += sum[k]; });
  var d1 = (act && act.d1) || 0, d7 = (act && act.d7) || 0, newest = 0;
  Object.keys(last).forEach(function (k) { if (last[k] > newest) newest = last[k]; });
  var per = DAYSEL || ('최근 ' + WIN + '일');

  var h = '<div class="sum">' + kpi(tot, '반응', per, true) +
    kpi((act && act.win) || 0, '이 기간 반응', per, true) +
    kpi(d1, '최근 24시간', null, true) + kpi(d7, '최근 7일', null, true) +
    kpi(keys.length, '반응받은 스토리', per, true) + '</div>' + sparkline(hours, now, act) +
    (newest ? '<p class="sub" style="margin:14px 0 4px">마지막 반응 ' + ago(newest, now) + '</p>' : '');

  h += '<div class="tabs sortbar">' + SORTS.map(function (s) {
    return '<button data-s="' + s[0] + '"' + (s[0] === SORT ? ' class="on"' : '') + '>' + s[1] + '</button>';
  }).join('') + '<span class="cn">' + keys.length + '개</span></div>' +
    '<div id="rows"></div><div id="more"></div>';
  app.innerHTML = h;
  wireTrend(app);

  app.querySelectorAll('.sortbar button').forEach(function (b) {
    b.addEventListener('click', function () {
      SORT = b.getAttribute('data-s');
      try { localStorage.setItem('ss_sort', SORT); } catch (e) {}
      renderReactions();
    });
  });

  // 스크롤이 바닥에 닿을 때만 다음 묶음을 그린다. 400개가 넘어가면 한 번에
  // 다 그리는 비용이 눈에 띄어서, 보이는 만큼만 만든다.
  var rows = document.getElementById('rows'), sent = document.getElementById('more'), n = 0;
  function draw() {
    var part = keys.slice(n, n + PAGE);
    if (!part.length) { sent.innerHTML = ''; return; }
    rows.insertAdjacentHTML('beforeend', part.map(function (k) {
      return rowHTML(k, by, last, now);
    }).join(''));
    n += part.length;
    sent.innerHTML = n < keys.length
      ? '<button class="more">' + (keys.length - n) + '개 더 보기</button>' : '';
    var mb = sent.querySelector('button');
    if (mb) mb.addEventListener('click', draw);
  }
  draw();
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (es) {
      if (es[0].isIntersecting && n < keys.length) draw();
    }, { rootMargin: '300px' });
    io.observe(sent);
  }
}

// ── 탭 ───────────────────────────────────────────────────
// ── 댓글 (자동 판정 감사) ────────────────────────────────
// 사람이 처리하는 대기열이 아니다. moderate_comments.py(LLM)가 이미 판정한 결과를
// 훑어보고, 틀린 게 있을 때만 뒤집는 화면이다. 관리자 키가 없으면 읽기만 된다.
var ADMIN = null;
try { ADMIN = localStorage.getItem('ss_admin'); } catch (e) {}

var ST = { '1': ['live', '공개'], '0': ['hold', '검토 중'], '-1': ['hold', '숨김'], '-2': ['spam', '스팸'] };

function modFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'x-admin-key': ADMIN || '', 'content-type': 'application/json' },
                               opts.headers || {});
  return fetch(API.replace(/[/]$/, '') + path, opts).then(function (r) {
    if (r.status === 401) throw new Error('unauthorized');
    return r.json();
  });
}

function askKey() {
  var k = prompt('관리자 키를 넣어주세요 (한 번만)');
  if (!k) return;
  try { localStorage.setItem('ss_admin', k.trim()); } catch (e) {}
  ADMIN = k.trim();
  renderComments();
}

function setState(id, st) {
  modFetch('/mod', { method: 'POST', body: JSON.stringify({ id: id, state: st, judge: '수동' }) })
    .then(renderComments)
    .catch(function () { alert('반영하지 못했습니다'); });
}

function cmRow(c, canAct) {
  var s = ST[String(c.state)] || ['', ''];
  var when = new Date(c.ts * 1000);
  var h = '<div class="cm"><span class="k">' + esc(c.nick) + '</span><span class="b">' +
    '<span class="tag ' + s[0] + '">' + s[1] + '</span>' +
    (c.hold ? '<span class="tag">' + esc(c.hold) + '</span>' : '') + esc(c.body) +
    (c.judge ? '<span class="j">판정: ' + esc(c.judge) + '</span>' : '') + '</span>' +
    '<span class="s">' + (when.getMonth() + 1) + '/' + when.getDate() + '</span>';
  if (canAct) {
    h += '<span class="act">' +
      (c.state !== 1 ? '<button data-a="1" data-i="' + c.id + '">공개</button>' : '') +
      (c.state !== -1 ? '<button data-a="-1" data-i="' + c.id + '">숨김</button>' : '') +
      '</span>';
  }
  return h + '</div>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function renderComments() {
  if (!ADMIN) {
    app.innerHTML = '<div class="card"><b style="color:#F07040">잠겨 있습니다</b>' +
      '<p class="note">댓글은 <code>scripts/moderate_comments.py</code>가 매일 자동으로 판정합니다. ' +
      '이 화면은 그 결과를 확인하고 틀린 것만 뒤집는 용도입니다.</p>' +
      '<div class="tabs" style="margin-top:12px"><button id="kbtn">관리자 키 입력</button></div></div>';
    document.getElementById('kbtn').addEventListener('click', askKey);
    return;
  }
  app.innerHTML = '<div class="empty">불러오는 중…</div>';
  Promise.all([modFetch('/mod?state=0'), modFetch('/mod?state=1'), modFetch('/mod?state=-2')])
    .then(function (r) {
      var held = r[0].items || [], live = r[1].items || [], spam = r[2].items || [];
      var h = '<div class="sum">' + kpi(held.length, '검토 중', '자동 판정 대기') +
        kpi(live.length, '공개') + kpi(spam.length, '스팸 차단') + '</div>';
      if (held.length) {
        h += '<h2>검토 중 <small>다음 자동 실행에서 판정됩니다</small></h2><div class="card">' +
          held.map(function (c) { return cmRow(c, true); }).join('') + '</div>';
      }
      h += '<h2>공개된 댓글</h2><div class="card">' +
        (live.length ? live.map(function (c) { return cmRow(c, true); }).join('')
                     : '<div class="empty">아직 없습니다.</div>') + '</div>';
      if (spam.length) {
        h += '<h2>스팸으로 내려간 것 <small>자동 판정 결과 확인용</small></h2><div class="card">' +
          spam.map(function (c) { return cmRow(c, true); }).join('') + '</div>';
      }
      app.innerHTML = h;
  wireTrend(app);
      app.querySelectorAll('.act button').forEach(function (b) {
        b.addEventListener('click', function () {
          setState(parseInt(b.getAttribute('data-i'), 10), parseInt(b.getAttribute('data-a'), 10));
        });
      });
    })
    .catch(function (e) {
      if (String(e.message) === 'unauthorized') {
        try { localStorage.removeItem('ss_admin'); } catch (x) {}
        ADMIN = null;
        renderComments();
        return;
      }
      app.innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
    });
}


// ── 하루만 보기 (KD 2026-08-15: "모든 데이터를 일자별로도 볼 수 있게")
//    창(30일) 합계와 하루 값이 한 화면에 섞여 있어 어느 쪽도 못 믿었다.
//    날짜를 고르면 **모든 패널**이 그날 것만 보여준다. 필드를 늘린 게 아니라
//    서버에서 범위를 좁혀 오므로, 화면 코드는 갈라지지 않는다.
var DAYSEL = null;                 // null = 최근 30일
var load = function () {};         // 아래에서 실제 로더로 바뀐다

function dayQ() { return DAYSEL ? '&day=' + DAYSEL : ''; }

// 기간 프리셋 — 날짜 고르개보다 이게 먼저 눈에 와야 한다 (KD 2026-08-16)
var RANGES = [[1, '오늘'], [7, '7일'], [30, '30일'], [90, '90일'], [120, '전체']];
var WIN = 30;

function paintRange() {
  var el = document.getElementById('rngbar');
  if (!el) return;
  el.innerHTML = RANGES.map(function (r) {
    return '<button data-d="' + r[0] + '"' +
      (!DAYSEL && WIN === r[0] ? ' class="on"' : '') + '>' + r[1] + '</button>';
  }).join('') + '<button data-pick="1"' + (DAYSEL ? ' class="on"' : '') + '>' +
    (DAYSEL || '날짜 고르기') + '</button>';
  el.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.getAttribute('data-pick')) {
        var bar = document.getElementById('daybar');
        if (bar) bar.hidden = !bar.hidden;
        return;
      }
      DAYSEL = null; WIN = parseInt(b.getAttribute('data-d'), 10);
      var bar = document.getElementById('daybar');
      if (bar) bar.hidden = true;
      load();
    });
  });
}

function paintDays() {
  var el = document.getElementById('daybar');
  if (!el) return;
  var days = ((D.insights || {}).daily || []).map(function (d) { return d.day; });
  // 하루만 볼 땐 그날 하루치만 오므로, 고르개는 처음 목록을 계속 쓴다
  if (!DAYSEL) DAYS_ALL = days.slice(-Math.max(WIN, 30));
  var opts = (DAYS_ALL || days).slice().reverse().map(function (d) {
    return '<option value="' + d + '"' + (DAYSEL === d ? ' selected' : '') + '>' + d + '</option>';
  }).join('');
  el.innerHTML = '<label>기간</label>' +
    '<select id="daypick"><option value="">최근 ' + WIN + '일 합계</option>' + opts + '</select>' +
    '<span class="scope">' + ((D.insights || {}).scope || '') + '</span>';
  var sel = document.getElementById('daypick');
  sel.addEventListener('change', function () {
    DAYSEL = sel.value || null;
    load();
  });
}
var DAYS_ALL = null;

var TABS = [['community', '운영 판단'], ['report', '광고주 리포트'], ['reactions', '반응'], ['comments', '댓글']];
function paintTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(function (t) {
    return '<button data-t="' + t[0] + '"' + (TAB === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>';
  }).join('');
}
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  TAB = b.getAttribute('data-t');
  paintTabs();
  TAB === 'community' ? renderCommunity()
    : TAB === 'report' ? renderAdvertiser()
    : TAB === 'comments' ? renderComments()
    : renderReactions();
});

function fail() {
  app.innerHTML = '<div class="card"><b style="color:#F07040">불러오지 못했습니다</b>' +
    '<p class="note">연결이 끊겼거나 응답이 너무 느립니다.</p>' +
    '<div class="tabs" style="margin-top:12px"><button id="rt">다시 시도</button></div></div>';
  var b = document.getElementById('rt');
  if (b) b.addEventListener('click', function () { location.reload(); });
}

if (!API) {
  setup();
} else if (!ADMIN) {
  gate();                       // 키가 없으면 아무 수치도 부르지 않는다
} else {
  var base = API.replace(/[/]$/, '');
  // 타임아웃이 없으면 모바일에서 요청이 멈췄을 때 '불러오는 중…'이 영원히 남는다.
  // 실제로 폰에서 그렇게 됐다. 12초면 끊고 다시 시도할 수 있게 한다.
  var get = function (p) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 12000);
    return fetch(base + p, {
      headers: { 'x-admin-key': ADMIN },
      signal: ctl ? ctl.signal : undefined,
    }).then(function (r) {
      clearTimeout(timer);
      if (r.status === 401) throw new Error('unauthorized');
      return r.json();
    }, function (e) {
      clearTimeout(timer);
      throw e;
    });
  };
  // 날짜를 바꾸면 다시 부른다 — 그래서 함수로 묶는다
  load = function () {
  // 넷 다 같은 기간을 받아야 한다. 예전엔 /insights 만 기간을 받아서,
  //   「7일」을 눌러도 반응·시간대 막대는 안 바뀌었다 (KD 2026-08-17).
  var q = '?days=' + WIN + dayQ();
  Promise.all([get('/counts' + q), get('/activity' + q), get('/insights' + q),
               get('/topic-insights' + q)])
    .then(function (res) {
      D.counts = res[0] || {};
      D.activity = res[1];
      D.insights = res[2];
      D.storyInsights = res[3] || { topics: [] };
      paintTabs();
      paintRange();
      paintDays();
      TAB === 'comments' ? renderComments()
        : TAB === 'reactions' ? renderReactions()
        : TAB === 'report' ? renderAdvertiser() : renderCommunity();
    }).catch(function (e) {
      if (String(e.message) === 'unauthorized') {
        try { localStorage.removeItem('ss_admin'); } catch (x) {}
        ADMIN = null;
        gate();                 // 키가 틀렸으면 지우고 다시 묻는다
        return;
      }
      fail();
    });
  };
  load();
}

</script>
