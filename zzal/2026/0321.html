<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e8e8e8;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    gap: 32px;
  }

  .card {
    width: 540px;
    height: 675px;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }

  /* ============================================================
     1p — 커버
     ============================================================ */
  .cover-card {
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cover-top {
    padding: 28px 32px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cover-badge {
    background: #E55A00;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 12px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .cover-date {
    font-size: 12px;
    color: #555;
  }
  .cover-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 36px;
    gap: 16px;
  }
  .cover-title {
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    line-height: 1.4;
    word-break: keep-all;
  }
  .cover-title .em { color: #E55A00; }
  .cover-subtitle {
    font-size: 16px;
    color: #888;
    line-height: 1.5;
  }
  .cover-bottom {
    padding: 16px 32px;
    border-top: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cover-brand {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cover-brand img { width: 18px; height: 18px; object-fit: contain; }
  .cover-brand-text { font-size: 13px; font-weight: 700; color: #666; }
  .cover-swipe { font-size: 11px; color: #555; letter-spacing: 0.5px; }

  /* ============================================================
     채팅 카드
     ============================================================ */
  .chat-card {
    background: #B2C7D9;
    display: flex;
    flex-direction: column;
  }
  .chat-header {
    background: rgba(0,0,0,0.12);
    padding: 14px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chat-header-left { display: flex; align-items: center; gap: 8px; }
  .chat-header-back { font-size: 20px; color: #3a3a3a; font-weight: 700; }
  .chat-room-name { font-size: 16px; font-weight: 700; color: #1a1a1a; }
  .chat-room-count { font-size: 14px; color: #555; }
  .chat-page-num { font-size: 12px; color: #666; font-weight: 500; }

  .chat-body {
    flex: 1;
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }

  .msg { display: flex; align-items: flex-start; gap: 8px; max-width: 88%; }
  .avatar {
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .avatar-soonsal { background: #E55A00; }
  .avatar-jun     { background: #2980B9; }
  .avatar-andrew  { background: #C0392B; }
  .avatar-sean    { background: #27AE60; }

  .msg-content { display: flex; flex-direction: column; gap: 3px; }
  .msg-name { font-size: 12px; font-weight: 600; color: rgba(0,0,0,0.55); padding-left: 2px; }
  .msg-row { display: flex; align-items: flex-end; gap: 5px; }
  .bubble {
    background: #fff;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 400;
    line-height: 1.55;
    color: #111;
    max-width: 320px;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .bubble strong { font-weight: 700; }
  .bubble .num { color: #C0392B; font-weight: 700; }
  .msg-time { font-size: 10px; color: rgba(0,0,0,0.35); white-space: nowrap; flex-shrink: 0; }

  .bubble-img {
    background: transparent;
    padding: 0;
    border-radius: 12px;
    overflow: hidden;
    max-width: 260px;
  }
  .bubble-img img { display: block; width: 100%; border-radius: 12px; }

  .date-divider { text-align: center; padding: 10px 0 6px; }
  .date-divider span {
    background: rgba(0,0,0,0.15);
    color: #fff;
    font-size: 11px; font-weight: 500;
    padding: 4px 12px; border-radius: 12px;
  }

  .chat-input-bar {
    background: rgba(0,0,0,0.08);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-input-fake {
    flex: 1;
    background: #fff;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    color: #999;
  }
  .chat-send-btn {
    width: 32px; height: 32px;
    background: #F7C948;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* ============================================================
     클로징 카드
     ============================================================ */
  .closing-card {
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
  }
  .closing-logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
  }
  .closing-name {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
  }
  .closing-handle {
    font-size: 15px;
    color: #666;
    margin-top: -12px;
  }
  .closing-cta {
    font-size: 14px;
    color: #E55A00;
    font-weight: 700;
    margin-top: 8px;
  }
  .closing-disclaimer {
    font-size: 10px;
    color: #333;
    position: absolute;
    bottom: 16px;
    left: 0; right: 0;
    text-align: center;
  }
</style>

<script>
(function(){'use strict';var WORKER_URL='https://soonsal-data.kd-d0a.workers.dev/';var COINGECKO_URL='https://api.coingecko.com/api/v3';var TRADFI_ORDER=['S&P 500','NASDAQ','Dow Jones','KOSPI','US 10Y','WTI Oil','Gold','DXY','EUR/USD','USD/JPY','USD/KRW'];var CRYPTO_ORDER=['Bitcoin','Ethereum','Solana','XRP','BNB','Crypto Total'];var CRYPTO_IDS={'Bitcoin':'bitcoin','Ethereum':'ethereum','Solana':'solana','XRP':'ripple','BNB':'binancecoin'};var REFRESH=60000;var container,timer,lastTradfi,lastCrypto;function init(){container=document.getElementById('soonsal-live-ticker');if(!container)return;container.style.display='block';container.innerHTML='<div class="stk-loading"><div class="stk-spin"></div>Loading market data...</div>';fetchAll();timer=setInterval(fetchAll,REFRESH)}function fetchAll(){var p1=fetchTradFi();var p2=fetchCrypto();Promise.allSettled?Promise.allSettled([p1,p2]).then(render):Promise.all([p1.catch(function(){return null}),p2.catch(function(){return null})]).then(render)}function fetchTradFi(){return fetch(WORKER_URL).then(function(r){return r.json()}).then(function(data){if(data.tradfi)lastTradfi=data;return data}).catch(function(e){console.warn('[Ticker] TradFi error:',e.message);return null})}function fetchCrypto(){var ids=Object.values(CRYPTO_IDS).join(',');var url=COINGECKO_URL+'/simple/price?ids='+ids+'&vs_currencies=usd&include_24hr_change=true&include_market_cap=true';var globalUrl=COINGECKO_URL+'/global';return Promise.all([fetch(url).then(function(r){return r.json()}),fetch(globalUrl).then(function(r){return r.json()}).catch(function(){return null})]).then(function(results){var prices=results[0];var global=results[1];var crypto={};for(var name in CRYPTO_IDS){var id=CRYPTO_IDS[name];var d=prices[id];if(!d)continue;var p=d.usd;var ch=d.usd_24h_change||0;crypto[name]={price:'$'+formatNum(p),change:(ch>=0?'+':'')+ch.toFixed(2)+'%',direction:ch>0.01?'up':ch<-0.01?'down':'zero'}}if(global&&global.data){var mc=global.data.total_market_cap&&global.data.total_market_cap.usd;var mch=global.data.market_cap_change_percentage_24h_usd;if(mc){crypto['Crypto Total']={price:'$'+(mc/1e12).toFixed(2)+'T',change:(mch>=0?'+':'')+(mch||0).toFixed(2)+'%',direction:mch>0?'up':mch<0?'down':'zero'}}}lastCrypto=crypto;return crypto}).catch(function(e){console.warn('[Ticker] Crypto error:',e.message);return null})}function render(){var tradfi=lastTradfi?lastTradfi.tradfi:{};var crypto=lastCrypto||{};var kst=lastTradfi?lastTradfi.kst:new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});var html=[];html.push('<div class="stk-ts"><span class="stk-dot"></span><span class="stk-time">'+esc(kst)+' KST</span></div>');for(var i=0;i<TRADFI_ORDER.length;i++){var name=TRADFI_ORDER[i];var d=tradfi[name];if(d)html.push(makeItem(name,d,false))}html.push('<div class="stk-div"><span></span></div>');for(var j=0;j<CRYPTO_ORDER.length;j++){var cname=CRYPTO_ORDER[j];var cd=crypto[cname];if(cd)html.push(makeItem(cname,cd,true))}var track=html.join('');container.innerHTML='<div class="stk-track">'+track+track+'</div>'}function makeItem(name,d,isCrypto){var dir=d.direction||'zero';var arrow=dir==='up'?'<span class="au"></span>':dir==='down'?'<span class="ad"></span>':'';return'<div class="stk-item"><span class="stk-lbl'+(isCrypto?' crypto':'')+'">'+esc(name)+'</span><span class="stk-prc">'+esc(d.price)+'</span><span class="stk-chg '+dir+'">'+arrow+' '+esc(d.change)+'</span></div>'}function formatNum(n){if(n>=10000)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=100)return n.toFixed(2);if(n>=1)return n.toFixed(2);return n.toFixed(4)}function esc(s){if(!s)return'';var d=document.createElement('span');d.textContent=String(s);return d.innerHTML}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}})();
</script>
