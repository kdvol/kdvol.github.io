# (B) 클라우드 발행 — GitHub Actions. 맥/인터넷과 무관하게 GitHub 서버가 예약대로 발행.
# 설치 위치: kdvol.github.io/.github/workflows/publish-cardnews.yml
# 큐: kdvol.github.io/_queue/<slug>.json + 발행 HTML(cardnews/...) 커밋 → 이 워크플로가 소비.
name: publish-cardnews

on:
  schedule:
    # 30분 주기 재시도 (KD 2026-08-20 「github 크론은 너무 남발하지는 마 비용 나가니깐」).
    #   ★ 15분에서 30분으로 줄였다. 15분으로 걸어 둬도 **GitHub 이 그대로 안 돈다** —
    #     2026-08-20 실측 간격이 26·70·80·66·43·45분이었다(예약 워크플로는 부하 때
    #     지연·유실된다). 촘촘히 걸어 둔 값이 실제로는 안 지켜지고 있었으므로
    #     횟수를 절반으로 줄여도 실질 지연은 거의 안 늘고 비용은 반이 된다.
    # cron은 UTC. KST = UTC+9. 오전창 09:00~14:45 · 오후창 15:00~19:45 · 저녁창 20:00~21:45 KST.
    - cron: "0,30 23 * * *"   # 08:00·08:30 KST 다음날 (조간 발행창, 2026-07-15 추가)
    - cron: "0,30 0-5 * * *"   # 09:00~14:30 KST (오전 발행 + 30분 재시도)
    - cron: "0,30 6-10 * * *"  # 15:00~19:30 KST (오후 발행 + 30분 재시도)
    # ★ 저녁창 추가 (KD 2026-08-15 "엔화 IG는 오늘 밤 20:00으로"). 그 전엔 19:45 이후
    #   크론이 없어서 21:45 로 잡은 편이 **영영 안 나갔다**(수동 실행으로 겨우 냈다).
    - cron: "0,30 11-12 * * *" # 20:00~21:30 KST (저녁 발행창)
  workflow_dispatch:               # 수동 실행(첫 테스트용)
    inputs:
      only:
        description: "특정 큐 slug만 (비우면 due 전부)"
        required: false
      dry_run:
        description: "true면 IG 미게시(웹만) — 안전 테스트"
        required: false
        default: "false"
      selftest:
        description: "true면 무발행 하네스 검증만"
        required: false
        default: "false"

concurrency:                       # 겹침 방지(중복 발행 방어)
  group: publish-cardnews
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 발행 결과(done/ 이동·index 갱신) 커밋용
      issues: write                # 발행 지연 알림 이슈용
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow requests boto3 python-dotenv google-auth google-auth-oauthlib google-api-python-client
          python -m playwright install --with-deps chromium

      - name: Write config.env from secrets
        run: |
          mkdir -p ig_pipeline
          cat > ig_pipeline/config.env <<EOF
          INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID=${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FB_APP_ID=${{ secrets.FB_APP_ID }}
          FB_APP_SECRET=${{ secrets.FB_APP_SECRET }}
          EOF
        # ⚠️ deploy.py는 ~/instagram_pipeline/ 경로를 가정하므로, 런북 2-b(모듈 벤더링) 필요.

      # ★ 발행 판단 직전에 최신 main 으로 맞춘다 (2026-08-11 중복 발행 사고)
      #   actions/checkout 은 ref 를 안 주면 **실행이 큐에 들어간 순간의 커밋**을 받는다.
      #   concurrency 는 이미 있었고 줄도 제대로 세웠다. 그런데 뒤 실행이 앞 실행의
      #   「큐→done」 커밋을 못 본 채 낡은 트리로 판단해 **같은 영상을 두 번 올렸다.**
      #     11:03:40  두 번째 실행이 큐에 들어감 (이 시점 SHA 를 받는다)
      #     11:03:56  첫 실행이 done 커밋            ← 두 번째는 이걸 못 본다
      #     11:05:13  두 번째가 같은 항목을 또 발행
      #   git pull --rebase 는 **커밋 스텝**에만 있었다 — 이미 올린 뒤라 소용없다.
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "발행 판단 기준 = $(git rev-parse --short HEAD)"

      # ★★ 지연 감시는 **발행보다 먼저** 본다 (KD 2026-08-20).
      #
      #   > KD: *"learntocode는 발행됨. 근데 늦게 발행됨. 이유는 모름.
      #   >      다시 이런일이 반복되지 않으면 좋겠음"*
      #
      #   2026-08-20 에 10:00 예약분이 11:22 에 나갔다(82분 지연). 크론이 09:57 다음에
      #   11:17 에야 돌았기 때문이다. 그런데 **아무도 몰랐다** — 감시기가 이 워크플로의
      #   **마지막 스텝**이라, 크론이 안 돌면 발행과 알람이 **같이** 안 돈다.
      #   게다가 11:17 에 겨우 돌았을 땐 이미 발행 직후라 「지연 항목 없음」으로 지나갔다.
      #   **감시기가 자기가 감시할 사건을 구조적으로 못 보는 자리에 있었다.**
      #
      #   그래서 발행 **앞**으로 옮긴다. 늦게라도 한 번 돌면 「예정 시각 +30분을 넘긴
      #   항목」을 **발행 전 상태 그대로** 보고 이슈를 연다. 새 워크플로도, 새 크론도,
      #   사람 손도 필요 없다 — 스텝 순서만 바꾼 것이다.
      - name: Alert stuck queue (before publishing)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/alert_stuck_queue.py

      - name: Run publish queue
        env:
          KDVOL_ROOT: ${{ github.workspace }}
          INSTAGRAM_PIPELINE: ${{ github.workspace }}/ig_pipeline
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.selftest }}" = "true" ] && ARGS="--selftest"
          python ci/publish_from_queue.py $ARGS

      - name: Commit publish results
        # 부분 성공(예: IG 성공 + YT 실패)에서도 플랫폼 멱등 마커·attempts가 반드시 커밋돼야 한다.
        # if 없이 두면 큐 스텝 실패 시 이 스텝이 건너뛰어져 마커가 유실 → 재시도가 중복 발행이 된다.
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # auto_evolve/entity_discovery LLM 승격에 필요
        run: |
          git config user.name "soonsal-bot"
          git config user.email "bot@soonsal.com"
          python scripts/generate_seo.py || true
          git add -A
          git diff --cached --quiet || git commit -m "cardnews auto-publish [skip ci]"
          # 동시 push 안전: pull --rebase(충돌 시 merge -X ours) 후 push, 백오프 재시도
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; \
              git pull --no-rebase -X ours -m "merge origin (keep local)" origin main || true; }
            git push origin main && break
            echo "push 경합 — 재시도 $i/6"; sleep $((i*3))
          done

